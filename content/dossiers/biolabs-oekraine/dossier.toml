[inleiding]
nl = """
Eén verhaal komt al jaren terug: dat de Verenigde Staten in Oekraïne, Georgië en elders in Oost-Europa laboratoria hebben waar ze biologische wapens maken of ziektes op mensen testen. De plaats en de ziekte wisselen, het verhaal blijft. Soms wordt het groter: een netwerk van zulke labs over de hele wereld, waar Oost-Europa een deel van is. Dit dossier zet de versies die redacties hebben nagetrokken op een tijdlijn. Elke factcheck zegt wat die redactie vond; Factiz voegt geen eigen oordeel toe. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig."""
en = """
One story has been coming back for years: that the United States runs laboratories in Ukraine, Georgia and elsewhere in Eastern Europe where it makes biological weapons or tests diseases on people. The place and the disease change; the story stays. Sometimes it grows: a network of such labs around the world, with Eastern Europe as one part. This dossier puts the versions that newsrooms checked on a timeline. Each fact-check says what that newsroom found; Factiz adds no verdict of its own. The list holds only fact-checks we may republish, so it is not complete."""
de = """
Eine Erzählung kehrt seit Jahren zurück: Die Vereinigten Staaten betrieben in der Ukraine, in Georgien und anderswo in Osteuropa Labore, in denen sie biologische Waffen herstellen oder Krankheiten an Menschen testen. Ort und Krankheit wechseln, die Erzählung bleibt. Manchmal wird sie größer: ein Netz solcher Labore auf der ganzen Welt, zu dem Osteuropa gehört. Dieses Dossier ordnet die Fassungen, die Redaktionen geprüft haben, auf einer Zeitleiste. Jeder Faktencheck sagt, was die jeweilige Redaktion herausfand; Factiz fügt kein eigenes Urteil hinzu. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig."""
es = """
Un relato vuelve desde hace años: que Estados Unidos tiene laboratorios en Ucrania, Georgia y otros lugares de Europa del Este donde fabrica armas biológicas o prueba enfermedades en personas. El lugar y la enfermedad cambian; el relato sigue. A veces crece: una red de esos laboratorios por todo el mundo, de la que Europa del Este es una parte. Este dosier ordena en una cronología las versiones que las redacciones han verificado. Cada verificación dice lo que encontró esa redacción; Factiz no añade un veredicto propio. La lista solo contiene verificaciones que podemos reproducir, así que no está completa."""
fr = """
Un récit revient depuis des années : les États-Unis auraient en Ukraine, en Géorgie et ailleurs en Europe de l’Est des laboratoires où ils fabriquent des armes biologiques ou testent des maladies sur des personnes. Le lieu et la maladie changent ; le récit reste. Parfois il s’élargit : un réseau de tels laboratoires dans le monde entier, dont l’Europe de l’Est fait partie. Ce dossier place sur une chronologie les versions que des rédactions ont vérifiées. Chaque vérification dit ce que cette rédaction a trouvé ; Factiz n’ajoute aucun verdict. La liste ne contient que des vérifications que nous pouvons reprendre ; elle n’est donc pas complète."""
pt = '''
Uma mesma história volta há anos: a de que os Estados Unidos mantêm laboratórios na Ucrânia, na Geórgia e em outros lugares do Leste Europeu, onde fabricam armas biológicas ou testam doenças em pessoas. O lugar e a doença mudam; a história continua. Às vezes ela cresce: uma rede desses laboratórios pelo mundo, com o Leste Europeu como uma parte. Este dossiê coloca em uma linha do tempo as versões que as agências checaram. Cada checagem diz o que aquela agência encontrou; o Factiz não acrescenta nenhuma classificação própria. A lista traz só as checagens que podemos republicar, por isso não está completa.'''
ru = '''
Одна и та же история возвращается уже много лет: будто США держат на Украине, в Грузии и в других странах Восточной Европы лаборатории, где создают биологическое оружие или испытывают болезни на людях. Место и болезнь меняются, а история остаётся. Иногда она разрастается: сеть таких лабораторий по всему миру, а Восточная Европа лишь её часть. В этом досье версии, которые проверили редакции, расположены на временной шкале. В каждом фактчеке сказано, что нашла эта редакция. Своего вердикта Factiz не добавляет. В списке только те фактчеки, которые мы вправе перепечатывать, поэтому он неполный.'''
uk = '''
Одна історія повертається вже багато років: ніби Сполучені Штати тримають в Україні, Грузії та інших країнах Східної Європи лабораторії, де виготовляють біологічну зброю або випробовують хвороби на людях. Місце й хвороба змінюються, а історія лишається. Іноді вона розростається: мережа таких лабораторій по всьому світу, а Східна Європа лише її частина. Це досьє показує на часовій шкалі версії, які перевіряли редакції. Кожен фактчек розповідає, що встановила ця редакція, а Factiz не додає власного вердикту. У списку лише ті фактчеки, які ми можемо повторно публікувати, тож він неповний.'''
id = '''
Satu kisah terus muncul kembali selama bertahun-tahun: bahwa Amerika Serikat menjalankan laboratorium di Ukraina, Georgia, dan tempat lain di Eropa Timur untuk membuat senjata biologis atau menguji penyakit pada manusia. Tempat dan penyakitnya berubah, tetapi kisahnya tetap sama. Kadang kisah itu meluas: jaringan laboratorium semacam itu di seluruh dunia, dengan Eropa Timur sebagai salah satu bagiannya. Dosir ini menempatkan berbagai versi yang telah diperiksa redaksi pada sebuah lini masa. Setiap cek fakta menyampaikan temuan redaksi tersebut; Factiz tidak menambahkan kesimpulan sendiri. Daftar ini hanya memuat cek fakta yang boleh kami terbitkan ulang, jadi daftar ini tidak lengkap.'''
tr = '''
Yıllardır tekrar eden bir hikâye var: Amerika Birleşik Devletleri'nin Ukrayna'da, Gürcistan'da ve Doğu Avrupa'nın başka yerlerinde biyolojik silah ürettiği ya da hastalıkları insanlar üzerinde denediği laboratuvarlar işlettiği söyleniyor. Yer ve hastalık değişiyor, hikâye aynı kalıyor. Bazen daha da büyüyor: dünyanın dört bir yanında böyle laboratuvarlardan oluşan bir ağ var ve Doğu Avrupa bunun yalnızca bir parçası deniyor. Bu dosya, doğrulama kuruluşlarının incelediği farklı sürümleri bir zaman çizelgesine yerleştiriyor. Her doğrulama, o doğrulama kuruluşunun ne bulduğunu söyler; Factiz kendi kararını eklemez. Liste yalnızca yeniden yayımlama iznimiz olan doğrulamaları içerir, bu yüzden eksiksiz değildir.'''
zh = '''
多年來，有一種說法一再出現：美國在烏克蘭、喬治亞和東歐其他地方設有實驗室，在那裡製造生物武器，或對人體測試疾病。地點和疾病會變，這個說法卻一直存在。有時它還會擴大：說全世界有一整個這樣的實驗室網絡，東歐只是其中一部分。這個專題把各查核機構查核過的不同版本放在時間軸上。每一則查核報告都說明該查核機構的發現，Factiz 不另外加上自己的查核結果。這份清單只收錄我們可以轉載的查核報告，所以並不完整。'''
ja = '''
米国がウクライナやジョージア、そのほかの東欧の国々に研究所を持ち、そこで生物兵器をつくったり、人に病気の実験をしたりしている。こうした話が何年も繰り返し出てきています。場所や病気は変わっても、話の筋は変わりません。ときには、世界中にそのような研究所のネットワークがあり、東欧はその一部だという話に広がることもあります。この特集では、報道機関が検証したさまざまなバージョンを年表にまとめています。それぞれのファクトチェックには、その報道機関が確認した内容が書かれています。Factizが独自の判定を加えることはありません。一覧には、転載を許可されているファクトチェックだけを載せているため、すべてを網羅しているわけではありません。'''
hi = '''
एक कहानी सालों से बार-बार लौट रही है: अमेरिका यूक्रेन, जॉर्जिया और पूर्वी यूरोप में अन्य जगहों पर ऐसी प्रयोगशालाएं चलाता है, जहां वह जैविक हथियार बनाता है या लोगों पर बीमारियों का परीक्षण करता है। जगह और बीमारी बदल जाती है, पर कहानी वही रहती है। कभी-कभी यह और बड़ी हो जाती है: दुनिया भर में ऐसी प्रयोगशालाओं का एक नेटवर्क, जिसका एक हिस्सा पूर्वी यूरोप है। यह डोसियर उन संस्करणों को टाइमलाइन में रखता है, जिनकी न्यूज़रूम ने जांच की है। हर फैक्ट चेक बताता है कि उस न्यूज़रूम ने क्या पाया। Factiz अपना कोई निष्कर्ष नहीं जोड़ता। सूची में केवल वही फैक्ट चेक हैं जिन्हें हम दोबारा प्रकाशित कर सकते हैं, इसलिए यह सूची पूरी नहीं है।'''
ar = '''
تعود قصة واحدة منذ سنوات: أن الولايات المتحدة تدير مختبرات في أوكرانيا وجورجيا وأماكن أخرى في أوروبا الشرقية، تصنع فيها أسلحة بيولوجية أو تجرب أمراضًا على البشر. يتغير المكان ويتغير المرض، وتبقى القصة. وأحيانًا تتسع: شبكة من هذه المختبرات حول العالم، وأوروبا الشرقية جزء منها. يعرض هذا الملف على خط زمني النسخ التي دققتها المنصات. يوضح كل تدقيق ما توصلت إليه المنصة التي أجرته، ولا تضيف Factiz أي تصنيف من عندها. تضم القائمة فقط التدقيقات التي يحق لنا إعادة نشرها، لذلك فهي غير كاملة.'''
fa = '''
سال‌هاست که یک داستان بارها تکرار می‌شود: اینکه ایالات متحده در اوکراین، گرجستان و جاهای دیگر اروپای شرقی آزمایشگاه‌هایی دارد که در آن‌ها سلاح زیستی می‌سازد یا بیماری‌ها را روی انسان‌ها آزمایش می‌کند. مکان و بیماری عوض می‌شود، اما داستان همان می‌ماند. گاهی هم گسترده‌تر می‌شود: شبکه‌ای از چنین آزمایشگاه‌هایی در سراسر جهان که اروپای شرقی تنها بخشی از آن است. این پرونده روایت‌هایی را که رسانه‌ها بررسی کرده‌اند روی یک خط زمانی می‌گذارد. هر راستی‌آزمایی می‌گوید آن رسانه به چه نتیجه‌ای رسیده است؛ Factiz هیچ نتیجه‌گیری از خودش اضافه نمی‌کند. این فهرست فقط شامل راستی‌آزمایی‌هایی است که اجازه بازنشر آن‌ها را داریم، بنابراین کامل نیست.'''

