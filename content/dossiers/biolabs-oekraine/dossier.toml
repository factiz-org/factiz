Claims that the United States, the Pentagon or US-funded programmes run secret biological laboratories in Ukraine, Georgia, Armenia, Moldova, the Baltic states or elsewhere in Eastern Europe and the former Soviet Union to develop biological weapons, test diseases or vaccines on people, spread epidemics or collect the DNA of a population. It also includes claims about a worldwide network of US biolabs or US biological weapons programmes that name no region, of which Eastern Europe is a part, even when they link it to covid-19 (afbakening van de PO, 2026-11-12). It includes claims about one specific laboratory, document, shipment, outbreak or animal (birds, bats, mosquitoes) linked to such labs. It does not include: laboratories in the United States itself or outside Eastern Europe and the former Soviet Union (afbakening van de PO, 2026-11-12), claims that covid-19 in general is a bioweapon or came from the lab in Wuhan, biological weapons in Ukraine attributed to others than the United States, such as Kyiv or the German army (afbakening van de PO, 2026-11-12), claims about chemical weapons, or other claims about the war in Ukraine."""
