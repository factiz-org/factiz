bron = "Europees Parlement"
url = "https://www.europarl.europa.eu/legislative-train/theme-towards-a-new-policy-on-migration/file-eu-turkey-statement-action-plan"
[item.titel]
nl = "De EU en Turkije spreken af dat wie irregulier op de Griekse eilanden aankomt teruggaat naar Turkije, en dat voor elke teruggestuurde Syriër een andere Syriër in de EU een plek krijgt"
en = "The EU and Turkey agree that irregular arrivals on the Greek islands are returned to Turkey, and that for every Syrian returned another Syrian is resettled in the EU"
de = "Die EU und die Türkei vereinbaren, dass irregulär auf den griechischen Inseln Ankommende in die Türkei zurückgehen und für jeden zurückgeschickten Syrer ein anderer in der EU aufgenommen wird"
es = "La UE y Turquía acuerdan que quien llegue de forma irregular a las islas griegas sea devuelto a Turquía y que por cada sirio devuelto otro sea reasentado en la UE"
fr = "L’UE et la Turquie conviennent que les arrivées irrégulières sur les îles grecques sont renvoyées en Turquie et que, pour chaque Syrien renvoyé, un autre est réinstallé dans l’UE"

