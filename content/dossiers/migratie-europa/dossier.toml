en = "Frontex counts just over 239,000 irregular border crossings into the EU in 2024, 38 per cent fewer than in 2023, but more arrivals on the Canary Islands"
de = "Frontex zählt 2024 etwas mehr als 239.000 irreguläre Grenzübertritte in die EU, 38 Prozent weniger als 2023, aber mehr Ankünfte auf den Kanarischen Inseln"
es = "Frontex cuenta en 2024 algo más de 239.000 cruces irregulares de fronteras hacia la UE, un 38 % menos que en 2023, pero más llegadas a las islas Canarias"
fr = "Frontex compte en 2024 un peu plus de 239 000 franchissements irréguliers des frontières de l’UE, 38 % de moins qu’en 2023, mais davantage d’arrivées aux Canaries"

