omschrijving = """
Claims, checked from 2015 on, about migration to Europe or a European country (UK included): how many migrants,
refugees or asylum seekers arrive or live there; boats, crossings and routes (Mediterranean, Lampedusa, Canary Islands,
Ceuta, English Channel, Balkans, the Belarus and Turkey borders); NGO rescue ships; Frontex and pushbacks; EU and
national migration policy (the EU migration pact, the UN compact of Marrakesh, the deals with Turkey, Libya and Tunisia,
the Rwanda plan, asylum rules, deportations); claims that a government, the EU, the UN, Soros or an NGO invites, pays
or ships migrants to Europe; the "great replacement" or "Kalergi plan"; images said to show migrants arriving in
Europe. NOT included: claims that blame migrants for crime, violence, terror, riots or disease, or say they get money,
housing, benefits or other privileges (another dossier); migration outside Europe (US and Mexico, Asia, Africa, the
Middle East); refugees from Ukraine in 2025 or 2026."""
