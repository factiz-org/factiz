# Een dossier van het platform (PLAN #33.6, SPECS E9.S7). Een mens schrijft dit bestand; de factchecks die erbij
# horen staan in factchecks.json en komen daar alleen na goedkeuring. `python -m doublecheck.dossiers` leest en keurt.
# Concept van Claude (PLAN #37.5). De PO las het en gaf akkoord op 2026-11-19. Wat migranten
# de schuld geeft van misdaad, geweld of onrust, of zegt dat ze voorrang krijgen, staat in migranten-zondebok.

soort = "verhaal"            # verhaal of netwerk
status = "akkoord"           # concept of akkoord; alleen akkoord gaat in een uitgave
akkoord = '2026-11-19, PO: "Alle andere dossiers zijn ook akkoord"'
thema = "migration"          # uit content/themas.json
onderdeel = "borders"
verwant = ["migranten-zondebok"]

[naam]
nl = "Migratie naar Europa: aantallen, routes en beleid"
en = "Migration to Europe: numbers, routes and policy"
de = "Migration nach Europa: Zahlen, Routen und Politik"
es = "La migración a Europa: cifras, rutas y políticas"
fr = "La migration vers l’Europe : chiffres, routes et politiques"

[inleiding]
nl = """
Sinds 2015, het jaar waarin veel vluchtelingen naar Europa kwamen, gaan over migratie steeds dezelfde soorten berichten
rond: over hoeveel mensen er komen, over boten op de Middellandse Zee, in het Kanaal en bij de Canarische Eilanden, over
de grens met Belarus, over reddingsschepen van ngo's en over de afspraken van de EU met Turkije en Libië. Een deel zegt
dat regeringen, de EU, de VN of George Soros migranten naar Europa halen of betalen, of dat de bevolking met opzet wordt
vervangen, het verhaal van de omvolking. Dit dossier zet de factchecks over aantallen, routes en beleid op een
tijdlijn, naast besluiten en rapporten die bij het verhaal horen. Elke factcheck zegt wie hem maakte en wat die vond.
In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig. Berichten die migranten de schuld
geven van misdaad, geweld of onrust, of zeggen dat ze voorrang krijgen, staan in een eigen dossier."""
en = """
Since 2015, the year many refugees came to Europe, the same kinds of posts about migration keep circulating: how many
people arrive, boats in the Mediterranean, in the Channel and off the Canary Islands, the border with Belarus, rescue
ships run by NGOs, and the EU's deals with Turkey and Libya. Some say that governments, the EU, the UN or George Soros
bring migrants to Europe or pay them to come, or that the population is being replaced on purpose, the story of the
"great replacement". This dossier puts the fact-checks about numbers, routes and policy on a timeline, next to
decisions and reports that belong to the story. Each fact-check says who made it and what they found. The list holds
only fact-checks we may republish, so it is not complete. Posts that blame migrants for crime, violence or unrest, or
say they get special treatment, have a dossier of their own."""
de = """
Seit 2015, dem Jahr, in dem viele Geflüchtete nach Europa kamen, kursieren über Migration immer wieder dieselben Arten
von Beiträgen: wie viele Menschen kommen, Boote im Mittelmeer, im Ärmelkanal und vor den Kanarischen Inseln, die Grenze
zu Belarus, Rettungsschiffe von NGOs und die Abkommen der EU mit der Türkei und Libyen. Ein Teil behauptet, Regierungen,
die EU, die UN oder George Soros holten Migranten nach Europa oder bezahlten sie dafür, oder die Bevölkerung werde
absichtlich ausgetauscht, die Erzählung vom „großen Austausch“. Dieses Dossier ordnet die Faktenchecks zu Zahlen,
Routen und Politik auf einer Zeitleiste, neben Beschlüssen und Berichten, die zu der Erzählung gehören. Jeder
Faktencheck sagt, wer ihn gemacht hat und was er ergab. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen;
sie ist also nicht vollständig. Beiträge, die Migranten für Kriminalität, Gewalt oder Unruhen verantwortlich machen
oder behaupten, sie würden bevorzugt, haben ein eigenes Dossier."""
es = """
Desde 2015, el año en que muchos refugiados llegaron a Europa, circulan una y otra vez los mismos tipos de mensajes sobre
la migración: cuántas personas llegan, las embarcaciones en el Mediterráneo, en el canal de la Mancha y frente a las
islas Canarias, la frontera con Bielorrusia, los barcos de rescate de las ONG y los acuerdos de la UE con Turquía y
Libia. Una parte afirma que gobiernos, la UE, la ONU o George Soros traen migrantes a Europa o les pagan para venir, o
que la población está siendo sustituida a propósito, el relato del «gran reemplazo». Este dosier ordena en una
cronología las verificaciones sobre cifras, rutas y políticas, junto a decisiones e informes que forman parte del
relato. Cada verificación dice quién la hizo y qué encontró. La lista solo contiene verificaciones que podemos
reproducir, así que no está completa. Los mensajes que culpan a los migrantes de delitos, violencia o disturbios, o
que dicen que reciben un trato de favor, tienen su propio dosier."""
fr = """
Depuis 2015, l’année où de nombreux réfugiés sont arrivés en Europe, les mêmes types de messages sur la migration
circulent sans cesse : combien de personnes arrivent, les bateaux en Méditerranée, dans la Manche et au large des îles
Canaries, la frontière avec la Biélorussie, les navires de sauvetage des ONG et les accords de l’UE avec la Turquie et
la Libye. Certains affirment que des gouvernements, l’UE, l’ONU ou George Soros font venir des migrants en Europe ou
les paient pour venir, ou que la population est remplacée à dessein, le récit du « grand remplacement ». Ce dossier
place sur une chronologie les vérifications sur les chiffres, les routes et les politiques, à côté de décisions et de
rapports qui font partie du récit. Chaque vérification dit qui l’a faite et ce qu’elle a trouvé. La liste ne contient
que des vérifications que nous pouvons reprendre ; elle n’est donc pas complète. Les messages qui accusent les
migrants de délits, de violences ou de troubles, ou qui disent qu’ils sont favorisés, ont leur propre dossier."""

[nagelezen]
nl = false
en = false
de = false
es = false
fr = false

# De tijdlijn naast de factchecks: besluiten, onderzoek en rapporten, elk zelf geopend op 2026-11-19.

