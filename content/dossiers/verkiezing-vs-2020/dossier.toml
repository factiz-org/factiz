[inleiding]
nl = """
Eén verhaal over de Amerikaanse presidentsverkiezing van 2020 komt steeds terug: dat de uitslag gestolen was, met valse stembiljetten, stemmachines die stemmen omzetten, stemmen op naam van overleden mensen of tellingen in het geheim. Het duikt ook bij latere verkiezingen weer op. Dit dossier zet de versies die redacties hebben nagetrokken op een tijdlijn. Elke factcheck zegt wat die redactie vond; Factiz voegt geen eigen oordeel toe. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig."""
en = """
One story about the 2020 US presidential election keeps coming back: that the result was stolen, with fake ballots, voting machines that switched votes, votes in the name of dead people or counting in secret. It also returns at later elections. This dossier puts the versions that newsrooms checked on a timeline. Each fact-check says what that newsroom found; Factiz adds no verdict of its own. The list holds only fact-checks we may republish, so it is not complete."""
de = """
Eine Erzählung über die US-Präsidentschaftswahl 2020 kehrt immer wieder: Das Ergebnis sei gestohlen worden, mit gefälschten Stimmzetteln, Wahlmaschinen, die Stimmen umwandelten, Stimmen im Namen Verstorbener oder heimlichen Auszählungen. Sie taucht auch bei späteren Wahlen wieder auf. Dieses Dossier ordnet die Fassungen, die Redaktionen geprüft haben, auf einer Zeitleiste. Jeder Faktencheck sagt, was die jeweilige Redaktion herausfand; Factiz fügt kein eigenes Urteil hinzu. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig."""
es = """
Un relato sobre la elección presidencial de Estados Unidos de 2020 vuelve una y otra vez: que el resultado fue robado, con papeletas falsas, máquinas de votación que cambiaban votos, votos a nombre de personas muertas o recuentos en secreto. También reaparece en elecciones posteriores. Este dosier ordena en una cronología las versiones que las redacciones han verificado. Cada verificación dice lo que encontró esa redacción; Factiz no añade un veredicto propio. La lista solo contiene verificaciones que podemos reproducir, así que no está completa."""
fr = """
Un récit sur l’élection présidentielle américaine de 2020 revient sans cesse : le résultat aurait été volé, avec de faux bulletins, des machines qui changeaient les votes, des votes au nom de personnes décédées ou des dépouillements en secret. Il ressurgit aussi lors d’élections plus récentes. Ce dossier place sur une chronologie les versions que des rédactions ont vérifiées. Chaque vérification dit ce que cette rédaction a trouvé ; Factiz n’ajoute aucun verdict. La liste ne contient que des vérifications que nous pouvons reprendre ; elle n’est donc pas complète."""
pt = '''
Uma história sobre a eleição presidencial dos EUA de 2020 não para de voltar: a de que o resultado foi roubado, com cédulas falsas, urnas que trocaram votos, votos em nome de mortos ou contagem em segredo. Ela também reaparece em eleições seguintes. Este dossiê coloca em uma linha do tempo as versões que as agências checaram. Cada checagem diz o que aquela agência encontrou; a Factiz não acrescenta nenhuma classificação própria. A lista traz apenas checagens que podemos republicar, por isso não está completa.'''
ru = '''
Об одном и том же снова и снова говорят в связи с президентскими выборами в США 2020 года: будто результат украли с помощью фальшивых бюллетеней, машин для голосования, которые переключали голоса, голосов от имени умерших или тайного подсчёта. Эта история возвращается и на более поздних выборах. В этом досье версии, которые проверили редакции, расположены на временной шкале. Каждый фактчек показывает, что нашла эта редакция. Factiz не выносит собственных вердиктов. В список входят только фактчеки, которые нам разрешено republish, поэтому он неполный.'''
uk = '''
Одна історія про президентські вибори в США 2020 року постійно повертається: що результат вкрали за допомогою підроблених бюлетенів, машин для голосування, які перемикали голоси, голосів від імені мертвих людей або таємного підрахунку. Вона з'являється і на пізніших виборах. Це досьє розміщує на часовій шкалі версії, які перевіряли редакції. Кожен фактчек показує, що виявила ця редакція; Factiz не додає власного вердикту. У списку лише ті фактчеки, які ми можемо повторно публікувати, тому він неповний.'''
id = '''
Satu kisah tentang pemilihan presiden AS 2020 terus muncul kembali: bahwa hasilnya dicuri, dengan surat suara palsu, mesin pemilihan yang memindahkan suara, suara atas nama orang yang sudah meninggal, atau penghitungan secara diam-diam. Kisah ini juga muncul lagi pada pemilu berikutnya. Dosir ini menempatkan versi-versi yang diperiksa oleh redaksi dalam satu lini masa. Setiap cek fakta menyampaikan apa yang ditemukan redaksi tersebut; Factiz tidak menambahkan kesimpulan sendiri. Daftar ini hanya memuat cek fakta yang boleh kami terbitkan ulang, jadi tidak lengkap.'''
tr = '''
2020 ABD başkanlık seçimiyle ilgili bir hikâye sürekli geri geliyor: Sonucun sahte oy pusulalarıyla, oyları değiştiren oy verme makineleriyle, ölmüş kişiler adına kullanılan oylarla ya da gizlice yapılan sayımla çalındığı iddiası. Aynı hikâye sonraki seçimlerde de yeniden ortaya çıkıyor. Bu dosya, doğrulama kuruluşlarının incelediği farklı biçimlerini bir zaman çizelgesine koyar. Her doğrulama, o doğrulama kuruluşunun ne bulduğunu söyler; Factiz kendi başına bir karar eklemez. Liste yalnızca yeniden yayımlayabildiğimiz doğrulamaları içerir, bu yüzden eksiksiz değildir.'''
zh = '''
關於 2020 年美國總統大選，有一種說法一再出現：選舉結果被竊取，手法包括偽造選票、投票機轉換票數、冒用死者名義投票，或祕密計票。這種說法在後來的選舉中也一再重現。這份專題把查核機構查證過的各種版本放在時間軸上。每一則查核報告都說明該查核機構的發現，Factiz 不另外加上自己的查核結果。清單只收錄我們可以轉載的查核報告，所以並不完整。'''
ja = '''
2020年のアメリカ大統領選挙については、結果は盗まれたという話が繰り返し出てきます。偽の投票用紙、票を入れ替える投票機、死者の名前での投票、秘密の開票などが挙げられています。この話は、その後の選挙でも再び出てきます。この特集では、報道機関が検証した各バージョンを時系列に並べています。それぞれのファクトチェックは、その報道機関が確認した内容を示しています。Factizが独自の判定を加えることはありません。一覧に載せているのは、再掲載が認められたファクトチェックだけなので、すべてを網羅しているわけではありません。'''
hi = '''
2020 के अमेरिकी राष्ट्रपति चुनाव को लेकर एक कहानी बार-बार लौटती है: कि नतीजा चुरा लिया गया, जाली मतपत्रों से, वोट बदलने वाली वोटिंग मशीनों से, मृत लोगों के नाम पर पड़े वोटों से या चोरी-छिपे हुई गिनती से। यह कहानी बाद के चुनावों में भी लौटती है। इस डोसियर में उन संस्करणों को समयरेखा पर रखा गया है जिनकी न्यूज़रूम ने जांच की। हर फैक्ट चेक बताता है कि उस न्यूज़रूम ने क्या पाया; Factiz अपना कोई निष्कर्ष नहीं जोड़ता। इस सूची में केवल वही फैक्ट चेक हैं जिन्हें हम दोबारा प्रकाशित कर सकते हैं, इसलिए यह पूरी नहीं है।'''
ar = '''
قصة واحدة عن الانتخابات الرئاسية الأمريكية لعام 2020 تعود مرة بعد أخرى: أن النتيجة سُرقت، عبر بطاقات اقتراع مزورة، أو آلات تصويت حوّلت الأصوات، أو أصوات باسم أشخاص متوفين، أو فرز سري. وتعود القصة أيضًا في انتخابات لاحقة. يضع هذا الملف على خط زمني النسخ التي دققتها منصات إخبارية. يوضح كل تدقيق ما توصلت إليه تلك المنصة، ولا تضيف Factiz أي تصنيف من عندها. تضم القائمة فقط التدقيقات التي يحق لنا إعادة نشرها، لذلك فهي ليست كاملة.'''
fa = '''
یک داستان درباره انتخابات ریاست‌جمهوری ۲۰۲۰ آمریکا مدام تکرار می‌شود: اینکه نتیجه دزدیده شده است، با برگه‌های رأی جعلی، دستگاه‌های رأی‌گیری که رأی‌ها را عوض کرده‌اند، رأی به نام مردگان یا شمارش مخفیانه. این داستان در انتخابات‌های بعدی هم دوباره پیش می‌آید. این پرونده نسخه‌هایی را که رسانه‌ها بررسی کرده‌اند روی یک خط زمانی می‌گذارد. هر راستی‌آزمایی می‌گوید آن رسانه چه یافته است؛ Factiz نتیجه‌گیری خودش را اضافه نمی‌کند. این فهرست فقط شامل راستی‌آزمایی‌هایی است که اجازه بازنشر آن‌ها را داریم، پس کامل نیست.'''

