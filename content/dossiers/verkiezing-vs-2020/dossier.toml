[[item]]
soort = "besluit"
datum = "2020-11-12"
bron = "CISA"
url = "https://www.cisa.gov/news-events/news/joint-statement-elections-infrastructure-government-coordinating-council-election-infrastructure"
[item.titel]
nl = "CISA en verkiezingsfunctionarissen zeggen dat er geen bewijs is dat een stemsysteem stemmen wiste, verloor of veranderde, en noemen de verkiezing de veiligste in de Amerikaanse geschiedenis"
en = "CISA and election officials say there is no evidence any voting system deleted, lost or changed votes, and call the 2020 election the most secure in American history"
de = "CISA und Wahlbeamte erklären, es gebe keinen Beleg, dass ein Wahlsystem Stimmen gelöscht, verloren oder verändert habe, und nennen die Wahl die sicherste der US-Geschichte"
es = "CISA y responsables electorales dicen que no hay pruebas de que un sistema de voto borrara, perdiera o cambiara votos, y llaman a estas elecciones las más seguras de EE. UU."
fr = "La CISA et des responsables électoraux disent qu’aucune preuve ne montre qu’un système de vote ait effacé, perdu ou modifié des voix, et parlent de l’élection la plus sûre du pays"
pt = "A CISA e autoridades eleitorais dizem que não há provas de que algum sistema de votação tenha apagado, perdido ou alterado votos, e chamam a eleição de 2020 de a mais segura da história dos EUA"
ru = "CISA и избирательные органы заявляют, что нет доказательств удаления, потери или изменения голосов системами голосования, и называют выборы 2020 года самыми безопасными в истории США"
uk = "CISA та виборчі посадовці кажуть, що жодна система голосування не видалила, не втратила і не змінила голосів, а вибори 2020 року найбезпечніші в історії Америки"
id = "CISA dan pejabat pemilu menyatakan tidak ada bukti sistem pemungutan suara menghapus, menghilangkan, atau mengubah suara, dan menyebut pemilu 2020 paling aman dalam sejarah Amerika"
tr = "CISA ve seçim yetkilileri, hiçbir oy verme sisteminin oyları sildiğine, kaybettiğine ya da değiştirdiğine dair kanıt olmadığını söylüyor ve 2020 seçimini ABD tarihinin en güvenli seçimi sayıyor"
zh = "CISA 與選務官員表示，沒有證據顯示任何投票系統刪除、遺失或更改選票，並稱 2020 年大選是美國歷史上最安全的一次選舉"
ja = "CISAと選挙管理当局は、投票システムが票を削除したり、失ったり、変更したりした証拠はないと述べ、2020年の選挙はアメリカ史上最も安全だったとしています"
hi = "CISA और चुनाव अधिकारी कहते हैं कि इसका कोई सबूत नहीं है कि किसी वोटिंग सिस्टम ने वोट मिटाए, खोए या बदले, और 2020 के चुनाव को अमेरिकी इतिहास का सबसे सुरक्षित चुनाव बताते हैं"
ar = "وكالة CISA ومسؤولو الانتخابات يقولون إنه لا يوجد دليل على أن أي نظام تصويت حذف أصواتًا أو أضاعها أو غيّرها، ويصفون انتخابات 2020 بأنها الأكثر أمانًا في تاريخ أمريكا"
fa = "CISA و مسئولان انتخابات می‌گویند هیچ مدرکی وجود ندارد که نشان دهد سامانه‌ای رأی‌ها را حذف کرده، گم کرده یا تغییر داده است، و انتخابات ۲۰۲۰ را امن‌ترین انتخابات تاریخ آمریکا می‌نامند"

[[item]]
soort = "rapport"
datum = "2020-11-19"
bron = "VotingWorks, for the Georgia Secretary of State"
url = "https://public-assets.voting.works/website/2020/11/georgia2020_report.pdf"
[item.titel]
nl = "Een handtelling van zo'n 5 miljoen stembiljetten bij de controle in Georgia bevestigt dat Biden de staat won, staat in het verslag van VotingWorks, dat de controle mee uitvoerde"
en = "A hand count of about 5 million ballots in Georgia's audit confirms that Biden won the state, says the report of VotingWorks, which assisted the Secretary of State"
