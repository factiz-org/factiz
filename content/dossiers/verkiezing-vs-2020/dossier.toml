es = "Un recuento a mano de unos 5 millones de papeletas en la auditoría de Georgia confirma que Biden ganó el estado, según el informe de VotingWorks, que ayudó en la auditoría"
fr = "Un recomptage manuel d’environ 5 millions de bulletins lors de l’audit en Géorgie confirme la victoire de Biden, selon le rapport de VotingWorks, qui a aidé à l’audit"
pt = "A recontagem manual de cerca de 5 milhões de cédulas na auditoria da Geórgia confirma que Biden venceu no estado, diz o relatório da VotingWorks, que ajudou o secretário de Estado"
ru = "Ручной пересчёт около 5 миллионов бюллетеней при аудите в Джорджии подтверждает, что в штате победил Байден, говорится в отчёте VotingWorks, которая помогала госсекретарю штата"
uk = "Ручний підрахунок близько 5 мільйонів бюлетенів під час аудиту в Джорджії підтверджує, що Байден переміг у штаті, йдеться у звіті VotingWorks, які допомагали держсекретарю штату"
id = "Penghitungan manual sekitar 5 juta surat suara dalam audit Georgia memastikan Biden menang di negara bagian itu, kata laporan VotingWorks, yang membantu Menteri Luar Negeri Georgia"
tr = "Georgia'da yaklaşık 5 milyon oy pusulasının elle sayıldığı denetim, Biden'ın eyaleti kazandığını doğruladı; bunu Dışişleri Bakanı'na yardım eden VotingWorks'ün raporu belirtiyor"
zh = "喬治亞州稽核中，約 500 萬張選票經人工重新計票，確認拜登贏得該州。協助州務卿的 VotingWorks 在報告中如此表示"
ja = "ジョージア州の監査で約500万票の手作業での再集計を行った結果、バイデン氏の勝利が確認されたと、州務長官を支援したVotingWorksの報告書は述べています"
hi = "जॉर्जिया में लगभग 50 लाख मतपत्रों की हाथ से गिनती वाले ऑडिट ने पुष्टि की कि राज्य में बाइडेन जीते, यह Secretary of State कार्यालय की मदद करने वाले VotingWorks की रिपोर्ट में है"
ar = "العد اليدوي لنحو 5 ملايين بطاقة اقتراع في تدقيق ولاية جورجيا يؤكد فوز بايدن في الولاية، بحسب تقرير VotingWorks التي ساعدت وزير الولاية"
fa = "طبق گزارش VotingWorks که به وزیر امور خارجه ایالت کمک کرد، شمارش دستی حدود ۵ میلیون برگه رأی در بازرسی ایالت جورجیا تأیید می‌کند که بایدن برنده این ایالت شده است"

