[[item]]
soort = "onderzoek"
datum = "2023-02-22"
bron = "DFRLab"
url = "https://www.atlanticcouncil.org/wp-content/uploads/2023/02/Narrative-Warfare-Final.pdf"
[item.titel]
nl = "DFRLab vindt 'Oekraïners zijn nazi's' onder de grootste prokremlinverhalen in weerlegde beweringen van 2014 tot 2021, en 141 verwijzingen naar nazi's in de 70 dagen voor de invasie"
en = "DFRLab finds 'Ukrainians are Nazis' among the main pro-Kremlin narratives in claims debunked from 2014 to 2021, and 141 Nazi references in the 70 days before the invasion"
de = "Das DFRLab findet 'Ukrainer sind Nazis' unter den wichtigsten kremlnahen Erzählungen in widerlegten Behauptungen 2014 bis 2021 und 141 Nazi-Bezüge in den 70 Tagen vor der Invasion"
es = "El DFRLab halla 'los ucranianos son nazis' entre los principales relatos prorrusos desmentidos de 2014 a 2021, y 141 referencias nazis en los 70 días previos a la invasión"
fr = "Le DFRLab trouve « les Ukrainiens sont des nazis » parmi les grands récits prokremlin démentis de 2014 à 2021, et 141 références aux nazis dans les 70 jours avant l’invasion"
pt = "O DFRLab identifica \"os ucranianos são nazistas\" entre as principais narrativas pró-Kremlin em afirmações desmentidas de 2014 a 2021, e 141 referências a nazistas nos 70 dias antes da invasão"
ru = "DFRLab называет «украинцы нацисты» одним из главных прокремлёвских нарративов среди опровергнутых утверждений с 2014 по 2021 год и находит 141 упоминание нацистов за 70 дней до вторжения"
uk = "DFRLab називає «українці нацисти» одним із головних проросійських наративів у спростованих твердженнях 2014-2021 років і фіксує 141 згадку про нацистів за 70 днів до вторгнення"
id = "DFRLab menemukan 'orang Ukraina adalah Nazi' sebagai salah satu narasi utama pro-Kremlin dalam klaim yang dibantah dari 2014 hingga 2021, dan 141 rujukan ke Nazi dalam 70 hari sebelum invasi"
tr = "DFRLab, 2014-2021 arasında çürütülen iddialar içinde 'Ukraynalılar Nazidir' anlatısını Kremlin yanlısı başlıca anlatılar arasında buluyor ve işgalden önceki 70 günde 141 Nazi göndermesi tespit ediyor"
zh = "數位鑑識研究實驗室（DFRLab）發現，在2014年至2021年被查證為不實的說法中，「烏克蘭人是納粹」是親克里姆林宮的主要敘事之一，且在入侵前70天內出現141次提及納粹的情況"
ja = "DFRLabの調査で、2014年から2021年に検証された言説のうち、親クレムリンの主な主張の一つが「ウクライナ人はナチスだ」であることが判明。侵攻前の70日間にはナチスへの言及が141件あった"
hi = "DFRLab को 2014 से 2021 के बीच खारिज किए गए दावों में 'यूक्रेनी नाज़ी हैं' क्रेमलिन समर्थक मुख्य कथानकों में मिलता है, और आक्रमण से पहले के 70 दिनों में नाज़ियों के 141 उल्लेख मिलते हैं"
ar = "DFRLab تجد أن «الأوكرانيين نازيون» من أبرز الروايات الموالية للكرملين في الادعاءات التي جرى تفنيدها بين عامي 2014 و2021، وتحصي 141 إشارة إلى النازية في الأيام السبعين التي سبقت الغزو"
fa = "DFRLab در ادعاهای ردشده از ۲۰۱۴ تا ۲۰۲۱ عبارت «اوکراینی‌ها نازی هستند» را among روایت‌های اصلی هواداران کرملین می‌یابد و ۱۴۱ اشاره به نازی‌ها را در ۷۰ روز پیش از حمله ثبت می‌کند"

