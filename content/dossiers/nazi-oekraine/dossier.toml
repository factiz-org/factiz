[inleiding]
nl = """
Eén verhaal over Oekraïne komt sinds 2014 steeds terug: dat het land door nazi’s wordt bestuurd, dat zijn leger of regering het nazisme eert, en dat Rusland het land daarom moet ‘denazificeren’. De vorm wisselt: een symbool, een foto van soldaten, een standbeeld, een citaat, een les op school. Dit dossier zet de versies die redacties hebben nagetrokken op een tijdlijn. Elke factcheck zegt wat die redactie vond; Factiz voegt geen eigen oordeel toe. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig."""
en = """
One story about Ukraine has kept coming back since 2014: that the country is run by Nazis, that its army or government honours Nazism, and that Russia must therefore ‘denazify’ it. The form changes: a symbol, a photo of soldiers, a statue, a quote, a school lesson. This dossier puts the versions that newsrooms checked on a timeline. Each fact-check says what that newsroom found; Factiz adds no verdict of its own. The list holds only fact-checks we may republish, so it is not complete."""
de = """
Eine Erzählung über die Ukraine kehrt seit 2014 immer wieder: Das Land werde von Nazis regiert, seine Armee oder Regierung ehre den Nationalsozialismus, und Russland müsse es deshalb ‚entnazifizieren‘. Die Form wechselt: ein Symbol, ein Foto von Soldaten, ein Denkmal, ein Zitat, eine Schulstunde. Dieses Dossier ordnet die Fassungen, die Redaktionen geprüft haben, auf einer Zeitleiste. Jeder Faktencheck sagt, was die jeweilige Redaktion herausfand; Factiz fügt kein eigenes Urteil hinzu. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig."""
es = """
Un relato sobre Ucrania vuelve desde 2014: que el país está gobernado por nazis, que su ejército o su gobierno honran el nazismo y que por eso Rusia debe ‘desnazificarlo’. La forma cambia: un símbolo, una foto de soldados, una estatua, una cita, una clase en la escuela. Este dosier ordena en una cronología las versiones que las redacciones han verificado. Cada verificación dice lo que encontró esa redacción; Factiz no añade un veredicto propio. La lista solo contiene verificaciones que podemos reproducir, así que no está completa."""
fr = """
Un récit sur l’Ukraine revient depuis 2014 : le pays serait dirigé par des nazis, son armée ou son gouvernement honoreraient le nazisme, et la Russie devrait donc le « dénazifier ». La forme change : un symbole, une photo de soldats, une statue, une citation, un cours à l’école. Ce dossier place sur une chronologie les versions que des rédactions ont vérifiées. Chaque vérification dit ce que cette rédaction a trouvé ; Factiz n’ajoute aucun verdict. La liste ne contient que des vérifications que nous pouvons reprendre ; elle n’est donc pas complète."""
pt = '''
Desde 2014, uma história sobre a Ucrânia não para de voltar: a de que o país é governado por nazistas, que seu exército ou seu governo homenageia o nazismo e que, por isso, a Rússia precisa "desnazificá-lo". A forma muda: um símbolo, uma foto de soldados, uma estátua, uma citação, uma aula na escola. Este dossiê coloca em uma linha do tempo as versões que as agências checaram. Cada checagem diz o que aquela agência encontrou; o Factiz não acrescenta nenhuma classificação própria. A lista traz apenas checagens que podemos republicar, por isso não está completa.'''
ru = '''
С 2014 года одна история об Украине возвращается снова и снова: будто страной управляют нацисты, будто её армия или власти чтят нацизм и будто поэтому Россия должна её «денацифицировать». Форма меняется: символ, фотография военных, памятник, цитата, школьный урок. В этом досье на временной шкале собраны версии, которые проверили редакции. Каждый фактчек говорит о том, что нашла эта редакция; своего вердикта Factiz не добавляет. В списке только те фактчеки, которые мы вправе republish, поэтому он неполный.'''
uk = '''
З 2014 року одна історія про Україну повертається знову і знову: що країною керують нацисти, що її армія чи влада шанує нацизм і що тому Росія мусить її «денацифікувати». Форма змінюється: символ, фото військових, пам'ятник, цитата, шкільний урок. У цьому досьє на часовій шкалі зібрано версії, які перевіряли редакції. Кожен фактчек показує, що знайшла ця редакція; власного вердикту Factiz не додає. У списку лише ті фактчеки, які ми маємо право повторно опублікувати, тому він неповний.'''
id = '''
Sejak 2014, satu kisah tentang Ukraina terus muncul kembali: bahwa negara itu dijalankan oleh Nazi, bahwa tentara atau pemerintahnya memuliakan Nazisme, dan bahwa Rusia karena itu harus 'mende-Nazifikasi' Ukraina. Bentuknya berubah-ubah: sebuah simbol, foto tentara, patung, kutipan, pelajaran sekolah. Dosir ini menyusun versi-versi yang diperiksa oleh redaksi dalam satu lini masa. Setiap cek fakta menyampaikan apa yang ditemukan redaksi tersebut; Factiz tidak menambahkan kesimpulan sendiri. Daftar ini hanya memuat cek fakta yang boleh kami terbitkan ulang, jadi tidak lengkap.'''
tr = '''
Ukrayna hakkındaki bir anlatı 2014'ten beri sürekli geri geliyor: ülkeyi Nazilerin yönettiği, ordusunun ya da hükümetinin Nazizmi onurlandırdığı ve bu yüzden Rusya'nın ülkeyi 'Nazilerden arındırması' gerektiği. Biçimi değişiyor: bir sembol, bir asker fotoğrafı, bir heykel, bir alıntı, bir okul dersi. Bu dosya, doğrulama kuruluşlarının incelediği farklı biçimleri bir zaman çizelgesine yerleştiriyor. Her doğrulama, o doğrulama kuruluşunun ne bulduğunu söyler; Factiz kendi kararını eklemez. Liste yalnızca yeniden yayımlama iznimiz olan doğrulamaları içerir, bu yüzden eksiksiz değildir.'''
zh = '''
自2014年以來，有一種關於烏克蘭的說法一再出現：這個國家由納粹掌控，軍隊或政府推崇納粹主義，所以俄羅斯必須「去納粹化」。這種說法的形式不斷變化：一個符號、一張士兵的照片、一座雕像、一句引言、一堂學校課程。這個專題把查核機構查核過的各種版本放在時間軸上。每一則查核報告都說明該查核機構的發現，Factiz 不另外提出任何查核結果。這份清單只收錄我們獲准轉載的查核報告，因此並不完整。'''
ja = '''
2014年以降、ウクライナについて繰り返し現れる言説があります。国はナチスに支配されている、軍や政府はナチズムをたたえている、だからロシアはウクライナを「非ナチ化」しなければならない、というものです。形はさまざまで、シンボル、兵士の写真、像、引用、学校の授業などが使われます。この特集では、報道機関が検証した各種の言説を時系列に並べています。各ファクトチェックには、その報道機関が確認した内容が示されています。Factizが独自に判定を加えることはありません。掲載しているのは再掲載の許可を得たファクトチェックだけなので、一覧がすべてを網羅しているわけではありません。'''
hi = '''
2014 से यूक्रेन को लेकर एक कहानी बार-बार लौटती रही है: कि देश को नाज़ी चलाते हैं, कि उसकी सेना या सरकार नाज़ीवाद का सम्मान करती है, और इसलिए रूस को उसका 'नाज़ीकरण-मुक्त' करना होगा। इसका रूप बदलता रहता है: कोई प्रतीक, सैनिकों की तस्वीर, कोई मूर्ति, कोई उद्धरण, स्कूल का कोई पाठ। इस डोसियर में उन संस्करणों को समयरेखा पर रखा गया है, जिनकी न्यूज़रूम ने जाँच की। हर फैक्ट चेक बताता है कि उस न्यूज़रूम ने क्या पाया; Factiz अपना कोई निष्कर्ष नहीं जोड़ता। इस सूची में केवल वही फैक्ट चेक हैं जिन्हें हम दोबारा प्रकाशित कर सकते हैं, इसलिए यह पूरी नहीं है।'''
ar = '''
منذ عام 2014 تعود قصة واحدة عن أوكرانيا مرة بعد أخرى: أن البلاد يحكمها النازيون، وأن جيشها أو حكومتها تمجّد النازية، وأن على روسيا لذلك أن «تجتث النازية» منها. وتتغير الصيغة: رمز، أو صورة لجنود، أو تمثال، أو اقتباس، أو درس مدرسي. يضع هذا الملف على خط زمني النسخ التي دققتها المنصات. يبيّن كل تدقيق ما توصلت إليه تلك المنصة، ولا تضيف Factiz أي تصنيف من عندها. تضم القائمة فقط التدقيقات التي يحق لنا إعادة نشرها، لذلك فهي غير كاملة.'''
fa = '''
یک روایت درباره اوکراین از سال ۲۰۱۴ بارها تکرار شده است: اینکه این کشور را نازی‌ها اداره می‌کنند، ارتش یا دولتش نازیسم را گرامی می‌دارد و به همین دلیل روسیه باید آن را «نازی‌زدایی» کند. شکل این روایت تغییر می‌کند: یک نماد، عکس چند سرباز، یک مجسمه، یک نقل‌قول، یک درس مدرسه. این پرونده نسخه‌هایی را که رسانه‌ها بررسی کرده‌اند روی یک خط زمانی می‌گذارد. هر راستی‌آزمایی می‌گوید آن رسانه چه یافته است؛ Factiz هیچ نتیجه‌گیری از خودش اضافه نمی‌کند. این فهرست فقط راستی‌آزمایی‌هایی را دارد که اجازه انتشار دوباره‌شان را داریم، بنابراین کامل نیست.'''

