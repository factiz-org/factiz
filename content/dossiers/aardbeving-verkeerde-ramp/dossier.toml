omschrijving = """
Claims that a photo or video shows a specific earthquake, its damage, its victims or its rescue, while according to the fact-check it shows something else: another earthquake, another disaster, another place or year, a film, an exercise or an image made with AI. It does not include claims about what causes earthquakes (HAARP, weapons, nuclear tests), signs or predictions before an earthquake (lights, clouds, a strange sky), or pictures of aid, shelters, politicians or other things after it that show no damage, victims or rescue, even when the picture is from elsewhere (afbakening van de PO, 2026-11-12)."""
