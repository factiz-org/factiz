nl = "Beelden van een aardbeving bij de verkeerde ramp"
en = "Earthquake footage shown with the wrong disaster"
de = "Bilder eines Erdbebens bei der falschen Katastrophe"
es = "Imágenes de un terremoto con la catástrofe equivocada"
fr = "Des images de séisme associées à la mauvaise catastrophe"
pt = "Imagens de terremoto mostradas com o desastre errado"
ru = "Кадры землетрясения, выданные за другую катастрофу"
uk = "Кадри землетрусу, видані за інше лихо"
id = "Rekaman gempa yang ditampilkan dengan bencana yang salah"
tr = "Yanlış felaketle paylaşılan deprem görüntüleri"
zh = "地震畫面被配上錯誤的災難"
ja = "地震の映像が別の災害のものとして出回る"
hi = "भूकंप के फुटेज, जो गलत आपदा के बताकर दिखाए गए"
ar = "لقطات زلزال تُعرض على أنها لكارثة أخرى"
fa = "تصاویر زلزله همراه با فاجعه‌ای اشتباه"

[inleiding]
nl = """
Na elke grote aardbeving gaan beelden rond die er niet bij horen: een oudere ramp, een andere plaats, een film of een oefening. Het recept blijft, het beeld wisselt. Dit dossier volgt dat recept van de aardbevingen in Turkije en Syrië en in Marokko tot daarna. Dit dossier zet de versies die redacties hebben nagetrokken op een tijdlijn. Elke factcheck zegt wat die redactie vond; Factiz voegt geen eigen oordeel toe. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig."""
en = """
After every large earthquake, pictures spread that do not belong to it: an older disaster, another place, a film or an exercise. The recipe stays; the picture changes. This dossier follows that recipe from the earthquakes in Turkey and Syria and in Morocco onwards. This dossier puts the versions that newsrooms checked on a timeline. Each fact-check says what that newsroom found; Factiz adds no verdict of its own. The list holds only fact-checks we may republish, so it is not complete."""
de = """
Nach jedem großen Erdbeben kursieren Bilder, die nicht dazugehören: eine ältere Katastrophe, ein anderer Ort, ein Film oder eine Übung. Das Rezept bleibt, das Bild wechselt. Dieses Dossier verfolgt das Rezept von den Erdbeben in der Türkei und Syrien und in Marokko an. Dieses Dossier ordnet die Fassungen, die Redaktionen geprüft haben, auf einer Zeitleiste. Jeder Faktencheck sagt, was die jeweilige Redaktion herausfand; Factiz fügt kein eigenes Urteil hinzu. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig."""
es = """
Tras cada gran terremoto circulan imágenes que no le corresponden: una catástrofe anterior, otro lugar, una película o un simulacro. La receta se mantiene; la imagen cambia. Este dosier sigue esa receta desde los terremotos de Turquía y Siria y de Marruecos en adelante. Este dosier ordena en una cronología las versiones que las redacciones han verificado. Cada verificación dice lo que encontró esa redacción; Factiz no añade un veredicto propio. La lista solo contiene verificaciones que podemos reproducir, así que no está completa."""
fr = """
Après chaque grand séisme circulent des images qui n’en sont pas : une catastrophe plus ancienne, un autre lieu, un film ou un exercice. La recette reste ; l’image change. Ce dossier suit cette recette depuis les séismes en Turquie et en Syrie et au Maroc. Ce dossier place sur une chronologie les versions que des rédactions ont vérifiées. Chaque vérification dit ce que cette rédaction a trouvé ; Factiz n’ajoute aucun verdict. La liste ne contient que des vérifications que nous pouvons reprendre ; elle n’est donc pas complète."""
pt = '''
Depois de cada grande terremoto, circulam imagens que não têm relação com ele: um desastre mais antigo, outro lugar, um filme ou um exercício. A receita continua a mesma; só a imagem muda. Este dossiê acompanha essa receita a partir dos terremotos na Turquia e na Síria e no Marrocos. Este dossiê coloca em uma linha do tempo as versões que as redações checaram. Cada checagem diz o que aquela redação encontrou; a Factiz não acrescenta nenhum veredito próprio. A lista traz apenas checagens que podemos republicar, por isso não está completa.'''
ru = '''
После каждого сильного землетрясения распространяются снимки, которые к нему не относятся: более старая катастрофа, другое место, фильм или учения. Схема остаётся прежней, меняется только картинка. Это досье прослеживает эту схему, начиная с землетрясений в Турции и Сирии и в Марокко. В досье версии, которые проверили редакции, расположены на временной шкале. В каждом фактчеке написано, что нашла эта редакция. Своего вердикта Factiz не добавляет. В списке только фактчеки, которые мы вправе републиковать, поэтому он неполный.'''
uk = '''
Після кожного сильного землетрусу поширюються картинки, які не мають до нього стосунку: старіше лихо, інше місце, фільм чи навчання. Схема лишається, змінюється лише зображення. Це досьє простежує цю схему від землетрусів у Туреччині та Сирії і в Марокко. У досьє на часовій шкалі зібрано версії, які перевіряли редакції. Кожен фактчек говорить про те, що виявила ця редакція; Factiz не додає власного вердикту. У списку лише ті фактчеки, які ми маємо право повторно публікувати, тому він неповний.'''
id = '''
Setelah setiap gempa besar, beredar gambar yang tidak berkaitan dengan gempa itu: bencana yang lebih lama, tempat lain, sebuah film, atau sebuah latihan. Polanya tetap sama; gambarnya yang berganti. Berkas ini mengikuti pola tersebut mulai dari gempa di Turki dan Suriah serta di Maroko. Berkas ini menempatkan versi-versi yang diperiksa redaksi pada sebuah lini masa. Setiap cek fakta menyampaikan apa yang ditemukan redaksi tersebut; Factiz tidak menambahkan kesimpulan sendiri. Daftar ini hanya memuat cek fakta yang boleh kami terbitkan ulang, jadi daftarnya tidak lengkap.'''
tr = '''
Her büyük depremden sonra o depremle ilgisi olmayan görüntüler yayılır: daha eski bir felaket, başka bir yer, bir film ya da bir tatbikat. Yöntem aynı kalır, görüntü değişir. Bu dosya, Türkiye ve Suriye'deki ve Fas'taki depremlerden başlayarak bu yöntemi izliyor. Bu dosya, doğrulama kuruluşlarının incelediği örnekleri bir zaman çizelgesine yerleştirir. Her doğrulama, ilgili doğrulama kuruluşunun ne bulduğunu söyler; Factiz kendi başına bir karar eklemez. Liste yalnızca yeniden yayımlamamıza izin verilen doğrulamaları içerir, bu yüzden eksiksiz değildir.'''
zh = '''
每次大地震過後,都會有不屬於這場地震的圖片流傳開來:可能是更早的災難、別的地方、電影或演習。手法不變,只是換了圖片。這個專題從土耳其與敘利亞地震,以及摩洛哥地震開始,追蹤這種手法。這個專題把查核機構查核過的各種版本放在時間軸上。每一則查核報告都說明該查核機構的發現,Factiz 不另外加上任何查核結果。清單只收錄我們可以轉載的查核報告,因此並不完整。'''
ja = '''
大きな地震が起きるたびに、その地震とは関係のない画像が広まります。過去の災害、別の場所、映画、訓練の映像などです。手口は同じで、画像だけが変わります。この特集では、トルコとシリアの地震、モロッコの地震以降について、この手口を追います。ファクトチェック機関が検証したさまざまな例を、時系列で並べています。各ファクトチェックには、そのファクトチェック機関が確認した内容が書かれています。Factizが独自に判定を加えることはありません。一覧に載せているのは、再掲載の許可を得ているファクトチェックだけです。そのため、すべてを網羅しているわけではありません。'''
hi = '''
हर बड़े भूकंप के बाद ऐसी तस्वीरें फैलती हैं जिनका उस भूकंप से कोई संबंध नहीं होता: कोई पुरानी आपदा, कोई और जगह, कोई फिल्म या कोई अभ्यास। तरीका वही रहता है, बस तस्वीर बदल जाती है। यह डोज़ियर तुर्किये और सीरिया के भूकंपों और मोरक्को के भूकंप से लेकर आगे तक इसी तरीके का पीछा करता है। इस डोज़ियर में न्यूज़रूम ने जिन रूपों की जाँच की, उन्हें एक टाइमलाइन पर रखा गया है। हर फैक्ट चेक बताता है कि उस न्यूज़रूम ने क्या पाया। Factiz अपनी ओर से कोई निष्कर्ष नहीं जोड़ता। सूची में केवल वही फैक्ट चेक हैं जिन्हें हम दोबारा प्रकाशित कर सकते हैं, इसलिए यह पूरी नहीं है।'''
ar = '''
بعد كل زلزال كبير، تنتشر صور لا علاقة لها به: كارثة أقدم، أو مكان آخر، أو فيلم، أو تمرين. الوصفة تبقى كما هي، والصورة هي التي تتغير. يتتبع هذا الملف هذه الوصفة بدءًا من زلزالَي تركيا وسوريا والمغرب. يضع هذا الملف على خط زمني النسخ التي دقّقتها منصات إخبارية. يوضح كل تدقيق ما توصلت إليه تلك المنصة، ولا يضيف Factiz حكمًا من عنده. تضم القائمة فقط التدقيقات التي يحق لنا إعادة نشرها، لذلك فهي غير كاملة.'''
fa = '''
پس از هر زلزله بزرگ، تصاویری منتشر می‌شود که به آن زلزله ربطی ندارند: فاجعه‌ای قدیمی‌تر، جایی دیگر، یک فیلم یا یک مانور. شیوه ثابت می‌ماند و فقط تصویر عوض می‌شود. این پرونده این شیوه را از زلزله‌های ترکیه و سوریه و مراکش به بعد دنبال می‌کند. این پرونده نسخه‌هایی را که رسانه‌ها بررسی کرده‌اند روی یک خط زمانی می‌گذارد. هر راستی‌آزمایی می‌گوید آن رسانه به چه نتیجه‌ای رسیده است. Factiz نتیجه‌گیری خودش را اضافه نمی‌کند. فهرست فقط شامل راستی‌آزمایی‌هایی است که اجازه داریم دوباره منتشر کنیم، پس کامل نیست.'''

