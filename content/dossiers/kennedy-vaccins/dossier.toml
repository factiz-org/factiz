# Een dossier van het platform (PLAN #33.6, SPECS E9.S7). Een mens schrijft dit bestand; de factchecks die erbij
# horen staan in factchecks.json en komen daar alleen na goedkeuring. `python -m doublecheck.dossiers` leest en keurt.
# Concept van Claude (PLAN #37.5). De PO las het en gaf akkoord op 2026-11-19.

soort = "verhaal"            # verhaal of netwerk
status = "akkoord"           # concept of akkoord; alleen akkoord gaat in een uitgave
akkoord = '2026-11-19, PO: "Alle andere dossiers zijn ook akkoord"'
thema = "health"             # uit content/themas.json
onderdeel = "vaccines"
verwant = ["gates-vaccins-chips"]

[naam]
nl = "Robert F. Kennedy jr. en vaccins, van actievoerder tot minister van Volksgezondheid"
en = "Robert F. Kennedy Jr. and vaccines, from activist to health secretary"
de = "Robert F. Kennedy Jr. und Impfstoffe, vom Aktivisten zum Gesundheitsminister"
es = "Robert F. Kennedy Jr. y las vacunas, de activista a secretario de Salud"
fr = "Robert F. Kennedy Jr. et les vaccins, de militant à ministre de la Santé"

[inleiding]
nl = """
Robert F. Kennedy jr. voerde jarenlang campagne tegen vaccins, onder meer met de organisatie Children's Health
Defense. In 2023 en 2024 was hij kandidaat voor het presidentschap van de Verenigde Staten, en sinds februari 2025 is
hij daar minister van Volksgezondheid. Sinds 2019 gaan er beweringen rond over wat hij zei over vaccins en autisme,
over wat hem werd toegeschreven, zoals een rechtszaak tegen vaccins die hij zou hebben gewonnen, en over het beleid
van zijn ministerie: de vaccinadviseurs van de CDC, het vaccinatieschema voor kinderen, mRNA-onderzoek, mazelen en
paracetamol in de zwangerschap. Dit dossier zet de factchecks daarover op een tijdlijn, naast besluiten en rapporten
die het verhaal dragen. Eén check maakte de eigen redactie van Factiz, over de sms'jes van Fauci die in 2026 werden
vrijgegeven. Elke factcheck zegt wie hem maakte en wat die vond. In de lijst staan alleen factchecks die we mogen
overnemen; ze is dus niet volledig. Het verhaal over Bill Gates en vaccins heeft een eigen dossier."""
en = """
Robert F. Kennedy Jr. campaigned against vaccines for years, among other things through the organisation Children's
Health Defense. He ran for president of the United States in 2023 and 2024, and since February 2025 he has been the
country's health secretary. Since 2019, claims have circulated about what he said about vaccines and autism, about
what was attributed to him, such as a court case against vaccines he supposedly won, and about the policy of his
department: the CDC's vaccine advisers, the childhood vaccine schedule, mRNA research, measles and acetaminophen in
pregnancy. This dossier puts the fact-checks of these claims on a timeline, next to decisions and reports that carry
the story. One check was made by Factiz's own desk, about Fauci's text messages released in 2026. Each fact-check says
who made it and what they found. The list holds only fact-checks we may republish, so it is not complete. The story of
Bill Gates and vaccines has a dossier of its own."""
de = """
Robert F. Kennedy Jr. hat jahrelang gegen Impfungen gekämpft, unter anderem mit der Organisation Children's Health
Defense. 2023 und 2024 kandidierte er für das Amt des US-Präsidenten, und seit Februar 2025 ist er dort
Gesundheitsminister. Seit 2019 kursieren Behauptungen darüber, was er über Impfungen und Autismus sagte, darüber, was
ihm zugeschrieben wurde, etwa ein angeblich gewonnener Prozess gegen Impfungen, und über die Politik seines
Ministeriums: die Impfberater der CDC, den Impfplan für Kinder, mRNA-Forschung, Masern und Paracetamol in der
Schwangerschaft. Dieses Dossier ordnet die Faktenchecks dazu auf einer Zeitleiste, neben Beschlüssen und Berichten,
die die Erzählung tragen. Einen Check hat die eigene Redaktion von Factiz gemacht, über die SMS von Fauci, die 2026
veröffentlicht wurden. Jeder Faktencheck sagt, wer ihn gemacht hat und was er ergab. Die Liste enthält nur
Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig. Die Erzählung über Bill Gates und Impfstoffe
hat ein eigenes Dossier."""
es = """
Robert F. Kennedy Jr. hizo campaña contra las vacunas durante años, entre otras cosas con la organización Children's
Health Defense. En 2023 y 2024 fue candidato a la presidencia de Estados Unidos, y desde febrero de 2025 es allí
secretario de Salud. Desde 2019 circulan afirmaciones sobre lo que dijo de las vacunas y el autismo, sobre lo que se
le atribuyó, como un juicio contra las vacunas que supuestamente ganó, y sobre la política de su departamento: los
asesores de vacunas de los CDC, el calendario de vacunación infantil, la investigación con ARNm, el sarampión y el
paracetamol en el embarazo. Este dosier ordena en una cronología las verificaciones sobre estas afirmaciones, junto a
decisiones e informes que sostienen el relato. Una verificación la hizo la redacción propia de Factiz, sobre los
mensajes de Fauci publicados en 2026. Cada verificación dice quién la hizo y qué encontró. La lista solo contiene
verificaciones que podemos reproducir; por eso no está completa. El relato sobre Bill Gates y las vacunas tiene su
propio dosier."""
fr = """
Robert F. Kennedy Jr. a fait campagne contre les vaccins pendant des années, notamment avec l’organisation Children's
Health Defense. En 2023 et 2024, il a été candidat à la présidence des États-Unis, et depuis février 2025 il y est
ministre de la Santé. Depuis 2019 circulent des affirmations sur ce qu’il a dit des vaccins et de l’autisme, sur ce
qu’on lui a attribué, comme un procès contre les vaccins qu’il aurait gagné, et sur la politique de son ministère :
les conseillers en vaccination des CDC, le calendrier vaccinal des enfants, la recherche sur l’ARNm, la rougeole et le
paracétamol pendant la grossesse. Ce dossier place les vérifications de ces affirmations sur une chronologie, à côté
des décisions et rapports qui portent le récit. Une vérification a été faite par la rédaction de Factiz, sur les SMS
de Fauci publiés en 2026. Chaque vérification dit qui l’a faite et ce qu’elle a trouvé. La liste ne contient que des
vérifications que nous pouvons reprendre ; elle n’est donc pas complète. Le récit sur Bill Gates et les vaccins a son
propre dossier."""

