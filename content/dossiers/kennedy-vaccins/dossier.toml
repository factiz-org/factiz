[voorstel]
woorden = ["Robert F. Kennedy", "Kennedy", "RFK", "Кеннеди", "Кеннеді", "كينيدي", "कैनेडी", "केनेडी", "ケネディ", "肯尼迪", "甘迺迪", "케네디", "Children's Health Defense", "vaccine", "vaccines", "vaccination", "vaccinations", "vaccinated", "vaccinate", "vaccin", "vacuna", "Impfung", "вакцин", "واکسن", "لقاح", "ワクチン", "autism", "autisme", "autismo", "Autismus", "autistic", "Tylenol", "acetaminophen", "paracetamol", "Panadol", "Fauci", "CDC", "ACIP", "FDA", "HHS", "Health and Human Services", "mRNA", "measles", "hepatitis B"]
omschrijving = """
Claims in the story of Robert F. Kennedy Jr. and vaccines, from 2019 to now: what Kennedy said or is quoted as saying
about vaccines and autism (for example that vaccines, aluminium or Tylenol, also called acetaminophen or paracetamol,
cause autism), as an activist, as a presidential candidate in 2023 and 2024 and as US health secretary since 2025;
claims about Kennedy and vaccines, such as a court case he supposedly won or a letter attributed to him; and claims
about US vaccine policy in 2025 and 2026: the CDC and its vaccine advisers, the childhood vaccine schedule, hepatitis B
at birth, the MMR vaccine, Covid vaccines for children and pregnant women, mRNA funding, vaccine injury and liability,
the Texas measles outbreak, and what Trump or US health officials said about vaccines and autism. It does not include
Bill Gates and vaccines (dossier gates-vaccins-chips), the origin of the coronavirus, vaccines elsewhere in the world or
Covid vaccine side effects without a link to Kennedy or US policy, or other claims about Kennedy or his family (John F.
Kennedy, politics, food, fluoride)."""
