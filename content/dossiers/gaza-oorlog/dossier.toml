# Een dossier van het platform (PLAN #33.6, SPECS E9.S7). Een mens schrijft dit bestand; de factchecks die erbij
# horen staan in factchecks.json en komen daar alleen na goedkeuring. `python -m doublecheck.dossiers` leest en keurt.
# Concept van Claude (PLAN #37.5). De PO las het en gaf akkoord op 2026-11-19.

soort = "verhaal"            # verhaal of netwerk
status = "akkoord"           # concept of akkoord; alleen akkoord gaat in een uitgave
akkoord = '2026-11-19, PO: "Alle andere dossiers zijn ook akkoord"'
thema = "war"                # uit content/themas.json
onderdeel = "middle-east"
verwant = ["iran-oorlog"]

[naam]
nl = "De oorlog in Gaza: wat er sinds 7 oktober 2023 rondging"
en = "The war in Gaza: what has circulated since 7 October 2023"
de = "Der Krieg in Gaza: was seit dem 7. Oktober 2023 kursiert"
es = "La guerra en Gaza: lo que circula desde el 7 de octubre de 2023"
fr = "La guerre à Gaza : ce qui circule depuis le 7 octobre 2023"

[inleiding]
nl = """
Sinds de aanval van Hamas op Israël op 7 oktober 2023 en de oorlog in Gaza die volgde, gaan er over die oorlog veel
berichten rond die factcheckers hebben nagetrokken. Ze gaan over de aanval en de gijzelaars, over aanvallen op
ziekenhuizen en scholen, over het aantal doden, over hulp en honger, over de bestanden en de vloten naar Gaza, en over
wat leiders en bekende mensen zeiden. Vaak zijn het oude beelden of beelden van elders die als nieuw worden gedeeld, of
beweringen dat beelden van slachtoffers in scène zijn gezet. Ook protesten en boycots in Europa, de Verenigde Staten en
elders gaan rond in een andere vorm dan ze hadden. Dit dossier zet die factchecks op een tijdlijn, naast besluiten van
het Internationaal Gerechtshof, het Strafhof en de VN en onderzoek naar de doden en de honger. Twee checks maakte de
eigen redactie van Factiz, over beelden uit Amsterdam die rondgingen als protest over Gaza. Elke factcheck zegt wie hem
maakte en wat die vond. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig. De
aanvallen tussen Iran en Israël hebben een eigen dossier."""
en = """
Since the Hamas attack on Israel of 7 October 2023 and the war in Gaza that followed, many messages about this war
have circulated that fact-checkers looked into. They concern the attack and the hostages, strikes on hospitals and
schools, the number of dead, aid and hunger, the ceasefires and the flotillas to Gaza, and what leaders and well-known
people said. Often they are old images or images from elsewhere shared as new, or claims that images of victims were
staged. Protests and boycotts in Europe, the United States and elsewhere also circulate in a form they did not have.
This dossier puts those fact-checks on a timeline, next to decisions of the International Court of Justice, the
International Criminal Court and the UN, and research on the dead and on hunger. Two checks were made by Factiz's own
desk, about images from Amsterdam that circulated as a protest about Gaza. Each fact-check says who made it and what
they found. The list holds only fact-checks we may republish, so it is not complete. The attacks between Iran and
Israel have a dossier of their own."""
de = """
Seit dem Angriff der Hamas auf Israel am 7. Oktober 2023 und dem Krieg in Gaza, der darauf folgte, kursieren über
diesen Krieg viele Meldungen, die Faktenchecker überprüft haben. Sie handeln vom Angriff und den Geiseln, von Angriffen
auf Krankenhäuser und Schulen, von der Zahl der Toten, von Hilfe und Hunger, von den Waffenruhen und den Flottillen nach
Gaza und davon, was Politiker und bekannte Menschen sagten. Oft sind es alte Bilder oder Bilder von anderswo, die als
neu geteilt werden, oder Behauptungen, Bilder von Opfern seien inszeniert. Auch Proteste und Boykotte in Europa, den
USA und anderswo kursieren in einer anderen Form, als sie hatten. Dieses Dossier ordnet diese Faktenchecks auf einer
Zeitleiste, neben Entscheidungen des Internationalen Gerichtshofs, des Strafgerichtshofs und der UN und Forschung zu
den Toten und zum Hunger. Zwei Checks stammen von der eigenen Redaktion von Factiz, über Bilder aus Amsterdam, die als
Protest zu Gaza kursierten. Jeder Faktencheck sagt, wer ihn gemacht hat und was er ergab. Die Liste enthält nur
Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig. Die Angriffe zwischen Iran und Israel haben
ein eigenes Dossier."""
es = """
Desde el ataque de Hamás contra Israel del 7 de octubre de 2023 y la guerra en Gaza que siguió, circulan sobre esa
guerra muchos mensajes que los verificadores han comprobado. Tratan del ataque y los rehenes, de ataques a hospitales y
escuelas, del número de muertos, de la ayuda y el hambre, de los altos el fuego y las flotillas a Gaza, y de lo que
dijeron dirigentes y personas conocidas. A menudo son imágenes antiguas o de otros lugares compartidas como nuevas, o
afirmaciones de que las imágenes de víctimas fueron escenificadas. También protestas y boicots en Europa, Estados
Unidos y otros lugares circulan con una forma que no tenían. Este dosier ordena esas verificaciones en una cronología,
junto a decisiones de la Corte Internacional de Justicia, la Corte Penal Internacional y la ONU, e investigaciones sobre
los muertos y el hambre. Dos verificaciones las hizo la redacción propia de Factiz, sobre imágenes de Ámsterdam que
circularon como una protesta por Gaza. Cada verificación dice quién la hizo y qué encontró. La lista solo contiene
verificaciones que podemos reproducir, así que no está completa. Los ataques entre Irán e Israel tienen su propio
dosier."""
fr = """
Depuis l’attaque du Hamas contre Israël le 7 octobre 2023 et la guerre à Gaza qui a suivi, circulent sur cette guerre
de nombreux messages examinés par des vérificateurs. Ils portent sur l’attaque et les otages, les frappes sur
des hôpitaux et des écoles, le nombre de morts, l’aide et la faim, les cessez-le-feu et les flottilles vers Gaza, et ce
qu’ont dit des dirigeants et des personnalités. Ce sont souvent des images anciennes ou d’ailleurs partagées
comme nouvelles, ou l’affirmation que des images de victimes sont mises en scène. Des manifestations et des boycotts
en Europe, aux États-Unis et ailleurs circulent aussi sous une forme qu’ils n’avaient pas. Ce dossier les place sur une
chronologie, à côté de décisions de la Cour internationale de justice, de la Cour pénale internationale et de l’ONU,
et de recherches sur les morts et la faim. Deux vérifications sont de la rédaction de
Factiz, sur des images d’Amsterdam présentées comme une manifestation pour Gaza. Chaque vérification dit qui l’a faite
et ce qu’elle a trouvé. La liste ne contient que des vérifications que nous pouvons reprendre et n’est donc pas
complète. Les attaques entre l’Iran et Israël ont leur propre dossier."""

[nagelezen]
nl = false
en = false
de = false
es = false
fr = false

