# Voor het voorstellen van factchecks (`python -m doublecheck.dossiers`); dit deel gaat niet in de uitgave.
[voorstel]
woorden = [
  "Epstein", "Ghislaine", "Lolita Express",
  "إبستين", "ابستين", "اپستین", "Эпштейн", "Епштейн", "एपस्टीन", "এপস্টেইন", "எப்ஸ்டீன்", "ఎప్స్టీన్",
  "엡스타인", "エプスタイン", "爱泼斯坦", "愛潑斯坦", "Επστάιν", "אפשטיין",
]
omschrijving = """
Claims about Jeffrey Epstein and the Epstein case since his arrest in July 2019. It includes claims about his death in
jail (murdered, staged, still alive, a new autopsy), about a supposed client list, black book or the flight logs of his
plane, about court documents and the files released by US authorities and what politicians said or did about them, and
about Ghislaine Maxwell, her trial and her detention. It also includes every claim that links a person, company or
group to Epstein, Maxwell, his island or his plane: a photo or video with them (real, edited or made with AI), a visit,
a name in the documents, money, messages, a hidden reference in a logo or cartoon, or a role in his crimes; and claims
about what happened on his island or about deaths said to be connected to the case. It does not include claims about
other sex-abuse cases or other people that only mention Epstein in passing, claims that only call someone a new
Epstein, or claims about Bill Gates and vaccines, which have their own dossier."""
