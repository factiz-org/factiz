# Een dossier van het platform (PLAN #33.6, SPECS E9.S7). Een mens schrijft dit bestand; de factchecks die erbij
# horen staan in factchecks.json en komen daar alleen na goedkeuring. `python -m doublecheck.dossiers` leest en keurt.
# Concept van Claude (PLAN #37.5). De PO las het en gaf akkoord op 2026-11-19.

soort = "verhaal"            # verhaal of netwerk
status = "akkoord"           # concept of akkoord; alleen akkoord gaat in een uitgave
akkoord = '2026-11-19, PO: "Alle andere dossiers zijn ook akkoord"'
thema = "crime"              # uit content/themas.json
onderdeel = "police-courts"
verwant = []

[naam]
nl = "Het verhaal over Jeffrey Epstein en de Epstein-stukken"
en = "The story of Jeffrey Epstein and the Epstein files"
de = "Die Erzählung über Jeffrey Epstein und die Epstein-Akten"
es = "El relato sobre Jeffrey Epstein y los archivos de Epstein"
fr = "Le récit sur Jeffrey Epstein et les dossiers Epstein"

[inleiding]
nl = """
Sinds Jeffrey Epstein in juli 2019 werd gearresteerd en een maand later dood in zijn cel werd gevonden, gaat er steeds
iets nieuws over hem rond: dat hij nog leeft of werd vermoord, dat er een lijst van klanten bestaat, wie er op de
passagierslijsten van zijn vliegtuig staat, en welke bekende mensen in de vrijgegeven stukken voorkomen of met hem op
de foto stonden. Elke nieuwe vrijgave van rechtbankstukken en van de stukken van het Amerikaanse ministerie van Justitie
brengt een nieuwe golf, zoals in februari 2026, en daarbij gaan ook foto's rond die met AI zijn gemaakt. Dit dossier
zet de versies die redacties hebben nagetrokken op een tijdlijn, naast de besluiten en rapporten van de Amerikaanse
overheid. Eén check maakte de eigen redactie van Factiz. Elke factcheck zegt wie hem maakte en wat die vond. In de lijst
staan alleen factchecks die we mogen overnemen; ze is dus niet volledig."""
en = """
Since Jeffrey Epstein was arrested in July 2019 and found dead in his cell a month later, something new about him keeps
circulating: that he is still alive or was murdered, that a list of clients exists, who is on the passenger lists of
his plane, and which famous people appear in the released documents or were photographed with him. Every new release of
court documents and of the files of the US Department of Justice brings a new wave, as in February 2026, and with it
come photos made with AI. This dossier puts the versions that newsrooms checked on a timeline, next to the decisions and
reports of the US government. One check was made by Factiz's own desk. Each fact-check says who made it and what they
found. The list only holds fact-checks we may republish, so it is not complete."""
de = """
Seit Jeffrey Epstein im Juli 2019 festgenommen und einen Monat später tot in seiner Zelle gefunden wurde, kursiert
immer wieder etwas Neues über ihn: dass er noch lebt oder ermordet wurde, dass es eine Kundenliste gibt, wer auf den
Passagierlisten seines Flugzeugs steht und welche bekannten Menschen in den freigegebenen Unterlagen vorkommen oder mit
ihm fotografiert wurden. Jede neue Freigabe von Gerichtsakten und von Unterlagen des US-Justizministeriums bringt eine
neue Welle, wie im Februar 2026, und dabei kursieren auch Fotos, die mit KI erstellt wurden. Dieses Dossier ordnet die
Versionen, die Redaktionen überprüft haben, auf einer Zeitleiste, neben den Entscheidungen und Berichten der
US-Regierung. Einen Check hat die eigene Redaktion von Factiz gemacht. Jeder Faktencheck sagt, wer ihn gemacht hat und
was er ergab. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig."""
es = """
Desde que Jeffrey Epstein fue detenido en julio de 2019 y hallado muerto en su celda un mes después, circula una y otra
vez algo nuevo sobre él: que sigue vivo o que fue asesinado, que existe una lista de clientes, quién figura en las
listas de pasajeros de su avión y qué personas conocidas aparecen en los documentos publicados o fueron fotografiadas
con él. Cada nueva publicación de documentos judiciales y de archivos del Departamento de Justicia de Estados Unidos
trae una nueva ola, como en febrero de 2026, y con ella circulan también fotos hechas con IA. Este dosier ordena en una
cronología las versiones que las redacciones verificaron, junto a las decisiones e informes del Gobierno de Estados
Unidos. Una verificación la hizo la redacción propia de Factiz. Cada verificación dice quién la hizo y qué encontró. La
lista solo contiene verificaciones que podemos reproducir; por eso no está completa."""
fr = """
Depuis que Jeffrey Epstein a été arrêté en juillet 2019 puis retrouvé mort dans sa cellule un mois plus tard, quelque
chose de nouveau circule sans cesse à son sujet : qu’il est encore en vie ou qu’il a été assassiné, qu’il existe une
liste de clients, qui figure sur les listes de passagers de son avion, et quelles personnalités apparaissent dans les
documents publiés ou ont été photographiées avec lui. Chaque nouvelle publication de documents judiciaires et de
dossiers du ministère américain de la Justice apporte une nouvelle vague, comme en février 2026, et avec elle des photos
créées par IA. Ce dossier place sur une chronologie les versions vérifiées par des rédactions, à côté des décisions et
des rapports du gouvernement américain. Une vérification a été faite par la rédaction de Factiz. Chaque vérification
dit qui l’a faite et ce qu’elle a trouvé. La liste ne contient que des vérifications que nous pouvons reprendre ; elle
n’est donc pas complète."""

[nagelezen]
nl = false
en = false
de = false
es = false
fr = false

