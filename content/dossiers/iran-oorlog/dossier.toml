# Een dossier van het platform (PLAN #33.6, SPECS E9.S7). Een mens schrijft dit bestand; de factchecks die erbij
# horen staan in factchecks.json en komen daar alleen na goedkeuring. `python -m doublecheck.dossiers` leest en keurt.
# Concept van Claude (PLAN #37.5). De PO las het en gaf akkoord op 2026-11-19.

soort = "verhaal"            # verhaal of netwerk
status = "akkoord"           # concept of akkoord; alleen akkoord gaat in een uitgave
akkoord = '2026-11-19, PO: "Alle andere dossiers zijn ook akkoord"'
thema = "war"                # uit content/themas.json
onderdeel = "middle-east"
verwant = ["gaza-oorlog"]

[naam]
nl = "De oorlog tussen Iran, Israël en de VS: wat er sinds 2024 rondging"
en = "The war between Iran, Israel and the US: what has circulated since 2024"
de = "Der Krieg zwischen Iran, Israel und den USA: was seit 2024 kursiert"
es = "La guerra entre Irán, Israel y EE. UU.: lo que circula desde 2024"
fr = "La guerre entre l’Iran, Israël et les États-Unis : ce qui circule depuis 2024"

[inleiding]
nl = """
In april 2024 viel Iran Israël voor het eerst rechtstreeks aan, met honderden drones en raketten. Daarna volgden meer
rondes: in oktober 2024, in juni 2025 een oorlog van twaalf dagen waarin de Verenigde Staten ook Iraanse
atoomlocaties bombardeerden, en op 28 februari 2026 een nieuwe oorlog van de VS en Israël met Iran. Op de eerste dag
kwam opperste leider Ali Khamenei om; zijn zoon Mojtaba volgde hem op. Iran schoot terug op Israël, op Amerikaanse
bases en op buurlanden in de Golf. In april kwam er een bestand, maar daarna laaide de strijd weer op, rond de Straat
van Hormuz en in de Golf. Bij elke ronde gaan beelden rond die bij een andere aanval of een ander jaar horen of met AI
zijn gemaakt, en beweringen over doden, schade, atoomlocaties en de leiders van Iran. Dit dossier zet de factchecks
daarover op een tijdlijn. Elke factcheck zegt wie hem maakte en wat die vond. De lijst heeft alleen factchecks die we
mogen overnemen en is dus niet volledig. De oorlog in Gaza heeft een eigen dossier."""
en = """
In April 2024 Iran attacked Israel directly for the first time, with hundreds of drones and missiles. More rounds
followed: in October 2024, in June 2025 a twelve-day war in which the United States also bombed Iranian nuclear sites,
and on 28 February 2026 a new war of the US and Israel with Iran. On the first day Supreme Leader Ali Khamenei was
killed; his son Mojtaba succeeded him. Iran struck back at Israel, at US bases and at neighbouring Gulf states. A
ceasefire came in April, but fighting flared up again afterwards, around the Strait of Hormuz and in the Gulf. With
every round, images circulate that belong to another attack or another year or were made with AI, along with claims
about the dead, the damage, the nuclear sites and Iran's leaders. This dossier puts the fact-checks about them on a
timeline. Each fact-check says who made it and what they found. The list holds only fact-checks we may republish, so
it is not complete. The war in Gaza has a dossier of its own."""
de = """
Im April 2024 griff Iran Israel zum ersten Mal direkt an, mit Hunderten Drohnen und Raketen. Weitere Runden folgten:
im Oktober 2024, im Juni 2025 ein Krieg von zwölf Tagen, in dem auch die USA iranische Atomanlagen bombardierten, und
am 28. Februar 2026 ein neuer Krieg der USA und Israels gegen Iran. Am ersten Tag wurde der Oberste Führer Ali
Chamenei getötet; sein Sohn Modschtaba folgte ihm nach. Iran schlug gegen Israel, US-Stützpunkte und Nachbarstaaten
am Golf zurück. Im April kam eine Waffenruhe, doch danach flammten die Kämpfe wieder auf, um die Straße von Hormus und
am Golf. Bei jeder Runde kursieren Bilder, die zu einem anderen Angriff oder Jahr gehören oder mit KI gemacht wurden,
und Behauptungen über Tote, Schäden, Atomanlagen und die Führung Irans. Dieses Dossier ordnet die Faktenchecks dazu
auf einer Zeitleiste. Jeder Faktencheck sagt, wer ihn gemacht hat und was er ergab. Die Liste enthält nur
Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig. Der Krieg in Gaza hat ein eigenes Dossier."""
es = """
En abril de 2024 Irán atacó a Israel directamente por primera vez, con cientos de drones y misiles. Siguieron más
rondas: en octubre de 2024, en junio de 2025 una guerra de doce días en la que EE. UU. también bombardeó instalaciones
nucleares iraníes, y el 28 de febrero de 2026 una nueva guerra de EE. UU. e Israel contra Irán. El primer día murió
el líder supremo Alí Jamenei; le sucedió su hijo Mojtaba. Irán respondió contra Israel, bases estadounidenses y
países vecinos del Golfo. En abril llegó un alto el fuego, pero después los combates volvieron, en torno al estrecho
de Ormuz y en el Golfo. En cada ronda circulan imágenes de otro ataque u otro año o hechas con IA, y afirmaciones
sobre los muertos, los daños, las instalaciones nucleares y los líderes de Irán. Este dosier ordena en una cronología
las verificaciones sobre ello. Cada verificación dice quién la hizo y qué encontró. La lista solo contiene
verificaciones que podemos reproducir, así que no está completa. La guerra en Gaza tiene su propio dosier."""
fr = """
En avril 2024, l’Iran a attaqué Israël directement pour la première fois, avec des centaines de drones et de
missiles. D’autres séquences ont suivi : en octobre 2024, en juin 2025 une guerre de douze jours où les États-Unis ont
aussi bombardé des sites nucléaires iraniens, et le 28 février 2026 une nouvelle guerre des États-Unis et d’Israël
contre l’Iran. Le premier jour, le guide suprême Ali Khamenei a été tué ; son fils Mojtaba lui a succédé. L’Iran a
riposté contre Israël, des bases américaines et des pays voisins du Golfe. Un cessez-le-feu est venu en avril, mais
les combats ont repris ensuite, autour du détroit d’Ormuz et dans le Golfe. À chaque séquence circulent des images
d’une autre attaque ou d’une autre année, ou faites avec l’IA, et des affirmations sur les morts, les dégâts, les sites
nucléaires et les dirigeants iraniens. Ce dossier place sur une chronologie les vérifications qui les concernent.
Chaque vérification dit qui l’a faite et ce qu’elle a trouvé. La liste ne contient que des vérifications que nous
pouvons reprendre ; elle n’est donc pas complète. La guerre à Gaza a son propre dossier."""

[nagelezen]
nl = false
en = false
de = false
es = false
fr = false

