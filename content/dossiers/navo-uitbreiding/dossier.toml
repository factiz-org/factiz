[inleiding]
nl = """
Eén verhaal komt terug sinds de jaren negentig: dat het Westen Gorbatsjov beloofde dat de NAVO niet naar het oosten zou uitbreiden, dat de NAVO Rusland omsingelt, en dat de Russische inval in Oekraïne daarom een verdediging was. Of de uitbreiding de oorlog uitlokte, is een debat onder onderzoekers; Factiz beslist dat niet. Stukken uit dat debat staan in de tijdlijn, van beide kanten. Dit dossier zet de versies die redacties hebben nagetrokken op een tijdlijn. Elke factcheck zegt wat die redactie vond; Factiz voegt geen eigen oordeel toe. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig."""
en = """
One story has been coming back since the 1990s: that the West promised Gorbachev NATO would not expand to the east, that NATO is encircling Russia, and that Russia's invasion of Ukraine was therefore a defence. Whether NATO expansion provoked the war is a debate among scholars; Factiz does not settle it. Pieces from that debate, from both sides, are on the timeline. This dossier puts the versions that newsrooms checked on a timeline. Each fact-check says what that newsroom found; Factiz adds no verdict of its own. The list holds only fact-checks we may republish, so it is not complete."""
de = """
Eine Erzählung kehrt seit den 1990er-Jahren zurück: Der Westen habe Gorbatschow versprochen, die NATO werde sich nicht nach Osten ausdehnen, die NATO kreise Russland ein, und der russische Einmarsch in die Ukraine sei deshalb Verteidigung gewesen. Ob die Erweiterung den Krieg provozierte, ist eine Debatte unter Forschenden; Factiz entscheidet sie nicht. Beiträge aus dieser Debatte stehen auf der Zeitleiste, von beiden Seiten. Dieses Dossier ordnet die Fassungen, die Redaktionen geprüft haben, auf einer Zeitleiste. Jeder Faktencheck sagt, was die jeweilige Redaktion herausfand; Factiz fügt kein eigenes Urteil hinzu. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig."""
es = """
Un relato vuelve desde los años noventa: que Occidente prometió a Gorbachov que la OTAN no se ampliaría hacia el este, que la OTAN rodea a Rusia y que, por eso, la invasión rusa de Ucrania fue una defensa. Si la ampliación provocó la guerra es un debate entre investigadores; Factiz no lo decide. En la cronología hay textos de ese debate, de ambas partes. Este dosier ordena en una cronología las versiones que las redacciones han verificado. Cada verificación dice lo que encontró esa redacción; Factiz no añade un veredicto propio. La lista solo contiene verificaciones que podemos reproducir, así que no está completa."""
fr = """
Un récit revient depuis les années 1990 : l’Occident aurait promis à Gorbatchev que l’OTAN ne s’étendrait pas vers l’est, l’OTAN encerclerait la Russie, et l’invasion russe de l’Ukraine aurait donc été une défense. Savoir si l’élargissement a provoqué la guerre est un débat entre chercheurs ; Factiz ne le tranche pas. Des textes de ce débat, des deux côtés, figurent sur la chronologie. Ce dossier place sur une chronologie les versions que des rédactions ont vérifiées. Chaque vérification dit ce que cette rédaction a trouvé ; Factiz n’ajoute aucun verdict. La liste ne contient que des vérifications que nous pouvons reprendre ; elle n’est donc pas complète."""
pt = '''
Uma história volta desde os anos 1990: a de que o Ocidente prometeu a Gorbachev que a OTAN não se expandiria para o leste, que a OTAN está cercando a Rússia e que a invasão da Ucrânia pela Rússia seria, por isso, uma defesa. Se a expansão da OTAN provocou a guerra é um debate entre estudiosos; o Factiz não decide essa questão. Textos desse debate, dos dois lados, estão na linha do tempo. Este dossiê coloca na linha do tempo as versões que as agências checaram. Cada checagem diz o que aquela agência concluiu; o Factiz não acrescenta nenhuma classificação própria. A lista inclui apenas checagens que podemos republicar, por isso não está completa.'''
ru = '''
С 1990-х годов постоянно возвращается одна история: будто Запад пообещал Горбачёву, что НАТО не будет расширяться на восток, что НАТО окружает Россию и что вторжение России в Украину поэтому было обороной. Спровоцировало ли расширение НАТО войну, остаётся предметом споров among учёных; Factiz этот спор не решает. Материалы из этой дискуссии, с обеих сторон, есть на временной шкале. В этом досье версии, которые проверяли редакции, расположены на временной шкале. Каждый фактчек говорит о том, что нашла эта редакция; Factiz не добавляет собственного вердикта. В список входят только фактчеки, которые мы вправе републиковать, поэтому он не полный.'''
uk = '''
З 1990-х років повертається одна історія: нібито Захід пообіцяв Горбачову, що НАТО не розширюватиметься на схід, що НАТО оточує Росію і що тому вторгнення Росії в Україну було обороною. Чи спровокувало розширення НАТО війну, є предметом дискусії серед науковців; Factiz цього питання не розв'язує. Матеріали з цієї дискусії, з обох боків, є на часовій шкалі. Це досьє розміщує на часовій шкалі версії, які перевіряли редакції. Кожен фактчек показує, що виявила ця редакція; Factiz не додає власного вердикту. У списку лише ті фактчеки, які ми маємо право републікувати, тож він неповний.'''
id = '''
Satu kisah terus muncul kembali sejak 1990-an: bahwa Barat berjanji kepada Gorbachev bahwa NATO tidak akan meluas ke timur, bahwa NATO mengepung Rusia, dan bahwa invasi Rusia ke Ukraina karena itu merupakan tindakan pembelaan diri. Apakah perluasan NATO memicu perang adalah bahan perdebatan di kalangan akademisi; Factiz tidak memutuskannya. Tulisan dari perdebatan itu, dari kedua belah pihak, ada di lini masa. Dosir ini menempatkan berbagai versi yang diperiksa oleh redaksi pada sebuah lini masa. Setiap cek fakta menyampaikan apa yang ditemukan oleh redaksi tersebut; Factiz tidak menambahkan kesimpulan sendiri. Daftar ini hanya memuat cek fakta yang boleh kami terbitkan ulang, sehingga tidak lengkap.'''
tr = '''
1990'lardan beri tekrar tekrar karşımıza çıkan bir anlatı var: Batı'nın Gorbaçov'a NATO'nun doğuya doğru genişlemeyeceği sözünü verdiği, NATO'nun Rusya'yı çevrelediği ve bu yüzden Rusya'nın Ukrayna'yı işgalinin bir savunma olduğu söyleniyor. NATO'nun genişlemesinin savaşı tetikleyip tetiklemediği akademisyenler arasında bir tartışma konusudur; Factiz bu konuda karar vermez. Bu tartışmadan, her iki tarafın görüşlerini yansıtan yazılar zaman çizelgesinde yer alıyor. Bu dosya, doğrulama kuruluşlarının incelediği anlatı biçimlerini bir zaman çizelgesine yerleştirir. Her doğrulama, ilgili doğrulama kuruluşunun ne bulduğunu belirtir; Factiz kendi adına bir karar eklemez. Liste yalnızca yeniden yayımlama iznimiz olan doğrulamaları içerir, bu nedenle eksiksiz değildir.'''
zh = '''
自 1990 年代以來，有一種說法一再出現：西方曾向戈巴契夫承諾北約不會向東擴張，北約正在包圍俄羅斯，所以俄羅斯入侵烏克蘭是出於防衛。北約東擴是否引發這場戰爭，學者之間仍有爭論，Factiz 不對此下定論。時間軸上收錄了這場爭論中雙方的文章。這個專題把各查核機構查核過的不同說法放在一條時間軸上。每份查核報告都說明該查核機構的發現，Factiz 不另外加上任何查核結果。這份清單只收錄我們可以轉載的查核報告，因此並不完整。'''
ja = '''
1990年代から繰り返し語られてきた説があります。西側はゴルバチョフに、NATOは東へ拡大しないと約束した、NATOはロシアを包囲している、だからロシアのウクライナ侵攻は防衛だった、というものです。NATOの拡大が戦争を引き起こしたのかどうかは、研究者の間でも議論が分かれており、Factizは結論を出しません。その議論から、双方の立場の文章を年表に載せています。この特集では、報道機関が検証した説を年表に並べています。それぞれのファクトチェックには、その報道機関が確認した内容が書かれています。Factizが独自の判定を加えることはありません。一覧には、再掲載が認められているファクトチェックだけを載せているため、すべてを網羅しているわけではありません。'''
hi = '''
1990 के दशक से एक कहानी बार-बार लौटती रही है: पश्चिम ने गोर्बाचोव से वादा किया था कि नाटो पूर्व की ओर नहीं बढ़ेगा, नाटो रूस को घेर रहा है, और इसलिए यूक्रेन पर रूस का हमला एक बचाव था। क्या नाटो के विस्तार ने युद्ध को भड़काया, यह विद्वानों के बीच बहस का विषय है। Factiz इसका फ़ैसला नहीं करता। इस बहस के दोनों पक्षों की सामग्री टाइमलाइन पर है। यह डोसियर उन संस्करणों को टाइमलाइन पर रखता है जिन्हें न्यूज़रूम ने जाँचा। हर फैक्ट चेक बताता है कि उस न्यूज़रूम ने क्या पाया। Factiz अपना कोई निष्कर्ष नहीं जोड़ता। सूची में केवल वही फैक्ट चेक हैं जिन्हें हम दोबारा प्रकाशित कर सकते हैं, इसलिए यह पूरी नहीं है।'''
ar = '''
منذ تسعينيات القرن الماضي تعود رواية واحدة باستمرار: أن الغرب وعد غورباتشوف بأن الناتو لن يتوسع شرقًا، وأن الناتو يحاصر روسيا، وأن غزو روسيا لأوكرانيا كان لذلك دفاعًا. أما هل استفز توسع الناتو الحرب فهو موضع نقاش بين الباحثين، وFactiz لا تحسم هذا النقاش. وعلى الخط الزمني مواد من هذا النقاش، من الجانبين. يضع هذا الملف على خط زمني النسخ التي دققتها منصات صحفية. يبيّن كل تدقيق ما توصلت إليه تلك المنصة، ولا تضيف Factiz أي تصنيف من عندها. تضم القائمة فقط التدقيقات التي يحق لنا إعادة نشرها، لذلك فهي غير كاملة.'''
fa = '''
از دهه ۱۹۹۰ یک روایت دوباره و دوباره مطرح شده است: غرب به گورباچف قول داده بود که ناتو به شرق گسترش نمی‌یابد، ناتو روسیه را محاصره می‌کند و بنابراین حمله روسیه به اوکراین یک اقدام دفاعی بوده است. اینکه آیا گسترش ناتو جنگ را برانگیخته یا نه، میان پژوهشگران محل بحث است و Factiz درباره آن داوری نمی‌کند. نوشته‌هایی از این بحث، از هر دو طرف، روی خط زمانی آمده است. این پرونده روایت‌هایی را که رسانه‌ها بررسی کرده‌اند روی یک خط زمانی می‌گذارد. هر راستی‌آزمایی می‌گوید آن رسانه به چه نتیجه‌ای رسیده است و Factiz نتیجه‌گیری خودش را اضافه نمی‌کند. فهرست فقط شامل راستی‌آزمایی‌هایی است که اجازه انتشار دوباره‌شان را داریم، پس کامل نیست.'''

