[inleiding]
nl = """
Eén verhaal over Bill Gates komt steeds terug: dat hij met vaccins mensen een chip wil inbrengen, hen wil volgen of onvruchtbaar wil maken, de wereldbevolking wil verkleinen, of de pandemie zou hebben gepland. De vorm wisselt: een patent, een citaat, een video, een vaccinatie in een ander land. Dit dossier zet de versies die redacties hebben nagetrokken op een tijdlijn. Elke factcheck zegt wat die redactie vond; Factiz voegt geen eigen oordeel toe. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig."""
en = """
One story about Bill Gates keeps coming back: that he wants to use vaccines to implant chips in people, track them or make them infertile, reduce the world population, or that he planned the pandemic. The form changes: a patent, a quote, a video, a vaccination campaign in another country. This dossier puts the versions that newsrooms checked on a timeline. Each fact-check says what that newsroom found; Factiz adds no verdict of its own. The list holds only fact-checks we may republish, so it is not complete."""
de = """
Eine Erzählung über Bill Gates kehrt immer wieder: Er wolle Menschen mit Impfungen Chips einpflanzen, sie überwachen oder unfruchtbar machen, die Weltbevölkerung verkleinern, oder er habe die Pandemie geplant. Die Form wechselt: ein Patent, ein Zitat, ein Video, eine Impfkampagne in einem anderen Land. Dieses Dossier ordnet die Fassungen, die Redaktionen geprüft haben, auf einer Zeitleiste. Jeder Faktencheck sagt, was die jeweilige Redaktion herausfand; Factiz fügt kein eigenes Urteil hinzu. Die Liste enthält nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig."""
es = """
Un relato sobre Bill Gates vuelve una y otra vez: que quiere usar las vacunas para implantar chips, vigilar a las personas o volverlas estériles, reducir la población mundial, o que planeó la pandemia. La forma cambia: una patente, una cita, un vídeo, una campaña de vacunación en otro país. Este dosier ordena en una cronología las versiones que las redacciones han verificado. Cada verificación dice lo que encontró esa redacción; Factiz no añade un veredicto propio. La lista solo contiene verificaciones que podemos reproducir, así que no está completa."""
fr = """
Un récit sur Bill Gates revient sans cesse : il voudrait implanter des puces avec les vaccins, surveiller les gens ou les rendre stériles, réduire la population mondiale, ou il aurait planifié la pandémie. La forme change : un brevet, une citation, une vidéo, une campagne de vaccination dans un autre pays. Ce dossier place sur une chronologie les versions que des rédactions ont vérifiées. Chaque vérification dit ce que cette rédaction a trouvé ; Factiz n’ajoute aucun verdict. La liste ne contient que des vérifications que nous pouvons reprendre ; elle n’est donc pas complète."""
pt = '''
Uma história sobre Bill Gates não para de voltar: que ele quer usar vacinas para implantar chips nas pessoas, rastreá-las ou torná-las inférteis, reduzir a população mundial, ou que planejou a pandemia. A forma muda: uma patente, uma citação, um vídeo, uma campanha de vacinação em outro país. Este dossiê coloca em uma linha do tempo as versões que as agências checaram. Cada checagem diz o que aquela agência encontrou; a Factiz não acrescenta nenhuma classificação própria. A lista traz apenas checagens que podemos republicar, por isso não está completa.'''
ru = '''
Одна история о Билле Гейтсе возвращается снова и снова: будто он хочет с помощью вакцин вживлять людям чипы, следить за ними или делать их бесплодными, сократить население мира или что он спланировал пандемию. Форма меняется: патент, цитата, видео, кампания вакцинации в другой стране. В этом досье версии, которые проверили редакции, расположены на временной шкале. Каждый фактчек говорит о том, что нашла эта редакция. Своего вердикта Factiz не добавляет. В список входят только фактчеки, которые нам разрешено republish, поэтому он неполный.'''
uk = '''
Одна історія про Білла Гейтса постійно повертається: нібито він хоче за допомогою вакцин вживляти людям чипи, стежити за ними або робити їх безплідними, скоротити населення світу чи що він спланував пандемію. Форма змінюється: патент, цитата, відео, кампанія вакцинації в іншій країні. Це досьє розміщує на часовій шкалі версії, які перевіряли редакції. Кожен фактчек показує, що виявила ця редакція. Factiz не додає власного вердикту. У списку лише фактчеки, які ми можемо повторно публікувати, тому він неповний.'''
id = '''
Satu kisah tentang Bill Gates terus muncul kembali: bahwa ia ingin memakai vaksin untuk menanamkan cip pada orang, melacak mereka atau membuat mereka mandul, mengurangi jumlah penduduk dunia, atau bahwa ia merencanakan pandemi. Bentuknya berubah: sebuah paten, kutipan, video, atau kampanye vaksinasi di negara lain. Dosir ini menempatkan versi-versi yang diperiksa redaksi dalam satu lini masa. Setiap cek fakta menyampaikan apa yang ditemukan redaksi tersebut; Factiz tidak menambahkan kesimpulan sendiri. Daftar ini hanya memuat cek fakta yang boleh kami terbitkan ulang, sehingga tidak lengkap.'''
tr = '''
Bill Gates hakkındaki bir hikâye sürekli geri geliyor: aşılar yoluyla insanlara çip yerleştirmek, onları takip etmek ya da kısır bırakmak, dünya nüfusunu azaltmak istediği veya pandemiyi planladığı. Biçimi değişiyor: bir patent, bir alıntı, bir video, başka bir ülkedeki aşı kampanyası. Bu dosya, doğrulama kuruluşlarının incelediği sürümleri bir zaman çizelgesine yerleştiriyor. Her doğrulama, ilgili doğrulama kuruluşunun ne bulduğunu söyler; Factiz kendi başına bir karar eklemez. Liste yalnızca yeniden yayımlama iznimiz olan doğrulamaları içerir, bu yüzden eksiksiz değildir.'''
zh = '''
有一則關於比爾·蓋茲的傳言一再出現:說他想用疫苗在人體植入晶片、追蹤人,或讓人不孕,說他想減少世界人口,或說疫情是他策劃的。這則傳言的形式一直在變:專利、引述、影片,或是在其他國家的疫苗接種行動。這個專題把各查核機構查核過的不同版本放在時間軸上。每一份查核報告都說明該查核機構的發現,Factiz 不另外加上任何查核結果。清單裡只有我們可以轉載的查核報告,所以並不完整。'''
ja = '''
ビル・ゲイツ氏をめぐる、ある話が繰り返し出回っています。ワクチンで人々にチップを埋め込む、追跡する、不妊にする、世界の人口を減らす、あるいはパンデミックを計画した、というものです。形は変わります。特許、発言の引用、動画、他国でのワクチン接種キャンペーンなどです。この特集では、報道機関が検証した各種の言説を時系列に並べています。それぞれのファクトチェックには、その報道機関が確認した内容が書かれています。Factizが独自に判定を加えることはありません。一覧に載せているのは、転載を認められたファクトチェックだけなので、すべてを網羅しているわけではありません。'''
hi = '''
बिल गेट्स को लेकर एक कहानी बार-बार लौट आती है: कि वे वैक्सीन के ज़रिए लोगों में चिप लगाना, उन पर नज़र रखना या उन्हें बांझ बनाना चाहते हैं, दुनिया की आबादी घटाना चाहते हैं, या उन्होंने महामारी की योजना बनाई थी। इसका रूप बदलता रहता है: कभी पेटेंट, कभी कोई उद्धरण, कभी वीडियो, कभी किसी दूसरे देश का टीकाकरण अभियान। इस डोसियर में न्यूज़रूम द्वारा जांचे गए ये सभी रूप एक टाइमलाइन पर रखे गए हैं। हर फैक्ट चेक बताता है कि उस न्यूज़रूम ने क्या पाया। Factiz अपनी ओर से कोई निष्कर्ष नहीं जोड़ता। इस सूची में केवल वही फैक्ट चेक हैं जिन्हें हम दोबारा प्रकाशित कर सकते हैं, इसलिए यह पूरी नहीं है।'''
ar = '''
هناك قصة عن بيل غيتس تعود باستمرار: أنه يريد استخدام اللقاحات لزرع رقائق في الناس، أو تتبعهم، أو جعلهم عقيمين، أو تقليص عدد سكان العالم، أو أنه خطط للجائحة. وتتغير الصيغة: براءة اختراع، أو اقتباس، أو مقطع فيديو، أو حملة تطعيم في بلد آخر. يضع هذا الملف على خط زمني النسخ التي دققتها المنصات الإخبارية. يبيّن كل تدقيق ما توصلت إليه المنصة التي أجرته، ولا يضيف Factiz أي تصنيف من عنده. تضم القائمة فقط التدقيقات التي يحق لنا إعادة نشرها، لذلك فهي غير كاملة.'''
fa = '''
یک ماجرا درباره بیل گیتس بارها تکرار می‌شود: اینکه او می‌خواهد با واکسن در بدن مردم تراشه بکارد، آن‌ها را ردیابی کند یا ناباروریشان کند، جمعیت جهان را کم کند، یا اینکه همه‌گیری را او برنامه‌ریزی کرده است. شکل ماجرا عوض می‌شود: یک حق ثبت اختراع، یک نقل‌قول، یک ویدیو، یک کارزار واکسیناسیون در کشوری دیگر. این پرونده نسخه‌هایی را که رسانه‌ها بررسی کرده‌اند روی یک خط زمانی می‌گذارد. هر راستی‌آزمایی می‌گوید آن رسانه چه یافته است؛ Factiz نتیجه‌گیری خودش را اضافه نمی‌کند. این فهرست فقط شامل راستی‌آزمایی‌هایی است که اجازه بازنشر آن‌ها را داریم، پس کامل نیست.'''

