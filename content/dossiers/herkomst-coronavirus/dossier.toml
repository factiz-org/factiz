لم يُحسم بعد كيف انتقل فيروس كورونا إلى البشر. يرى باحثون ووكالات استخبارات أن الانتقال من الحيوانات وحادثًا وقع في مختبر كلاهما محتمل، وهم مختلفون في ذلك. أما ما دقّقته المنصات الإخبارية في كثير من الأحيان فهو ادعاءات تذهب أبعد من ذلك: أن الفيروس صُنع أو أُطلق عمدًا، أو أنه سُجّل ببراءة اختراع قبل عام 2019، أو أن شخصًا أو جهة بعينها خططت له. التصنيف الصادر عن ادعاء من نوع معين لا يقول شيئًا عن ادعاء من نوع آخر. يعرض هذا الملف على خط زمني النسخ التي دقّقتها المنصات. يبيّن كل تدقيق ما توصلت إليه المنصة التي أجرته، ولا تضيف Factiz أي تصنيف من عندها. تضم القائمة فقط التدقيقات التي يُسمح لنا بإعادة نشرها، ولذلك فهي غير كاملة.'''
fa = '''
