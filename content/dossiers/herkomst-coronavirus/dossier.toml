omschrijving = """
Claims about where the coronavirus SARS-CoV-2 came from: that it was made as a bioweapon or released on purpose (by China, the United States or anyone else), that it escaped from a laboratory by accident, that it came from the market in Wuhan, from bats, pangolins or other animals, that it was patented before 2019, or that a named person or organisation created it. It includes claims about the Wuhan Institute of Virology, gain-of-function research, Fort Detrick and EcoHealth Alliance when they are about the origin of the virus. It does not include claims about vaccines, treatments, masks, lockdowns, death numbers or the spread of the virus after it began, claims that Bill Gates planned the pandemic or profited from it (dossier gates-vaccins-chips), or claims about a network of US biolabs (dossier biolabs-oekraine)."""
