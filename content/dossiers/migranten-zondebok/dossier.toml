# Een dossier van het platform (PLAN #33.6, SPECS E9.S7). Een mens schrijft dit bestand; de factchecks die erbij
# horen staan in factchecks.json en komen daar alleen na goedkeuring. `python -m doublecheck.dossiers` leest en keurt.
# Concept van Claude (PLAN #37.5): een dossier dat vooral rust op de eigen redactie van Factiz (B83), omdat het archief
# weinig westerse factchecks over dit verhaal heeft. De PO las het en gaf akkoord op 2026-11-19.

soort = "verhaal"            # verhaal of netwerk
status = "akkoord"           # concept of akkoord; alleen akkoord gaat in een uitgave
akkoord = '2026-11-19, PO: "Alle andere dossiers zijn ook akkoord"'
thema = "migration"          # uit content/themas.json
onderdeel = "asylum"
verwant = ["migratie-europa"]

[naam]
nl = "Het verhaal dat migranten in Europa achter geweld zitten of voorrang krijgen"
en = "The story that migrants in Europe are behind violence or get special treatment"
de = "Die Erzählung, dass Migranten in Europa hinter Gewalt stecken oder bevorzugt werden"
es = "El relato de que los migrantes en Europa están detrás de la violencia o tienen privilegios"
fr = "Le récit selon lequel les migrants en Europe sont derrière la violence ou sont favorisés"

[inleiding]
nl = """
Sinds 2015, toen het aantal asielzoekers in Europa sterk steeg, komt één verhaal steeds terug in een nieuwe vorm: dat
migranten, vluchtelingen of moslims achter geweld, misdaad, rellen en aanslagen zitten, of dat ze voorrang krijgen bij
een huis, een uitkering of kinderopvang. Volgens het netwerk van factcheckers van EDMO gaat het vaak om oude beelden met
een nieuwe tekst, en soms om een verhaal dat helemaal verzonnen is. Dit dossier zet de versies die zijn nagetrokken op
een tijdlijn, met onderzoek en rapporten erover. Uit 2025 en 2026 heeft het archief weinig factchecks over dit verhaal
die we mogen overnemen; de recente versies checkte vooral de eigen redactie van Factiz. Elke factcheck zegt wie hem
maakte en wat die vond. In de lijst staan alleen factchecks die we mogen overnemen; ze is dus niet volledig. Aantallen
migranten, boten en routes, het beleid van de EU en het idee van een grote vervanging staan in een ander dossier."""
en = """
Since 2015, when the number of asylum seekers in Europe rose sharply, one story keeps returning in a new form: that
migrants, refugees or Muslims are behind violence, crime, riots and attacks, or that they get priority for housing,
benefits or childcare. According to the EDMO network of fact-checkers, it is often old footage with a new caption, and
sometimes a story that is invented from start to finish. This dossier puts the versions that were checked on a
timeline, with research and reports on them. For 2025 and 2026 the archive holds few fact-checks on this story that we
may republish; the recent versions were checked mostly by Factiz's own desk. Each fact-check says who made it and what
they found. The list holds only fact-checks we may republish, so it is not complete. Numbers of migrants, boats and
routes, EU policy and the idea of a great replacement are in another dossier."""
de = """
Seit 2015, als die Zahl der Asylsuchenden in Europa stark stieg, kehrt eine Erzählung immer wieder in neuer Form
zurück: Migranten, Geflüchtete oder Muslime steckten hinter Gewalt, Kriminalität, Krawallen und Anschlägen, oder sie
würden bei Wohnungen, Sozialleistungen oder der Kinderbetreuung bevorzugt. Laut dem Faktencheck-Netzwerk von EDMO
handelt es sich oft um alte Bilder mit neuem Text und manchmal um eine von Anfang bis Ende erfundene Geschichte. Dieses
Dossier ordnet die überprüften Fassungen auf einer Zeitleiste, mit Forschung und Berichten dazu. Für 2025 und 2026 hat
das Archiv wenige Faktenchecks zu dieser Erzählung, die wir übernehmen dürfen; die neueren Fassungen hat vor allem die
eigene Redaktion von Factiz geprüft. Jeder Faktencheck sagt, wer ihn gemacht hat und was er ergab. Die Liste enthält
nur Faktenchecks, die wir übernehmen dürfen; sie ist also nicht vollständig. Zahlen zu Migranten, Booten und Routen,
die Politik der EU und die Idee eines großen Austauschs stehen in einem anderen Dossier."""
es = """
Desde 2015, cuando el número de solicitantes de asilo en Europa aumentó con fuerza, un relato vuelve una y otra vez con
una forma nueva: que los migrantes, los refugiados o los musulmanes están detrás de la violencia, la delincuencia, los
disturbios y los atentados, o que tienen prioridad para una vivienda, una ayuda o una guardería. Según la red de
verificadores de EDMO, a menudo se trata de imágenes antiguas con un texto nuevo y a veces de una historia inventada de
principio a fin. Este dosier ordena en una cronología las versiones que se verificaron, con investigaciones e informes
sobre ellas. De 2025 y 2026 el archivo tiene pocas verificaciones sobre este relato que podamos reproducir; las
versiones recientes las verificó sobre todo la redacción propia de Factiz. Cada verificación dice quién la hizo y qué
encontró. La lista solo contiene verificaciones que podemos reproducir, así que no está completa. Las cifras de
migrantes, barcos y rutas, la política de la UE y la idea de un gran reemplazo están en otro dosier."""
fr = """
Depuis 2015, quand le nombre de demandeurs d’asile en Europe a fortement augmenté, un récit revient sans cesse sous une
forme nouvelle : les migrants, les réfugiés ou les musulmans seraient derrière la violence, la délinquance, les émeutes
et les attentats, ou bien ils auraient la priorité pour un logement, une allocation ou une crèche. Selon le réseau de
vérificateurs d’EDMO, il s’agit souvent d’images anciennes avec une nouvelle légende, et parfois d’une histoire
inventée de bout en bout. Ce dossier place sur une chronologie les versions qui ont été vérifiées, avec des recherches
et des rapports à leur sujet. Pour 2025 et 2026, l’archive contient peu de vérifications sur ce récit que nous pouvons
reprendre ; les versions récentes ont surtout été vérifiées par la rédaction de Factiz. Chaque vérification dit qui l’a
faite et ce qu’elle a trouvé. La liste ne contient que des vérifications que nous pouvons reprendre ; elle n’est donc
pas complète. Les chiffres sur les migrants, les bateaux et les routes, la politique de l’UE et l’idée d’un grand
remplacement figurent dans un autre dossier."""

[nagelezen]
nl = false
en = false
de = false
es = false
fr = false

