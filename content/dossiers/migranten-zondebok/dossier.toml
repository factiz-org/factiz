# Voor het voorstellen van factchecks (`python -m doublecheck.dossiers`); dit deel gaat niet in de uitgave.
[voorstel]
woorden = ["migrant", "migrat", "immigr", "inmigr", "imigr", "refugee", "refugiad", "réfugié", "vluchteling", "Flüchtling",
  "Geflüchtet", "profughi", "uchodźc", "беженц", "мигрант", "мігрант", "біженц", "لاجئ", "مهاجر", "پناهجو", "پناهنده",
  "sığınmacı", "göçmen", "mülteci", "शरणार्थी", "asiel", "asylum", "Asyl", "asilo", "asile", "seekers", "statushouder",
  "Ausländer", "allochto", "Zuwander", "clandestin", "sans-papiers", "illegalen", "muslim", "moslim", "moslims", "Muslime",
  "musulm", "muçulman", "muzułm", "мусульман", "Müslüman", "मुस्लिम", "ముస్లిం", "முஸ்லிம்", "মুসলিম", "മുസ്ലിം", "ಮುಸ್ಲಿಂ",
  "مسلمان", "islam", "sharia", "burqa", "boerka", "marroqu", "magreb", "Marokkan", "Nordafrikan", "Eritre", "Afghan",
  "Rotherham", "grooming gang", "Silvesternacht", "Cologne", "Southport", "Molenbeek", "Malmö", "banlieue", "non-droit",
  "No-Go", "Solingen", "Magdeburg", "Mannheim", "Epping", "Bürgergeld"]
omschrijving = """
Claims, images and videos from 2015 onwards that blame migrants, refugees, asylum seekers or Muslims in Europe for
crime, violence, riots, terror attacks, sexual assault, or attacks on police and firefighters; claims that migrants or
refugees in Europe get privileges such as free housing, money, benefits, healthcare, childcare or priority over natives;
old or foreign footage presented as migrants or Muslims causing trouble in Europe now; crime statistics about migrants in
Europe; and "no-go zones" or sharia zones in European cities. Europe here means the EU, the UK, Ireland, Norway,
Switzerland and the Balkans. Say "nee" when the claim is set in another country (India, Pakistan, Bangladesh, Iran,
Turkey, Russia, Japan, the United States, Latin America, Africa), even if it is about migrants or Muslims. It does not
include: numbers of arrivals, boats, routes, rescue ships, EU migration policy or deals with other countries, or the
"great replacement" and claims that Muslims are taking over Europe (another dossier); attacks on migrants or Muslims;
and claims about Gaza or pro-Palestinian protests unless they blame migrants or Muslims in Europe."""
