zh = "歐盟把這名被指公開指控經營 CopyCop 假新聞網站網絡的男子列入制裁名單"
ja = "EUは、偽ニュースサイトのネットワーク「CopyCop」を運営していると公に非難されている人物を、制裁リストに載せた"
hi = "EU ने उस व्यक्ति को अपनी प्रतिबंध सूची में डाला है, जिस पर सार्वजनिक रूप से फ़र्ज़ी न्यूज़ वेबसाइटों के CopyCop नेटवर्क को चलाने का आरोप है"
ar = "الاتحاد الأوروبي يضع على قائمة عقوباته الرجل الذي يقول إنه متهم علنًا بتشغيل شبكة CopyCop من مواقع الأخبار المزيفة"
fa = "اتحادیه اروپا مردی را که به گفته این اتحادیه علناً به اداره شبکه CopyCop و وب‌سایت‌های خبری جعلی متهم است، در فهرست تحریم‌های خود قرار می‌دهد"

