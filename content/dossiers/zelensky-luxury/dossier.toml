ru = "ЕС вносит в санкционный список человека, которого, по его данным, публично обвиняют в управлении сетью поддельных новостных сайтов CopyCop"
uk = "ЄС вносить до санкційного списку людину, яку, за його словами, публічно звинувачують у керуванні мережею фейкових новинних сайтів CopyCop"
id = "Uni Eropa memasukkan pria yang menurutnya dituduh secara terbuka mengoperasikan jaringan situs berita palsu CopyCop ke dalam daftar sanksinya"
