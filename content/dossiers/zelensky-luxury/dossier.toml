[item.titel]
nl = "De EU zet de man die er volgens haar publiekelijk van wordt beschuldigd het CopyCop-netwerk van nepnieuwssites te runnen op de sanctielijst"
en = "The EU puts the man it says is publicly accused of operating the CopyCop network of fake news websites on its sanctions list"
de = "Die EU setzt den Mann auf ihre Sanktionsliste, dem nach ihren Angaben öffentlich vorgeworfen wird, das CopyCop-Netzwerk gefälschter Nachrichtenseiten zu betreiben"
