# Voor het voorstellen van factchecks (`python -m doublecheck.dossiers`); dit deel gaat niet in de uitgave.
[voorstel]
woorden = ["oekra", "ukrain", "ucrania", "kyiv", "kiev", "kiew", "kyjiw", "zelensk", "selensk", "украин", "україн", "зеленск", "зеленськ"]
omschrijving = """
Claims about the war in Ukraine that circulated in 2025 or 2026: about money, aid, energy and gas, about the number of
dead and wounded, about Zelensky and his government, about NATO and peace talks, about conscription, and images or
videos presented as showing an attack, a battle or a statement in this war. New versions of older stories (NATO
enlargement, Zelensky's luxury, Nazis in Ukraine) belong here when they circulated in 2025 or 2026. It does not include
claims from before 2025, claims about other conflicts, or claims that only mention Ukraine in passing."""
