# Een dossier van het platform (PLAN #33.6, SPECS E9.S7). Een mens schrijft dit bestand; de factchecks die erbij
# horen staan in factchecks.json en komen daar alleen na goedkeuring. `python -m doublecheck.dossiers` leest en keurt.
# Concept van Claude (PLAN #37.5, PO 2026-11-18: "Ja, maak het dossier"): het eerste dossier waarin de eigen redactie
# van Factiz een groot deel van de checks maakt (B83). De PO las het en gaf akkoord op 2026-11-19. De eigen checks erin
# gaan pas mee als ze gepubliceerd zijn (een menselijke auteur en een andere nalezer, B82); tot dan toont de uitgave de rest.

soort = "verhaal"            # verhaal of netwerk
status = "akkoord"           # concept of akkoord; alleen akkoord gaat in een uitgave
akkoord = '2026-11-19, PO: "Oekraïne is akkoord, zet die op akkoord"'
thema = "war"                # uit content/themas.json
onderdeel = "ukraine"
verwant = ["biolabs-oekraine", "nazi-oekraine", "navo-uitbreiding", "zelensky-luxury"]

[naam]
nl = "De oorlog in Oekraïne: wat er in 2025 en 2026 rondging"
en = "The war in Ukraine: what circulated in 2025 and 2026"
de = "Der Krieg in der Ukraine: was 2025 und 2026 kursierte"
es = "La guerra en Ucrania: lo que circuló en 2025 y 2026"
fr = "La guerre en Ukraine : ce qui a circulé en 2025 et 2026"

[inleiding]
nl = """
Over de oorlog in Oekraïne gaat elke week iets rond dat niet klopt: over geld en gas, over het aantal doden, over
Zelensky en over de NAVO, en beelden die bij een andere aanval horen. Dit dossier zet wat in 2025 en 2026 is
nagetrokken op een tijdlijn. Een deel checkte de eigen redactie van Factiz, vaak omdat het in het Nederlands rondging en
nog niemand het had gedaan; de rest komt van redacties waarvan we de checks mogen overnemen. Elke factcheck zegt wie hem
maakte en wat die vond. Verhalen die al langer rondgaan, zoals de biolabs, de nazi's in Oekraïne, de NAVO-uitbreiding
en de luxe van Zelensky, hebben daarnaast een eigen dossier met hun geschiedenis."""
en = """
Every week something about the war in Ukraine circulates that is not true: about money and gas, about the number of
dead, about Zelensky and about NATO, and images that belong to another attack. This dossier puts what was checked in
2025 and 2026 on a timeline. Part of it was checked by Factiz's own desk, often because it circulated in Dutch and
nobody had checked it yet; the rest comes from newsrooms whose fact-checks we may republish. Each fact-check says who
made it and what they found. Stories that have circulated for longer, such as the biolabs, the Nazis in Ukraine, NATO
enlargement and Zelensky's luxury, also have a dossier of their own with their history."""
de = """
Jede Woche kursiert über den Krieg in der Ukraine etwas, das nicht stimmt: über Geld und Gas, über die Zahl der Toten,
über Selenskyj und über die NATO, und Bilder, die zu einem anderen Angriff gehören. Dieses Dossier ordnet, was 2025 und
2026 überprüft wurde, auf einer Zeitleiste. Einen Teil hat die eigene Redaktion von Factiz geprüft, oft weil es auf
Niederländisch kursierte und noch niemand es geprüft hatte; der Rest stammt von Redaktionen, deren Faktenchecks wir
übernehmen dürfen. Jeder Faktencheck sagt, wer ihn gemacht hat und was er ergab. Erzählungen, die schon länger
kursieren, etwa über die Biolabore, die Nazis in der Ukraine, die NATO-Erweiterung und Selenskyjs Luxus, haben daneben
ein eigenes Dossier mit ihrer Geschichte."""
es = """
Cada semana circula algo falso sobre la guerra en Ucrania: sobre el dinero y el gas, sobre el número de muertos, sobre
Zelenski y sobre la OTAN, e imágenes que pertenecen a otro ataque. Este dosier ordena en una cronología lo que se
verificó en 2025 y 2026. Una parte la verificó la redacción propia de Factiz, a menudo porque circulaba en neerlandés y
nadie lo había hecho todavía; el resto viene de redacciones cuyas verificaciones podemos reproducir. Cada verificación
dice quién la hizo y qué encontró. Los relatos que circulan desde hace más tiempo, como los biolaboratorios, los nazis
en Ucrania, la ampliación de la OTAN y el lujo de Zelenski, tienen además su propio dosier con su historia."""
fr = """
Chaque semaine, quelque chose de faux circule sur la guerre en Ukraine : sur l’argent et le gaz, sur le nombre de
morts, sur Zelensky et sur l’OTAN, et des images qui appartiennent à une autre attaque. Ce dossier place sur une
chronologie ce qui a été vérifié en 2025 et 2026. Une partie a été vérifiée par la rédaction de Factiz, souvent parce
que cela circulait en néerlandais et que personne ne l’avait encore fait ; le reste vient de rédactions dont nous
pouvons reprendre les vérifications. Chaque vérification dit qui l’a faite et ce qu’elle a trouvé. Les récits qui
circulent depuis plus longtemps, comme les biolaboratoires, les nazis en Ukraine, l’élargissement de l’OTAN et le luxe
de Zelensky, ont en plus leur propre dossier avec leur histoire."""

[nagelezen]
nl = false
en = false
de = false
es = false
fr = false

