  "We twijfelden tussen Onbewezen en Misleidend. Misleidend, omdat de post als vaststaand brengt wat geen sportbond of rechter heeft vastgesteld; Onbewezen, omdat Khelif zelf zei dat ze het SRY-gen heeft, wat volgens de regels van World Boxing en het IOC als mannelijke geslachtsontwikkeling telt, behalve bij een uitzondering waarover niets openbaar is. We kozen Onbewezen.",
]

