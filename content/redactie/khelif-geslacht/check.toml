# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B85), in het Nederlands, uit de weekradar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/khelif-geslacht/dossier.md, ingekort tot ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-22, PO: "innkorten is goed, , ik heb ze nagelezen, akkoord").

sleutel = "khelif-geslacht"
status = "gepubliceerd"
taal = "nl"
adres = "khelif-biologisch-man"
adres_en = "khelif-biologically-male"
kop = "Imane Khelif heeft het SRY-gen, maar het is niet vastgesteld dat ze biologisch man is"
oordeel = "onbewezen"
oordeel_zin = "Khelif zei in februari 2026 zelf dat ze het SRY-gen heeft, maar er is geen testuitslag openbaar, en geen sportbond of rechter heeft vastgesteld dat ze biologisch man is [4] [7] [8]."
soort = "context"
reikwijdte = "internationaal"

bewering = "OMG. Dat een biologisch mannelijke bokser tegen vrouwen bokst, moet en zal als sportief hoogtepunt worden gevierd. Maar wie dat vrouwenmishandeling noemt, moet en zal worden gecanceld. Blijkbaar mag maar één visie zegevieren."
platform = "X"
eerst_gezien = "2026-11-12"
posts = 1
bereik = "437 likes en 18 reacties op 22 november"

kort = """
Een post op X noemt een bokser die tegen vrouwen bokst, vermoedelijk Imane Khelif, biologisch mannelijk [1] [3]. \
Khelif zei in februari 2026 zelf dat ze het SRY-gen heeft, dat volgens het IOC wijst op een mannelijke \
geslachtsontwikkeling, en dat ze als meisje is opgevoed en niet transgender is [4] [8]. Of ze in de sport als man \
telt, hangt af van een test en een medisch oordeel waarvan niets openbaar is, en geen sportbond of rechter heeft \
erover beslist [6] [7] [8]."""

tekst = """
De post noemt geen naam en citeert een eigen post van 9 november over iets dat HLN een sportief hoogtepunt \
noemde [1] [2]. Dat hij over Khelif gaat, leiden we af uit het moment: op 6 november kondigde ze haar eerste profpartij \
aan [3]. Die week ging ook een Engelstalige post rond over een man in het olympische vrouwenboksen [11].

Khelif, een Algerijnse bokser, won in 2024 olympisch goud bij de vrouwen [3]. In de Franse sportkrant L'Équipe \
bevestigde ze op 4 februari 2026 dat ze het SRY-gen heeft, een gen dat meestal op het Y-chromosoom ligt [4] [8]. Haar \
antwoord: "Ja, en dat is natuurlijk." [4] Ze zei ook dat ze voor wedstrijden haar testosteron met hormonen verlaagde, \
en dat ze als meisje is opgevoed en geen transvrouw is [4]. Een diagnose noemde ze niet [4].

World Boxing telt een bokser met het SRY-gen sinds augustus 2025 als man, behalve bij een volledige ongevoeligheid \
voor mannelijke hormonen [4] [6]. Het IOC besloot in maart 2026 dat vanaf de Spelen van 2028 alleen vrouwen zonder het \
SRY-gen in de vrouwencategorie uitkomen, behalve bij zeldzame aandoeningen waarbij testosteron geen voordeel \
geeft [8]. Die regel werkt niet terug en zegt volgens het IOC niets over iemands wettelijke geslacht [8].

World Boxing liet Khelif in 2025 niet meer meedoen tot ze een genetische test had gedaan, en het sporttribunaal TAS \
weigerde dat besluit op 1 september 2025 op te schorten [7]. De zaak loopt vertrouwelijk, en een uitspraak vonden we \
niet [7]. Khelif zei in februari dat ze World Boxing haar medische dossier stuurde, zonder antwoord [4].

Documenten in een Frans tijdschrift die in 2024 zouden bewijzen dat ze een man is, noemde het IOC niet \
geverifieerd [9]. In augustus 2024, voor het interview, noemden RTBF en FactCheck.org de bewering dat Khelif een man is \
onwaar [12] [13]."""

niet_weten = """
We weten niet of Khelif een test op het SRY-gen voor World Boxing of het IOC deed, en wat artsen bij haar vaststelden. \
Ook weten we niet zeker dat de post over haar gaat."""

