kort = """
Een Nederlandse post op X zegt dat de NAVO een afspraak brak door landen richting Rusland toe te laten [11]. In 1990 \
zeiden Amerikaanse en Duitse politici mondeling tegen Michail Gorbatsjov dat de NAVO niet naar het oosten zou \
opschuiven, maar in het verdrag over de hereniging van Duitsland staat alleen iets over het oosten van Duitsland [1] [2]. \
In 1997 tekende Rusland zelf een akte met de NAVO die het recht van elk land erkent om te kiezen hoe het zijn \
veiligheid regelt [4]."""

tekst = """
Op zaterdag 17 oktober 2026 om 19:48 verscheen op X een post voor iedereen die zegt dat Rusland zonder reden aan de \
oorlog begon [11]. De NAVO had zich volgens de post aan een afspraak moeten houden en geen landen richting Rusland \
mogen toelaten [11]. Welke afspraak, staat er niet bij [11]. Wel zit er een scan bij van het Amerikaanse verslag van \
het gesprek tussen James Baker en Michail Gorbatsjov van 9 februari 1990, uit het National Security Archive, met de zin \
over "one inch to the east" [11] [1]. Boven de scan staat dat het gesprek ging over een verenigd Duitsland in de NAVO \
en "no NATO expansion" [11]. In het verslag zelf staat de zin in een voorwaarde: als de Verenigde Staten aanwezig \
blijven in een Duitsland dat bij de NAVO hoort [11] [1].

Wat er in 1990 is gezegd

Op 9 februari 1990 sprak de Amerikaanse minister van Buitenlandse Zaken James Baker in Moskou met Gorbatsjov over de \
hereniging van Duitsland [1]. Volgens het Amerikaanse verslag zei hij drie keer dat de NAVO "not one inch" naar het oosten \
zou opschuiven, als een verenigd Duitsland lid van de NAVO bleef [1]. Een dag later zei bondskanselier Helmut Kohl tegen \
Gorbatsjov dat de NAVO haar werkgebied niet moest uitbreiden [1]. De West-Duitse minister Hans-Dietrich Genscher had dat \
eind januari al in een toespraak gezegd [1].

Het ging daarbij niet alleen over Oost-Duitsland, schrijft het National Security Archive van de George Washington \
University, dat de verslagen in 2017 publiceerde [1]. Zo zei de Britse minister Douglas Hurd in maart 1991 nog dat de \
NAVO geen plannen had om landen uit Midden- en Oost-Europa op te nemen [1]. Maar president George Bush zei eind \
februari 1990 tegen Kohl dat het Westen had gewonnen en Moskou niet [1].

Wat op papier kwam

Het verdrag over de hereniging werd op 12 september 1990 in Moskou getekend door beide Duitslanden, de Sovjet-Unie, de \
Verenigde Staten, het Verenigd Koninkrijk en Frankrijk [2]. Er mogen geen buitenlandse troepen en kernwapens in het \
oosten van Duitsland komen, en Duitsland mag zelf kiezen bij welk bondgenootschap het hoort [2]. Over andere landen of \
over uitbreiding van de NAVO staat er niets in [2]. De toezeggingen over het oosten staan volgens het National Security \
Archive niet in verdragen, alleen in verslagen van gesprekken [1].

In 1997 tekenden de NAVO en Rusland in Parijs een akte over hun betrekkingen [4]. Daarin erkennen ze het recht van elk \
land om zelf te kiezen hoe het zijn veiligheid regelt [4]. Over nieuwe leden zegt de akte alleen dat de NAVO geen plan \
heeft om daar kernwapens te plaatsen [4]. In 2008 spraken de NAVO-landen af dat Oekraïne en Georgië lid zullen worden \
[6]. Lid is Oekraïne nu niet [9].

Wat Gorbatsjov zelf zei

In een interview in 2014 zei Gorbatsjov dat uitbreiding van de NAVO in 1990 helemaal niet ter sprake kwam [3]. De \
toezegging van Baker ging volgens hem over Oost-Duitsland, en daar wordt de regeling nageleefd [3]. Het latere besluit \
om de NAVO uit te breiden noemde hij wel in strijd met de geest van wat hem in 1990 was verzekerd [3].

Het verhaal nu

De Russische president Vladimir Poetin zei in december 2025 dat geen uitbreiding naar het oosten in het openbaar was \
beloofd [7]. Op 26 juli 2026 zei hij dat het Westen Gorbatsjov had beloofd \
de NAVO niet uit te breiden [8]. De NAVO noemt de belofte een mythe: \
het idee uit 1990 werd losgelaten, en geen verdrag met Rusland verbiedt nieuwe leden [5]. Bij gesprekken in Abu Dhabi \
in november 2026 vroeg Rusland volgens uitgelekte stukken om een verbod op verdere uitbreiding [9].

Of de uitbreiding van de NAVO de oorlog uitlokte, is een debat onder onderzoekers, en dat beslissen we hier niet. De \
post zegt iets anders: dat er een afspraak was [11]. Die is nooit ondertekend [1] [2]. Er waren mondelinge toezeggingen in 1990 en \
1991, in gesprekken over Duitsland [1]. PolitiFact beoordeelde in 2022 een vergelijkbare bewering als grotendeels \
onwaar [10]. In het Nederlands kwam dpa in 2025 uit op uit de context gehaald, en Nieuwscheckers op deels onwaar [12] [13]."""

niet_weten = """
We weten niet welke afspraak de schrijver bedoelt; het verslag van 9 februari 1990 dat erbij staat, is een gesprek, \
geen afspraak op papier. Of de toezeggingen van 1990 een politieke belofte waren, daarover verschillen de lezingen: het National \
Security Archive noemt de latere Russische klachten gegrond in de verslagen van toen, de NAVO noemt de belofte een \
mythe [1] [5]."""

