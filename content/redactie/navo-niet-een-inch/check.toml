kop = "Geen verdrag of getekende afspraak verbood de NAVO om landen richting Rusland toe te laten"
oordeel = "misleidend"
oordeel_zin = "Westerse politici zeiden in 1990 mondeling dat de NAVO niet naar het oosten zou opschuiven, maar op papier kwam alleen iets over Oost-Duitsland, en Rusland tekende in 1997 zelf voor het recht van elk land om te kiezen [1] [2] [4]."
soort = "context"
