# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B85), in het Engels, uit de weekradar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/faa-ground-stop/dossier.md, ingekort tot ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-22, PO: "innkorten is goed, , ik heb ze nagelezen, akkoord").

sleutel = "faa-ground-stop"
status = "gepubliceerd"
taal = "en"
adres = "trump-national-emergency-ground-stop"
kop = "Mullin said Trump declared a national emergency over the ground stop, but there is no declaration"
oordeel = "misleidend"
oordeel_zin = "Homeland Security Secretary Markwayne Mullin said it at the White House, but no declaration appears in the Federal Register or among the president's actions, and he said it while asking Congress for money [2] [4] [5]."
soort = "context"
reikwijdte = "internationaal"
vorm = "video"

bewering = "🚨 HOLY CRAP: President Trump has DECLARED A NATIONAL EMERGENCY over America's broken air traffic control system.  A reporter asked whether a cyberattack or a rogue AI did this. DHS Secretary Markwayne Mullin says there's ZERO EVIDENCE of a cyberattack so far."
platform = "X"
eerst_gezien = "2026-11-14"
posts = 6
bereik = "14,713 likes and 877 replies on November 22; five other posts with the same claim had 23,107 likes together"

kort = """
There is no declaration of a national emergency over the US ground stop, although Homeland Security Secretary \
Markwayne Mullin said that President Trump had made one [2] [11]. A clip of his briefing went round on X as news of that \
declaration [1]. No proclamation or order appears in the Federal Register, where the law says it must be published, and \
Mullin said it while asking Congress for money [2] [4] [6]."""

tekst = """
On November 13, at about 3:30 p.m. Eastern time (20:30 UTC), the Federal Aviation Administration (FAA) stopped all \
departures from US airports, a ground stop [8]. A flood of data on its telecommunications network had made older \
equipment unstable, and the FAA says it has no indication of a cyberattack [8].

That evening Mullin and Transportation Secretary Sean Duffy briefed reporters at the White House [9]. Mullin called the \
old air traffic control system a national security risk and said: "The President has declared this a national \
emergency, and now we have to have Congress act and fund it." [2] His department published the sentence, and The \
National News Desk reported it that night [2] [11].

At 01:54 UTC on November 14, the account Gunther Eagleman posted a clip of the briefing with the text that Trump had \
declared a national emergency [1]. A later post called the ground stop a military operation under a national emergency, \
and Mike Flynn, a former national security adviser, wrote of reports that military units were on alert, but we found \
no such report [13] [14].

Under the National Emergencies Act, the president declares a national emergency in a proclamation that goes to \
Congress and is published in the Federal Register [6]. Trump declared one on the power grid in August, in Executive \
Order 14421 [7]. For the ground stop we found none: the Federal Register has published three presidential \
documents since November 13, none about air traffic or an emergency, and the White House lists no such action [4] [5].

Trump himself said nothing in public until November 15, when he asked Congress for the "desperately needed money for \
Air Traffic Control" [10]. The White House's summary of the briefing puts an ellipsis where Mullin's sentence was, and \
quotes Duffy: "This is an emergency. I want Congress to give us emergency funding." [3] [11]"""

niet_weten = """
We do not know whether Trump called the outage a national emergency in private, or whether Mullin meant the call for \
emergency funding [2] [3], nor why the White House left his sentence out [3]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-22"

nog_doen = []

nog_uitzoeken = [
  "What Mullin based his words on, and whether DHS or the White House has corrected them.",
  "Whether a declaration about air traffic control still follows; we looked up to November 22.",
  "We weighed Misleading against False. Mullin did say the words, which made us choose Misleading; there is no declaration, which points to False.",
]

