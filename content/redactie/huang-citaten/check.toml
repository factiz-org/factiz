# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B89), in het Engels, uit de Engelse radar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/huang-citaten/dossier.md, ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-23, PO: "Akkoord", na het nalezen van de acht in het voorbeeld).

sleutel = "huang-citaten"
status = "gepubliceerd"
taal = "en"
adres = "jensen-huang-official-statement"
kop = "This \"official statement\" from Jensen Huang is made up: Nvidia never published it"
oordeel = "onwaar"
oordeel_zin = "Nvidia never published this statement, and the email from Huang that Nvidia did publish, three days before the date on the letter, says the opposite: he apologized and took full responsibility [1] [5]."
soort = "verzonnen"
reikwijdte = "internationaal"
vorm = "beeld"

bewering = "BREAKING: JENSEN HUANG FINALLY BREAKS HIS SILENCE [...]"
platform = "X"
eerst_gezien = "2026-11-12"
posts = 1
bereik = "90 likes and 21 replies on November 19; deleted by its author by November 23"

kort = """
On November 12, a post on X showed an "official statement" from Nvidia, dated November 11, in which Jensen Huang \
denies the reports about him [6]. Nvidia never published it: its newsroom has no item from November 11, and the only \
message from Huang it published is an email of November 8 in which he apologized [1] [5]. In his first public words \
after resigning, on November 17, Huang wrote that he had made serious mistakes [7] [9]."""

tekst = """
On November 8, Nvidia's board started an independent investigation after reports that Huang had been the target of a \
foreign intelligence effort [2]. The same day, Nvidia published an email Huang had sent to its staff, in which he \
apologized, took full responsibility and promised to cooperate fully [1]. On November 12, Nvidia announced that he \
had resigned as chief executive and board member [4]. The release has no words from him [4].

At 03:29 UTC on November 12, an account on X posted that Huang had "finally" broken his silence [6]. With it came a \
picture of a letter under the Nvidia logo, titled "Official Statement", dated November 11 and signed by Huang, in \
which he calls the recent reports about him completely false [6]. The post named no source, and its author has since \
deleted it [6].

Nvidia's newsroom has no item dated November 11, and none of its four items about the investigation and the change \
of leadership contains a denial by Huang [1] [2] [3] [4] [5]. The letter also contradicts the email he did send, \
three days before its date [1]. And it has a typing error: "cntire" for "entire" [6].

On November 17, on his own account on X, Huang wrote that he had made serious mistakes and deeply regretted the \
problems he created for the board [7] [9]. He would be honored to return as chief executive, he wrote, if the board \
decided that was best [8] [9]. The same day, board chair Harvey \
Jones said the board does not intend to reinstate him [8].

The only denial from Huang's side that we found came on November 20, when his spokesman dismissed as fabrications \
the allegations in The New York Times about how he treated staff [13]. Those are other reports, published after the date on \
the letter [13]."""

niet_weten = """
We do not know who made the letter, or whether it first appeared somewhere else [6]. We saw one post with it [6]. We \
found no report that Huang spoke to reporters between November 8 and 17 [8] [9] [10]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-23"

nog_doen = []

nog_uitzoeken = [
  "Who made the letter, and where it first appeared, in English or in another language.",
  "How many posts carried the letter. We saw one, since deleted by its author; a second post on the same subject from November 12 was also deleted.",
  "Whether other messages in Huang's name, such as a farewell message, also went around, and whether those are made up too.",
  "Whether Huang said anything to reporters between his email of November 8 and his post of November 17.",
]

