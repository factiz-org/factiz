bewering = "Voormalig hoofd van de Oekraïense anticorruptiedienst: Zelensky bezit 6 panden in Spanje, 14 in het Verenigd Koninkrijk, 21 in Frankrijk, 8 in Italië en 34 in de Verenigde Arabische Emiraten."
