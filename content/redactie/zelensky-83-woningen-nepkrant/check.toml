kort = """
Op 7 september ging op X een video rond waarin een oud-medewerker van de Oekraïense anticorruptiedienst zou onthullen \
dat Zelensky 83 panden in vijf landen bezit [1]. Het verhaal begon in augustus 2025 op londontelegraph.uk, een site die \
twaalf dagen eerder was geregistreerd en een gestolen foto bij de naam van de schrijver zette [3] [4]. De dienst zegt \
dat de vrouw in de video er niet werkte, en in de vermogensverklaring van Zelensky is geen spoor van 83 panden in het \
buitenland [6] [9] [10]."""

tekst = """
De post verscheen op maandag 7 september om 05:58 op X, met een video van 77 seconden [1]. Volgens de tekst zegt een \
voormalig hoofd van de Oekraïense anticorruptiedienst dat Zelensky 6 panden in Spanje bezit, 14 in het Verenigd \
Koninkrijk, 21 in Frankrijk, 8 in Italië en 34 in de Verenigde Arabische Emiraten [1]. Samen zijn dat er 83. Op 18 \
november was de post 39.340 keer bekeken [1]. In het beeld uit de video heet de vrouw Olena K., van het National \
Anti-Corruption Bureau of Ukraine, en de Franse ondertitel noemt een onderzoekster van dat bureau [1]. Alleen de tekst \
van de post maakt van haar een voormalig hoofd [1].

Het verhaal is ouder dan de post. Op 26 augustus 2025 ging op X een Engelse video rond over Olena K., een voormalige rechercheur van \
NABU, het Nationaal Antikorruptiebureau van Oekraïne [2]. Zij zou met duizenden pagina's naar Europa zijn gevlucht, met \
bewijs dat Zelensky via brievenbusfirma's meer dan 100 panden kocht, samen 1,2 miljard dollar waard [5]. Als bron \
noemde de video een artikel van The London Telegraph [2]. Dat artikel noemde dezelfde getallen als de post, op Spanje \
na: 26 in plaats van 6, samen 103 [2]. In april 2026 kwam een kortere versie terug, met 83 panden, \
eerst in het Pools en het Duits [6] [13].

The London Telegraph is geen krant. De naam londontelegraph.uk werd op 14 augustus 2025 geregistreerd, twaalf dagen \
voor het artikel [3]. Bij de naam van de schrijver stond de foto van Helen Brown, een Britse journalist die onder meer \
voor The Daily Telegraph schrijft en niets met het artikel te maken had [4]. Volgens Euronews stond er op de site bijna \
niets behalve dit ene stuk, en klonk de Engelse stem in de video van 2025 door een computer gemaakt [5]. De registratie is op 14 augustus \
2026 verlopen [3].

De vrouw in de video werkte niet bij NABU. Dat zei NABU tegen Correctiv, en een woordvoerder zei het ook tegen AFP [6] \
[13]. Volgens NABU heeft geen huidige of vroegere medewerker stukken gepubliceerd over panden van Zelensky in het \
buitenland [6]. De documenten die wazig in beeld komen, zijn volgens Myth Detector stukken die het Oekraïense Openbaar \
Ministerie en de veiligheidsdienst SBU op 22 juli 2025 lieten zien [8]. Die kwamen uit een huiszoeking bij familie van \
parlementslid Fedir Khrystenko, in een zaak over gelekte gegevens van NABU, en gaan niet over Zelensky [7].

Wat Zelensky bezit, staat in de vermogensverklaring die hij elk jaar openbaar maakt. Die over 2025 kwam op 30 maart \
2026 [10]. Er staan appartementen in Kyiv in, waarvan twee in gedeeld bezit [9] [10]. Buiten Oekraïne noemen Slovo i \
Dilo en Fakty ICTV één woning: een appartement in Groot-Brittannië, op naam van Olena Zelenska [9] [10]. Volgens Slovo i \
Dilo heeft het echtpaar dat sinds 2014 in leasehold, een Brits recht van gebruik [9]. Aan de panden veranderde in 2025 \
niets wezenlijks [9] [10]. Wel kocht het Italiaanse bedrijf San Tommaso, dat in de verklaring van Zelensky \
stond, in 2017 een villa in Forte dei Marmi; dat meldde RFE/RL in 2019 op gezag van Slidstvo.info [14]. Volgens Slovo i \
Dilo is Olena Zelenska nog altijd uiteindelijk begunstigde van dat bedrijf [9]. Of het de villa nog heeft, weten we \
niet. Ook met die villa erbij is het hoogstens één pand in Italië, geen acht.

Het verhaal van 2025 noemde ook Timur Mindich, mede-eigenaar van het productiebedrijf Kvartal 95 en een oude bekende van \
Zelensky [2] [12]. Tegen Mindich loopt sinds november 2025 een echt onderzoek van NABU, naar smeergeld bij het \
staatsbedrijf Energoatom [12]. NABU-directeur Semen Kryvonos zei op 12 mei 2026 dat Zelensky in dat onderzoek niet \
voorkomt en nooit voorkwam [11]. Dat Mindich verdachte is, maakt het verhaal over 83 panden dus niet waar.

Lead Stories, Euronews, Myth Detector, Demagog en Correctiv noemden het verhaal eerder onwaar [2] [5] [6] [8] [13]. Een \
check in het Nederlands vonden we niet."""

niet_weten = """
We weten niet wie de video's maakte. Volgens NewsGuard, aangehaald door Demagog, lijkt de site op het werk van \
Storm-1516, een Russische beïnvloedingsoperatie; dat konden we niet zelf nagaan [13]. Volgens Slovo i Dilo is Olena Zelenska ook uiteindelijk \
begunstigde van bedrijven op Cyprus, in Italië en in Belize [9]. Het bedrijf in Italië kocht in 2017 een villa; of \
het die nog heeft, staat niet in die berichten [14]. En we vonden één Nederlandse post; hoeveel er \
waren, weten we niet."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-19"

