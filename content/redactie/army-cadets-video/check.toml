# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B85), in het Engels, uit de weekradar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/army-cadets-video/dossier.md, ingekort tot ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-22, PO: "innkorten is goed, , ik heb ze nagelezen, akkoord").

sleutel = "army-cadets-video"
status = "gepubliceerd"
taal = "en"
adres = "army-cadets-whitehall-remembrance-video"
kop = "Video of marchers on Whitehall shows teenage army cadets on Remembrance Sunday, not British soldiers"
oordeel = "misleidend"
oordeel_zin = "The first clip shows Army Cadet Force volunteers in the Remembrance Sunday march past on Whitehall, young people who are not part of the armed forces, not British soldiers [3] [4] [5]."
soort = "context"
vorm = "video"
reikwijdte = "internationaal"

bewering = "Compare the British and Russian methods of marching. The first 3 clips are from England. Disgrace!"
platform = "X"
eerst_gezien = "2026-11-14"
posts = 4
bereik = "2,612 likes and 308 replies on November 22; the first post with the Whitehall clip, of November 14, had 9,494 likes and 1,355 replies"

kort = """
Since November 14, posts on X have shown a column in camouflage uniform marching out of step in London [2]. On \
November 15 an account set the clip next to Russian soldiers on Red Square as an example of British marching [1]. \
The marchers are cadets, typically 12 to 18 years old and not part of the armed forces, in the march past on Whitehall \
on Remembrance Sunday, November 8, 2026 [3] [5]. We know this from the monument they pass and a photo of the same \
group by Suffolk Army Cadet Force [4] [8]."""

tekst = """
On Sunday, November 15, 2026, the account Alternative News posted a video on X with the text "Compare the British and \
Russian methods of marching. The first 3 clips are from England." [1]. The rest of the video shows Russian troops on \
Red Square in Moscow [1]. The first clip went round a day earlier, when the account RadioGenoa posted it as "British \
Army cadets in London don't seem very in sync." [2]. In the comparison with Russia, the word cadets is gone [1].

The clip was filmed on Whitehall. The column passes the Monument to the Women of World War II, which stands in the \
middle of Whitehall [2] [8]. A cadet at the front carries a poppy wreath [2]. On Sunday, November 8, the National \
Service of Remembrance was held at the Cenotaph on Whitehall [6]. Serving personnel are not eligible to march in the \
Cenotaph march past [7].

One of the groups that marched was a contingent of Suffolk Army Cadet Force and the Combined Cadet Force of Westbourne \
Academy [3]. A photo in the gallery of Suffolk ACF shows the contingent on Whitehall in the same order as in the video: \
an adult with medals at the front left, and at the front right a cadet carrying a wreath of the Army Cadet Force [4]. \
We think the video shows this group. The Spanish fact-checker Maldita compared the video with the same gallery on \
November 16 and reached the same conclusion [13].

According to the Ministry of Defence, which sponsors both cadet forces, cadets are typically 12 to 18 years old and \
are not part of the armed forces [5]."""

niet_weten = """
We do not know who filmed the video on Whitehall or where it was first posted. We matched the group by the order of \
the column and the wreath, not by faces. We could not identify the second and third British clips in the \
compilation [1]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-22"

nog_doen = []

nog_uitzoeken = [
  "Who filmed the video on Whitehall on November 8, and where it was first posted.",
  "Who the young people in black dress uniform with red sashes are, in the second clip of the compilation, and where and when the third clip was filmed.",
  "Whether the second video of RadioGenoa was filmed at the Royal Courts of Justice during the Lord Mayor's Show of November 14, 2026, and which cadets march in it.",
  "We weighed Misleading against Missing context. RadioGenoa still called the marchers cadets, but the post with the Russian soldiers presents the clips as British marching without saying who marches. If you know more about any of the clips, please tell us.",
]

