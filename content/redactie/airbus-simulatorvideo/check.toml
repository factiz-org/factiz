# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B89), in het Engels, uit de Engelse radar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/airbus-simulatorvideo/dossier.md, ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-23, PO: "Akkoord", na het nalezen van de acht in het voorbeeld).

sleutel = "airbus-simulatorvideo"
status = "gepubliceerd"
taal = "en"
adres = "airbus-beluga-saba-flight-simulator-video"
kop = "Video of an Airbus Beluga turning on Saba's tiny runway was made in Microsoft Flight Simulator"
oordeel = "onwaar"
oordeel_zin = "The video was on YouTube in August 2025, listed under the game Microsoft Flight Simulator 2024, and the runway it shows, on Saba, is 401 metres long and 18 metres wide; a BelugaXL is 63.1 metres long [5] [7] [8]."
soort = "bewerkt"
vorm = "video"
reikwijdte = "internationaal"

bewering = "This is so unbelievable... how can a very big aircraft like this turn around in this tiny road... max respect to the pilot"
platform = "X"
eerst_gezien = "2026-11-11"
posts = 57
bereik = "the 55 posts that link to the video had 4,229 likes and 2,151 replies together on November 23; the post of November 16 had 70 likes and 27,300 views"

kort = """
Since November 11, posts on X have shared a video of an Airbus BelugaXL that turns around on a tiny runway above a \
cliff and takes off, as if it were a real flight [1] [3]. The video comes from a flight simulator. It was on YouTube \
in August 2025, listed under the game Microsoft Flight Simulator 2024 [5]. The runway is that of Saba, 401 metres long \
and 18 metres wide, and a BelugaXL is 63.1 metres long [7] [8]."""

tekst = """
On November 16, 2026, the account Amelia Collins wrote on X that it was unbelievable how "a very big aircraft like \
this" could turn around "in this tiny road", with "max respect to the pilot" [1]. Her post links to a video of 2 \
minutes 41 seconds that another account posted on X on March 9, 2026, as "One of the shortest runways an airplane has \
to land on" [2]. That account has since deleted the post [2]. From November 11 to 19, we counted 55 posts by 47 \
accounts on X that link to the video [1] [3]. On November 22, an account uploaded a shortened copy [4].

The video shows a large white cargo aircraft with BELUGA XL and AIRBUS on its side [2]. Next to rows of solar \
panels, it turns around on a runway marked 30, takes off over the sea and lands elsewhere [2].

The same video, with the same shots at the same moments, was posted on August 6, 2025 by the YouTube channel Smilo \
Fly, as "Airbus Beluga XL Impossible takeoff from SABA Airport" [5]. YouTube lists the game Microsoft Flight Simulator \
2024 under it [5].

Saba is a Dutch island in the Caribbean, and its solar park lies right next to the airport [6] [7]. According to the \
official aeronautical information for Saba, the runway is 401 metres long and 18 metres wide, and only aeroplanes \
authorised by the Dutch government may use the airport [7]. Airbus says the BelugaXL is 63.1 metres long and that its \
six BelugaXLs carry aircraft parts between 11 destinations in Europe [8].

The one BelugaXL incident we found in the database of the Aviation Safety Network happened in France [9]. On \
November 18, 2022, a BelugaXL partly left the paved surface at Albert while making a 180-degree turn after landing [9]."""

niet_weten = """
We do not know who recorded the flight in the simulator: the upload by Smilo Fly of August 6, 2025 is the earliest \
we found, but the channel may have copied it [5]. We do not know why the account on X deleted its post of March 9 \
[2]."""

