kort = """
Op 5 september ging op X een post rond die zegt dat Zelensky dreigt burgervliegtuigen neer te schieten, met de hashtag \
MH17 erbij [1]. Zelensky waarschuwde op 1 september luchtvaartmaatschappijen dat Oekraïense drones het Russische \
luchtruim onveilig maken, en zei in dezelfde toespraak dat Oekraïne geen enkel burgervliegtuig bedreigt [2] [3]. Voor \
MH17 wees de raad van de ICAO in 2025 Rusland aan als verantwoordelijke [10] [11]."""

tekst = """
De post verscheen op zaterdag 5 september om 12:51 op X [1]. Ze haalt een Engelse post van een dag eerder aan, met een \
video van 51 seconden en de bewering dat Zelensky burgervliegtuigen bedreigt [1]. De Nederlandse post maakt daarvan dat \
hij dreigt ze uit de lucht te schieten, en verwijst met de hashtag MH17 naar de ramp van 2014 [1]. Op 18 november was de \
post 14.721 keer bekeken [1].

Het gaat om de avondtoespraak van Zelensky van dinsdag 1 september, met de video op Telegram en een deel van de tekst \
om 19:59 in het Engels op X [13] [2]. Daarin waarschuwde \
hij elke luchtvaartmaatschappij die het Russische luchtruim gebruikt, elke verzekeraar en iedereen die de grote Russische \
vliegvelden nog gebruikt: het luchtruim wordt volledig onveilig [2] [3]. De reden die hij gaf, zijn Oekraïense \
drones, die op zo'n schaal boven Rusland zullen vliegen dat de luchtvaart er rekening mee moet houden [3] [4]. Drie \
dagen eerder had hij opdracht gegeven tot 1.000 drones per dag tegen Rusland [4].

In dezelfde toespraak zei Zelensky dat Oekraïne de burgerluchtvaart niet bedreigt, "not a single civilian aircraft" [2]. \
In zijn eigen tekst, in het Engels en het Oekraïens, volgt die zin direct op de waarschuwing [2] [13]. \
Euronews en Meduza geven die woorden ook weer [3] [4]. Oekraïne wil volgens hem niet dat er onschuldige levens verloren \
gaan [2].

Een dag later liet Oekraïne de ICAO, de luchtvaartorganisatie van de Verenigde Naties, formeel weten dat het Russische \
luchtruim onveilig is [6]. De Turkse maatschappijen Pegasus en Turkish Airlines schrapten vluchten van en naar Moskou \
[6]. Dezelfde dag waarschuwde de ICAO in het algemeen dat het risico groeit dat burgervliegtuigen door wapens worden \
geraakt of in een kruisvuur komen; Rusland of Oekraïne noemt ze niet [7].

Een dreiging zag ook Poetin erin: hij noemde de waarschuwing op 1 september staatsterrorisme [5]. De plannen van Oekraïne \
waarover is bericht, gaan over het sluiten van het luchtruim, niet over het neerschieten van vliegtuigen. Volgens The \
Atlantic, aangehaald door The Insider, bereidde Oekraïne een plan voor om het luchtruim boven Moskou met tot 1.000 drones \
in één nacht dicht te leggen, en was Zelensky bang dat een geraakt passagiersvliegtuig als piraterij zou worden gezien \
[8]. Het bureau van Zelensky noemde dat verslag volgens Meduza complete onzin [14]. Volgens The Wall Street Journal, \
aangehaald door The Week, wil Oekraïne drones bij Russische vliegvelden laten \
rondvliegen, zodat starts en landingen stil komen te liggen [9]. Dat maakt vliegen boven Rusland gevaarlijker. Een \
dreigement om vliegtuigen neer te schieten is het niet.

MH17 werd op 17 juli 2014 boven Oost-Oekraïne neergeschoten met een Russische luchtdoelraket, boven gebied in handen van \
pro-Russische separatisten [11]. Er kwamen 298 mensen om, onder wie 196 Nederlanders [11]. De raad van de ICAO oordeelde \
op 12 mei 2025, in een zaak van Nederland en Australië, dat Rusland verantwoordelijk is [10]. Wel wezen Russische en \
Oekraïense functionarissen in oktober 2001 een raket aan als oorzaak van de ramp met een Russisch passagiersvliegtuig \
boven de Zwarte Zee, met 78 doden [12]. De Oekraïense functionaris zei dat het waarschijnlijk per ongeluk een raket van \
een Oekraïense oefening was [12]."""

niet_weten = """
De eerste zin van de post, over \
welke doelen Rusland en Oekraïne raken, is een eigen bewering die we hier niet checken. Een factcheck van een andere \
redactie over deze bewering vonden we niet, in zeven talen en op ruim twintig sites."""

