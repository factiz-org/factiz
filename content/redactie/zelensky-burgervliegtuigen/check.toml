oordeel_zin = "Zelensky waarschuwde dat Oekraïense drones het Russische luchtruim onveilig maken, maar zei er uitdrukkelijk bij dat Oekraïne geen enkel burgervliegtuig bedreigt [2] [3]."
soort = "context"

