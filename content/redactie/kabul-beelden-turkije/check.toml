kort = """
Op 27 augustus ging op X een video rond van Amerikaanse vliegtuigen die een basis in Turkije voorgoed zouden \
verlaten [4]. De beelden zijn van 16 augustus 2021, op het vliegveld van Kabul, waar een Apache-helikopter mensen \
wegdreef van een C-17 [1] [2]. In september meldde de Amerikaanse luchtmacht nog gewoon activiteiten op de basis \
Incirlik in Turkije [3] [6]."""

tekst = """
Op donderdag 27 augustus om 19:04 zette een Nederlandstalig account op X een video van 37 seconden online [4]. De \
tekst zegt dat Amerikaanse vrachtvliegtuigen apparatuur en voorraden van "de luchtmachtbasis in Turkije" terugbrengen \
naar de Verenigde Staten en de basis volledig verlaten [4]. Welke basis, zegt de post niet [4]. Op 18 november was hij \
9.252 keer bekeken [4].

Dezelfde bewering stond acht uur eerder in het Engels op X, om 11:15, met een video van dezelfde lengte [5]. Die post \
werd 685.711 keer bekeken [5]. De Nederlandse tekst lijkt er een vertaling van [4] [5].

De beelden zijn vijf jaar oud. Ze komen van het vliegveld van Kabul op maandag 16 augustus 2021, in de dagen van de \
Amerikaanse evacuatie uit Afghanistan [1] [2]. Grote groepen Afghanen liepen toen de startbaan op, rond een C-17 die \
aan het taxiën was [1]. Een Apache-helikopter van het Amerikaanse leger vloog vlak boven de grond om ze weg te \
drijven [1] [2]. The War Zone zette de video dezelfde dag online, met een post op sociale media als bron [1]. The \
Aviationist beschreef de scène een dag later [2].

De video zegt dus niets over Turkije in 2026 [1] [4]. Een C-17 is een groot transportvliegtuig van de Amerikaanse \
luchtmacht; dat type vloog in 2021 de luchtbrug uit Kabul [2].

De Amerikanen vertrokken ook niet uit Turkije. Op 18 en 19 september hielden militairen van de 39th Air Base Wing op \
de basis Incirlik een herdenking van 24 uur voor krijgsgevangenen en vermisten [3]. Op 25 september heropende dezelfde \
eenheid daar een gebouw met kamers voor militairen, na een renovatie van 949 dagen [6]. Beide berichten komen van de \
Amerikaanse strijdkrachten zelf [3] [6]."""

niet_weten = """
We weten niet wie de beelden als eerste aan Turkije koppelde. De oudste post met die uitleg die we vonden, is de \
Engelse van 27 augustus om 11:15. We weten ook niet wie de video in 2021 filmde. Of er in augustus 2026 iets veranderde \
aan de Amerikaanse troepen in Turkije, hebben we niet verder onderzocht; in de twee berichten uit september die we \
lazen, staat niets over een vertrek."""

