kop = "Marc Van Ranst krijgt de schuld van wat Fauci zou hebben verzwegen, maar Fauci verzweeg geen schade en Van Ranst schreef het advies voor zwangeren niet"
oordeel = "onwaar"
oordeel_zin = "Fauci schreef in een sms over een theoretisch risico, niet over schade, en studies bij tienduizenden zwangeren vonden geen hoger risico; Van Ranst zat niet in de groep die in België het advies voor zwangeren schreef [2] [8] [16]."
soort = "context"
reikwijdte = "internationaal"

bewering = "Marc van Ranst is PANIEKERIG aan het tweeten sinds bekend is dat Fauci WIST dat vaccins SCHADELIJK waren voor zwangere vrouwen maar het toch VERZWEEG! Van Ranst zou BESTRAFT moeten worden voor zijn aandeel in het corona-bedrog!"
platform = "X"
eerst_gezien = "2026-08-10"
posts = 2
bereik = "43.828 en 29.569 keer bekeken op 18 november"

kort = """
Een post op X wil de Belgische viroloog Marc Van Ranst laten straffen, omdat Anthony Fauci zou hebben verzwegen dat \
vaccins schadelijk zijn voor zwangere vrouwen [15]. Fauci schreef in januari 2021 in een sms over een theoretische \
mogelijkheid, niet over schade, en onderzoek bij tienduizenden zwangeren vond geen hoger risico op een miskraam [2] [6] \
[8]. Van Ranst komt in de sms'jes niet voor, en het Belgische advies voor zwangeren kwam van een groep van de Hoge \
Gezondheidsraad waarin hij niet zat [16] [17]."""

tekst = """
Op woensdag 12 augustus 2026 om 19:23 verscheen op X een post met een grote foto van Marc Van Ranst, viroloog aan de KU \
Leuven en het Rega Instituut [15] [18]. Van Ranst zou paniekerig aan het tweeten zijn sinds bekend is dat Fauci wist dat \
vaccins schadelijk waren voor zwangere vrouwen, en dat verzweeg [15]. Daarom zou hij gestraft moeten worden voor zijn \
aandeel in wat de post corona-bedrog noemt [15]. Twee dagen eerder ging al een Nederlandstalige post rond die Fauci \
hetzelfde verweet [15].

Van Ranst en het advies voor zwangeren

Van Ranst adviseerde de Belgische regering in 2020 en 2021 in groepen over de maatregelen tegen corona, zoals de GEES en \
de GEMS [20] [21]. Over vaccinatie adviseerde in België de Hoge Gezondheidsraad, met een eigen groep voor vaccins [16]. \
Die raad raadde in januari 2021 af om alle zwangeren te vaccineren, en gaf hun in april 2021 voorrang [17] [16] [19]. Van \
Ranst staat niet in de werkgroep die dat advies schreef, en niet in de lijst van experts die het goedkeurden [16].

In de sms'jes van Fauci komt Van Ranst niet voor [2] [3]. Wel nam hij het in december 2022 op X voor Fauci op, toen Elon \
Musk schreef dat Fauci vervolgd moest worden [22]. Een post waarin Van Ranst in augustus 2026 over de sms'jes schreef, \
vonden we niet.

Wat Fauci schreef

Op 10 augustus 2026 maakten de Amerikaanse senatoren Ron Johnson en Rand Paul screenshots openbaar van sms'jes van de \
telefoon die Fauci als directeur van het Amerikaanse instituut voor infectieziekten gebruikte [1] [3]. Het ministerie van \
Volksgezondheid had die telefoon op 5 augustus aan de Senaat gegeven [1].

De sms'jes zijn van 25 en 26 januari 2021, tussen Fauci, de toenmalige directeur van de CDC Rochelle Walensky en Vivek \
Murthy, kort daarna weer surgeon general, de hoogste arts van de Amerikaanse overheid [2] [3]. Murthy vroeg \
of zwangeren beter vroeg of laat in de zwangerschap konden worden gevaccineerd, en Fauci antwoordde dat daar geen gegevens of theoretische reden voor waren [2]. \
Een collega schreef hem die middag dat de eerste studies vaccineren in het eerste trimester vermeden, vanwege mogelijke \
koorts en het hogere aantal miskramen in die periode [2]. \
Daarna schreef Fauci dat koorts na de tweede prik "theoretically could be associated with miscarriage in the 1st \
trimester" [2] [4].

Een dag later schreef hij dat de risico's moesten worden afgewogen tegen die van covid in de zwangerschap, en dat bij meer \
dan 10.000 gevaccineerde zwangeren geen problemen waren gezien [3]. In februari 2021 zei hij in het openbaar dat er geen \
alarmsignalen bij zwangeren waren [4]. De theoretische zorg over koorts noemde hij daar niet, maar gegevens over schade \
had hij ook privé niet [3] [13].

Wat onderzoek vond

Bij 2.456 zwangeren die vóór 20 weken een mRNA-vaccin kregen, was de kans op een miskraam 13 tot 14 procent, binnen wat \
ook zonder vaccin gebruikelijk is [6]. In de Verenigde Staten en in Noorwegen waren vrouwen met een miskraam niet vaker \
kort ervoor gevaccineerd dan vrouwen met een lopende zwangerschap [7] [8]. Een overzicht van 21 studies met bijna 150.000 \
vrouwen vond geen hoger risico [9]. De volledige gegevens van het register van de CDC, met 12.097 zwangerschappen, kwamen \
in februari 2026 uit op 10,8 procent [10].

Met de sms'jes ging ook een oud getal opnieuw rond: 82 procent miskramen na vaccinatie [12]. Dat komt uit een voorlopige \
studie van april 2021, en is fout uitgerekend: het deelt de miskramen door een groep vrouwen van wie de meesten nog \
zwanger waren [5] [12]. De eerste Nederlandstalige post verwijst ook naar meldingen in VAERS, het Amerikaanse meldsysteem \
voor bijwerkingen [15]. Dat systeem is volgens de beheerders niet gemaakt om te bepalen of een vaccin een klacht \
veroorzaakte [11]. Knack noemde op 12 augustus een bewering over dezelfde sms'jes onwaar [23].

Van Ranst als doelwit

In mei 2021 werd Van Ranst bij naam bedreigd door een gewapende militair, Jürgen Conings, en zat hij met zijn gezin in \
een safehouse tot Conings in juni dood werd gevonden [24] [25]. Volgens VRT NWS krijgt hij vijf jaar later nog altijd \
haatmail [25]."""

niet_weten = """
We vonden geen post of uitspraak van Van Ranst over de sms'jes, op X, op Bluesky of in Belgische media. Waar de post \
corona-bedrog op doelt, zegt ze niet. We weten niet welke studies de collega van Fauci bedoelde; ook de senatoren zeggen \
dat niet te weten [2]. Van de meer dan 34.000 berichten op de telefoon is een klein deel vrijgegeven [1]."""

