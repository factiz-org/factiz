kort = """
Op 27 oktober deelde een Nederlandstalig account op X beelden van rellen in Den Haag alsof ze net gebeurd waren [5]. \
De beelden zijn van zaterdag 17 februari 2024, toen een groep tegenstanders een Eritrese bijeenkomst in zalencentrum \
Opera aan de Fruitweg probeerde binnen te dringen [1] [3]. Dezelfde video stond die avond in 2024 al op X, met bijna \
dezelfde tekst als de Engelse posts van eind oktober 2026 [4] [6]."""

tekst = """
Op dinsdag 27 oktober om 02:26 deelde een Nederlandstalig account op X beelden van rellen in Den Haag [5]. Een paar \
uur later schreef iemand er context bij [5]. Het account is inmiddels geschorst, dus wat de post precies zei, konden we \
niet meer lezen [5].

Een paar uur eerder, op maandag 26 oktober om 22:01, verscheen in het Engels een video van 24 seconden over grote \
onrust in Den Haag [6]. Volgens de tekst drongen Eritrese migranten het Opera-gebouw binnen en staken ze politieauto's \
in brand [6]. Andere accounts namen de video dezelfde nacht over, een ervan als teken van protesten in meer landen \
[6].

Die tekst en die beelden zijn niet nieuw. Op zaterdag 17 februari 2024 om 19:42 zette het account Visegrád 24 bijna \
dezelfde tekst op X, met een video van dezelfde lengte en hetzelfde formaat [4]. Die post is ruim 10 miljoen keer \
bekeken [4].

Wat er die avond gebeurde, staat goed beschreven. In zalencentrum Opera aan de Fruitweg vierden 500 tot 600 \
Eritreeërs nieuwjaar [1]. Volgens de gemeente hadden aanhangers van de Eritrese regering het feest georganiseerd [1]. \
Een groep tegenstanders probeerde het gebouw binnen te dringen en gooide met stenen en straattegels [1] [3]. \
Politieauto's, auto's van bewoners en een touringcar gingen in brand [1] [3].

De ME werd ingezet en burgemeester Jan van Zanen gaf toestemming voor traangas en vaardigde een noodbevel uit [1]. De \
politie hield die nacht 13 mannen aan, later liep dat op tot 16 [2] [7]. Volgens de burgemeester raakten 26 agenten \
gewond [7]. Het Openbaar Ministerie vervolgde tien verdachten, en de eisen tot schadevergoeding kwamen samen uit op \
ruim 775.000 euro [3].

De video die nu rondgaat, is dus echt, maar ruim twee jaar en acht maanden oud [1] [4]."""

niet_weten = """
We weten niet wat de Nederlandse post precies beweerde, want het account is geschorst en we vonden geen kopie. Of de \
video daarin dezelfde is als die van 26 oktober, weten we dus ook niet zeker. We weten niet wie de beelden in februari \
2024 filmde; Visegrád 24 noemde geen maker. Waarom de beelden juist eind oktober terugkwamen, hebben we niet \
uitgezocht."""

