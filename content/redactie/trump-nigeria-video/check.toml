kort = """
Donald Trump did say "The killing of Christians is not going to happen", but in a video about Nigeria that he posted \
on November 5, 2025 [2] [4]. A year later, posts on X present the clip as breaking news of a global war against \
radical Islam [1] [11]. In the full video Trump declares no war: he names Nigeria a country of particular concern and \
says the United States stands ready to save Christians around the world [3] [6]."""

tekst = """
On Saturday, November 14, 2026, at 3:00 UTC, the account Pop Static posted a 22-second video of Donald Trump on X [1]. \
The text says Trump "declares a global war against radical Islam, vowing to protect Christians worldwide", and quotes \
him: "The killing of Christians is NOT going to happen." [1]. The post opens with the word BREAKING, as if the news \
were new [1]. On November 19 it had 23,353 likes and 479 replies [1].

The quote comes from a video that Trump posted on Truth Social on Wednesday, November 5, 2025, at 22:04 UTC [2] [3]. \
Nine minutes later the White House posted the same video on X; it lasts 65 seconds [4]. Daily Trust in Nigeria and The \
Star in Kenya reported it the next morning, with the same quote [5] [6]. "The killing of Christians is not going to \
happen" is the last sentence of the video [3] [6]. The clip in the post is 22 seconds long, about a third of the video \
[1] [4].

In the video Trump says Christianity faces an "existential threat" in Nigeria and blames "radical Islamists" for the \
killings [3] [5]. He names Nigeria a "country of particular concern", a status under an American law of 1998 for \
countries that violate religious freedom [3] [8]. He asks Congressman Riley Moore and Chairman Tom Cole to look into \
it and report back [3]. He ends by saying that the United States cannot stand by, that it is "not only Nigeria", and \
that the country stands ready to save Christians around the world [3] [6]. He does not declare a war in the video [3].

The video repeated a post of October 31, 2025, in which Trump had put Nigeria on that list [7] [8]. On November 1 he \
threatened to stop all aid to Nigeria and to go into the country "guns-a-blazing" if the killing of Christians went \
on, and told the Department of War to prepare [8] [9]. Nigeria's president Bola Tinubu said that his government \
deals with security problems that hit citizens of all faiths [9]. On December 25, 2025, the United States struck \
Islamic State targets in Sokoto state, in northwest Nigeria, which Nigeria called part of their security cooperation \
[10].

We found no new statement by Trump in November 2026 that declares a war against radical Islam [14] [15]. At a hearing \
in the House of Representatives on November 12, 2026, two days before the post, the chairman of the Africa \
subcommittee looked back on the designation of October 31, 2025, and mentioned no new statement [14]. In Trump's own \
posts on Truth Social from October 1 to November 19, 2026, we found no declaration of war on radical Islam [15].

The clip went round before. On October 15, 2026, another account on X posted a clip of the same length with the text \
that Trump "declares war on radical Islam across the globe" [11]. The website Document repeated that post on \
October 18 as news, without a date or source for the video [12]. On November 1 yet another account posted the same text \
with the clip; by November 19 that post had 43,941 likes [13]."""

niet_weten = """
We do not know who first cut the 22-second clip from the video, or whether it went round before October 15, 2026. Trump \
also speaks at rallies and in interviews; that he declared no such war there rests on the absence of any report."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-19"

nog_doen = []

nog_uitzoeken = [
  "Whether the 22-second clip is cut from the White House video on X or from Trump's own post on Truth Social, compared frame by frame.",
  "Whether the clip already went round as new before October 2026, for example after the American strikes in Nigeria of December 2025.",
  "Who first linked the clip to a war against radical Islam.",
  "We weighed Misleading against False. The words are Trump's own, but the war and the date in the post are not. If you know of a statement in which Trump declared such a war, please tell us.",
]

