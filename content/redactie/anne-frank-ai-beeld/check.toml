kort = """
Sinds 8 november gaat op X een beeld rond van een standbeeld van Anne Frank dat net beklad zou zijn [9]. Het beeld is \
gemaakt met AI en toont een standbeeld dat niet bestaat [5]. Het echte beeld op het Merwedeplein in Amsterdam werd in \
juli en augustus 2024 beklad, en sindsdien is er geen nieuwe bekladding gemeld [1] [6]."""

tekst = """
Amsterdam heeft twee standbeelden van Anne Frank. Het ene staat bij de Westerkerk, vlak bij het Anne Frank Huis. Het \
andere staat op het Merwedeplein in de Rivierenbuurt, tegenover het huis waar de familie Frank van 1933 tot 1942 woonde. \
Dat tweede beeld, van Jet Schepp, is een bronzen meisje met een schooltas dat omkijkt naar het plein, op een zuil \
van roze steen [4].

Dat beeld op het Merwedeplein is in 2024 twee keer beklad. Op 9 juli stond met rode verf "Gaza" op de sokkel, met rode \
vlekken bij de voeten; het stadsdeel liet het dezelfde dag schoonmaken [3] [8]. In de nacht van 3 op 4 augustus volgde \
"Free Gaza", en werden de handen van het beeld rood geverfd, precies 80 jaar na de arrestatie van de onderduikers uit \
het Achterhuis [1] [2]. Die nacht werden in Amsterdam-Zuid minstens zes beelden beklad [2].

Het beeld dat nu rondgaat, is iets anders. AAP FactCheck, de factcheckredactie van het Australische persbureau, vond \
het op 6 november op Facebook en op X: een gemaskerde persoon die "Free Palestine" spuit op een standbeeld van Anne \
Frank met een keffiyeh om [5]. Dat standbeeld lijkt op geen van de twee in Amsterdam. Op het bordje ernaast staat een \
verkeerd citaat uit het dagboek, met een tikfout [5].

Een nieuwe bekladding vonden we niet. Het Anne Frank Huis meldt niets over het beeld sinds augustus 2024 [7]. Toen de \
burgemeester in september 2025 het cameratoezicht op het Merwedeplein verlengde, noemde de gemeente als reden alleen \
de twee bekladdingen van 2024 [6]. AAP, die zelf naar recente bekladdingen zocht, vond ook alleen die van 2024 [5]."""

niet_weten = """
We weten niet wie het beeld maakte. Dat er in oktober en november 2026 geen bekladding was, leiden we af uit \
berichten die er niet zijn, bij het Anne Frank Huis, de NOS en de gemeente. Berichten van de politie en het archief van Het \
Parool hebben we niet doorzocht."""

