bereik = "953 likes en 186 reacties op 18 november"

kort = """
Op 5 oktober ging op X een screenshot rond van een citaat waarin Jesse Klaver zegt dat hij het privébezit afschaft \
als hij de verkiezingen wint [1]. Klaver heeft dat nooit gezegd: het citaat komt uit een blog dat een anonieme \
schrijver in oktober 2020 op Medium zette [2] [7]. Het blog is weg, maar het citaat kwam in 2022, 2025 en 2026 \
steeds terug [1] [7] [8]."""

tekst = """
Het screenshot verscheen op maandag 5 oktober om 14.37 uur op X, met de tekst "Kijk dit is een echte communist." \
[1]. Op 18 november had de post 953 likes en 186 reacties [1]. Dezelfde middag werd er context bij gezet [1].

Het citaat is ouder dan de post. Op woensdag 14 oktober 2020 deelde een account op X een link naar een blog op \
Medium, een platform waar iedereen kan schrijven [2]. De kop van dat blog was het citaat [2]. Een paar uur later \
schreef het CIDI, het Centrum Informatie en Documentatie Israël, dat Klaver trending was door een antisemitisch \
artikel dat beweerde dat hij het privébezit wilde afschaffen [3]. Volgens het CIDI schreef de auteur er ook bij dat \
Klaver een Joodse moeder zou hebben [3].

Er is geen interview, toespraak of programma waarin Klaver dit zegt. dpa vond in 2022 geen enkel medium dat de \
uitspraak optekende; alle verwijzingen gingen terug naar het blog, dat de schrijver inmiddels had weggehaald [7]. \
Klavers woordvoerder zei tegen dpa dat hij het nooit gezegd heeft [7]. Het verkiezingsprogramma van GroenLinks \
voor 2021 heette Tijd voor nieuw realisme, met Klaver als lijsttrekker [5]. De woorden privébezit en \
privé-eigendom komen er volgens dpa niet in voor [7].

Daarna kwam het citaat steeds terug. In februari 2022 stond het op Facebook [7]. In oktober 2025, in de campagne \
voor de Tweede Kamerverkiezingen van 29 oktober, gingen screenshots opnieuw rond, en noemde de woordvoerder het \
nepnieuws [8]. Na de post van 5 oktober 2026 schreef ook Knack dat er geen bewijs is voor het citaat [9].

Klaver was in 2020 fractievoorzitter van GroenLinks [4]. GroenLinks en de PvdA gingen op 13 juni 2026 op in \
Progressief Nederland, PRO [6]. Klaver is nu fractievoorzitter van PRO in de Tweede Kamer [4]."""

niet_weten = """
We weten niet wie het blog schreef, en ook niet of het als grap bedoeld was."""

