status = "gepubliceerd"
taal = "nl"
adres = "europa-weigert-russisch-gas-nord-stream"
adres_en = "europe-refuses-russian-gas-nord-stream"
kop = "Gazprom stopte in 2022 zelf het gas via Nord Stream 1, het EU-verbod volgde in 2026"
oordeel = "onwaar"
oordeel_zin = "Gazprom verlaagde in 2022 zelf de levering via Nord Stream 1 en liet de leiding na het onderhoud van eind augustus dicht; een Europees verbod op Russisch gas kwam pas in januari 2026 [3] [7] [14] [16]."
soort = "context"
reikwijdte = "internationaal"

bewering = "Deze politieke leugen v Van der Leyen: Rusland krijgt van haar de schuld van afsluiting van het gas, maar dat deed de EU toch echt zelf."
platform = "X"
eerst_gezien = "2026-09-23"
posts = 1
bereik = "100 likes en 25 reacties op 18 november"

kort = """
Een Nederlandse post op X zegt dat Ursula von der Leyen liegt: niet Rusland maar de EU zou het gas hebben afgesloten \
[12]. Het was het Russische staatsbedrijf Gazprom dat in 2022 de levering via Nord Stream 1 verlaagde en de leiding na het \
onderhoud van eind augustus dichtliet, en dat ook de Nederlandse gashandelaar GasTerra niet meer leverde [3] [5]. Een Europees verbod op Russisch gas \
kwam pas in januari 2026 [7]."""

tekst = """
Op dinsdag 22 september 2026 om 23:30 verscheen op X een post die Ursula von der Leyen een politieke leugen verwijt \
[12]. Rusland krijgt volgens de post ten onrechte de schuld van het afsluiten van het gas, want de EU zou dat zelf \
hebben gedaan [12]. De post citeert een andere post met een uitspraak van Von der Leyen [13]. Ook \
die andere post zegt dat Rusland de EU niet van het gas afsloot [13].

Die uitspraak deed de voorzitter van de Europese Commissie op 17 september in Straatsburg, in haar jaarlijkse toespraak \
over de staat van de Unie [1]. Toen Rusland het gas afsloot, sloegen we terug, zei ze; daarna haalde Europa zijn gas \
volgens haar bij meer leveranciers [1].

Wat Gazprom in 2022 deed

Op 31 mei 2022 stopte Gazprom met leveren aan GasTerra [5] [6]. GasTerra weigerde in roebels te betalen, zoals een \
decreet van president Vladimir Poetin eiste [5]. Dat zou volgens het bedrijf de Europese sancties schenden [6]. Tot \
oktober kwam er daardoor 2 miljard kubieke meter gas niet, dat GasTerra elders kocht [5] [6].

Half juni 2022 verlaagde Gazprom de levering via Nord Stream 1, de leiding door de Oostzee naar Duitsland, in twee \
stappen van 167 naar 67 miljoen kubieke meter per dag, ongeveer 40 procent [14] [15]. Volgens Gazprom stuurde Siemens \
turbines te laat terug uit reparatie [14]. Op 27 juli ging de levering naar 33 miljoen kubieke meter per dag, 20 procent \
van wat de leiding aankan [16] [17]. Pas op 3 augustus noemde Gazprom de sancties van Canada, de EU en het Verenigd \
Koninkrijk als reden dat een turbine niet terugkwam [18]. Het Poolse onderzoekscentrum OSW zag er een politiek besluit \
achter: Rusland had het gas ook via andere leidingen kunnen sturen, en deed dat niet [2]. Op 31 augustus ging de leiding \
dicht voor drie dagen onderhoud [3].

Op 2 september 2022 meldde Gazprom dat de leiding helemaal dichtbleef, door een olielek in een turbine bij het \
compressorstation Portovaja [3] [19]. Siemens Energy zei dat zo'n lek geen technische reden is om te stoppen [3]. De \
Europese Commissie sprak van een voorwendsel [3]. Drie dagen later zei Kremlinwoordvoerder Dmitri Peskov dat de \
problemen door de sancties kwamen, en dat het gas weer kon stromen als die verdwenen [4]. Op 26 september 2022 maakten \
explosies onder water de leiding onbruikbaar [9].

Wat de EU besloot

In maart 2022 spraken de Europese regeringsleiders af dat de EU minder afhankelijk moest worden van Russische fossiele \
brandstof [7]. Een verbod op Russisch gas kwam bijna vier jaar later: de lidstaten namen het op 26 januari 2026 aan [7]. \
Het gaat in stappen. Vloeibaar gas (lng) uit Rusland mag vanaf begin 2027 niet meer binnen, gas door leidingen vanaf \
het najaar van 2027 [7]. In het tweede kwartaal van 2026 kwam nog 10,2 procent van het gas dat de EU per leiding \
invoerde uit Rusland, en 17,3 procent van het lng [8].

Wat klopt en wat niet

De EU wil van Russisch gas af, en heeft dat ook vastgelegd [7]. Maar in 2022 gold er geen Europees verbod, en het was \
Gazprom dat de levering verlaagde en stopte [3] [7]. Bij GasTerra stopte Gazprom omdat de afnemer de nieuwe betaalregel \
weigerde; ook dan kwam het besluit om niet meer te leveren van Gazprom [5]. De uitspraak van Von der Leyen past dus bij \
wat er in 2022 gebeurde [1] [3].

De lijn dat Europa zichzelf het gas ontzegt, is niet nieuw. In 2022 kwamen VOA en Correctiv bij de Russische uitleg \
over de turbine uit op onwaar en misleidend [10] [11]. Op 9 september 2026 zei Kremlinwoordvoerder Peskov volgens \
Reuters dat Europa de prijs betaalt voor het mijden van Russisch gas [20]. Eind oktober bracht Poetin dezelfde lijn op \
een forum van gasexporterende landen in Moskou; The Insider zette die naast de cijfers [9]."""

niet_weten = """
We weten niet of de schrijver het \
jaar 2022 bedoelde of het verbod van 2026; de uitspraak van Von der Leyen gaat over 2022 [1]. Wie de explosies van \
september 2022 op zijn geweten heeft, laat deze check buiten beschouwing: ze kwamen na het stoppen van de levering \
[3] [9]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-19"

