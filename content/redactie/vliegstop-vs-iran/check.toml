# Een eigen factcheck van Factiz (PLAN #37.4, #37.9, B82, B84, B85), in het Engels. Geschreven door Claude op het
# dossier in data/redactie/vliegstop-vs-iran/dossier.md, nagelezen en goedgekeurd door de redactie van Factiz
# (2026-11-19, PO: "3 checks in engels zijn nagelezen en goedgekeurd").

sleutel = "vliegstop-vs-iran"
status = "gepubliceerd"
taal = "en"
adres = "us-ground-stop-iranian-claim"
kop = "The \"Iranian claim\" about the US ground stop is a post with two emoji"
oordeel = "misleidend"
oordeel_zin = "An account called Iran Military Media posted an airplane and a cross after the ground stop had begun, but it claimed nothing, and the FAA traced the stop to a flood of data on its own network [1] [3] [11]."
soort = "context"
reikwijdte = "internationaal"

bewering = "Iranian accounts are now tweeting suggesting they are responsible for the ground stop in the US today.   Time for President Trump to finish the Iranian regime."
platform = "X"
eerst_gezien = "2026-11-13"
posts = 1
bereik = "19,468 likes and 1,842 replies on November 19"

kort = """
On November 13, Laura Loomer wrote on X that Iranian accounts suggested they were behind the nationwide ground stop in \
the US, and called on President Trump to finish the Iranian regime [2]. The post she quoted shows only an airplane and a \
cross, posted by an account called Iran Military Media after the ground stop had begun [3] [6]. The FAA traced the stop \
to a flood of data on its own network, and US officials said they saw no sign of a foreign actor [1] [9] [13]."""

tekst = """
On Friday, November 13, US air traffic control began to lose radar and radio links at 3:36 p.m. Eastern time (20:36 \
UTC), according to Transportation Secretary Sean Duffy [5]. Shortly before 4 p.m., the Federal Aviation Administration \
(FAA) stopped all departures from US airports, a so-called ground stop [6]. Planes already in the air could land; Duffy \
said more than 3,500 were airborne at the time [7] [8]. The FAA lifted the stop at about 8:15 p.m. Eastern time, 01:15 UTC \
on November 14 [5].

It was the first nationwide ground stop since January 2023, and the second since the attacks of September 11, 2001 [6].

At 21:20 UTC, about 45 minutes after the problems began, an account called Iran Military Media posted two emoji on X: an \
airplane and a cross [3] [5]. The post has no words, no image and no link [3]. It does not mention the FAA, a cyberattack \
or a drone, and it does not say who did anything [3]. At 23:00 UTC, Laura Loomer quoted it, with the text that Iranian \
accounts were suggesting they were responsible for the ground stop [2]. Her post had 19,468 likes and 1,842 replies on \
November 19 [2].

The account carries no label of a government or official organization on X, and we found no source that ties it to the \
Iranian armed forces [3]. Iran's Revolutionary Guard does claim attacks in public: on the same day it claimed a drone \
attack on a US radar site in Bahrain, and US Central Command said it intercepted the drones [15]. None of the reports on \
the ground stop that we read mention an Iranian claim of responsibility [9] [14] [15].

By the time Loomer posted, officials had already said they saw no sign of an attack [4] [7]. At 4:53 p.m. Eastern time, \
two law enforcement officials told CNN that, according to preliminary information, it was not a cyberattack [7]. Homeland \
Security Secretary Markwayne Mullin told reporters at the White House that there was no indication of a nefarious attack, \
and called it a telecommunications outage [4].

The FAA's first findings, published on November 15, point to its own telecommunications network, which the contractor \
L3Harris runs [1]. The network was flooded with data from two sites: a radar site in Amarillo, Texas, and a radio site in \
El Dorado, Arkansas, where L3Harris had installed a new router [1] [11]. The older equipment received about 1,000 \
connection attempts every four to five seconds and became unstable [11]. Traffic steadied after L3Harris cut off the two \
sites [11]. Duffy said the work in El Dorado replaced old copper lines with fiber [9] [11].

On November 14, Duffy said: "It wasn't a foreign actor." [9] FAA Administrator Bryan Bedford said the White House \
Situation Room and the FBI had been involved, and that all involved had concluded it was not a cyber issue [9]. On November 17, \
Director of National Intelligence Jay Clayton said on Fox Business that he saw no signs of a coordinated cyberattack \
behind the recent string of outages, and put them down to patching and system upgrades [13]. In a Reuters report that day, a White House spokeswoman said there was \
no evidence of a cyberattack behind them [12].

Iran came up for a reason: the United States is at war with Iran, and Iran had warned it would strike back in \
cyberspace [9]. On November 18, Mullin told Congress in writing that the Iranian government and groups backed by Tehran \
have targeted US infrastructure, but he did not link Iran to the ground stop [14].

The exact cause is not settled yet: the FAA and L3Harris are still looking into whether an installation error, a faulty \
device or something else set off the flood of data [11]. On November 15, Duffy said he had no indication of a hack, and \
that the FBI was helping and would share anything it found [10].

We found no fact-check by another newsroom on the claim about Iran; the Austrian fact-checker Mimikama confirmed on \
November 14 that the FAA had stopped departures nationwide, and found no evidence of a cyberattack [16]. PolitiFact checked \
on November 17 who was to blame politically for the outage, not a link with Iran [17]."""

niet_weten = """
We do not know who runs the account Iran Military Media, from which country, or what it meant with the airplane and the \
cross [3]. Loomer wrote of Iranian accounts, plural; we found only the one post she quoted [2] [3]. The final cause of the \
ground stop is not known yet [10] [11]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-19"

nog_doen = []

nog_uitzoeken = [
  "Who runs the account Iran Military Media, and which country X shows for it.",
  "Whether other accounts that present themselves as Iranian claimed the ground stop that day, in Persian or in English.",
  "What the final FAA investigation finds: an installation error, a faulty router, or something else, and the role of the site in Amarillo.",
  "We hesitated between Misleading and False. The emoji post exists, which made us choose Misleading; it claims nothing and there is no sign that Iran was involved, which points to False.",
]

