oordeel_zin = "Anderhalf miljoen is ongeveer het aantal Russische soldaten dat sneuvelde, gewond raakte of vermist is; gesneuveld zijn er hoogstens zo'n 450.000, en van de burgers in Rusland kwamen er volgens de telling van Novaja Gazeta Europa ruim 1.400 om [1] [5]."
