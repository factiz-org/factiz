posts = 1
bereik = "234 likes en 1.197 reacties op 18 november"

kort = """
Een post op X van 22 oktober zei dat bijna anderhalf miljoen Russen omkwamen, in een vergelijking met burgerslachtoffers \
in Gaza [7]. Het getal van 1,4 miljoen is een schatting van Russische soldaten die sneuvelden, gewond raakten of vermist \
zijn; gesneuveld zijn er volgens het Amerikaanse instituut CSIS 400.000 tot 450.000 [1]. Burgerdoden in Rusland telde \
Novaja Gazeta Europa tot mei ten minste 1.406 [5]."""

tekst = """
Op 22 oktober om 9:08 vroeg een account op X waarom er wel tranen vloeien om burgerslachtoffers in Gaza, maar niet als \
Russische burgers omkomen [7]. Daarop volgde dat bijna anderhalf miljoen Russen om het leven kwamen [7]. De post kreeg \
bijna 1.200 reacties [7].

Een getal van die grootte bestaat, maar het gaat over soldaten, en niet alleen over doden. Het Amerikaanse \
onderzoeksinstituut CSIS schatte op 1 juli dat Rusland van februari 2022 tot juni 2026 ongeveer 1,4 miljoen militaire \
slachtoffers had [1]. Daarin tellen soldaten die sneuvelden, gewond raakten of vermist zijn [1]. Gesneuveld zijn er \
volgens CSIS 400.000 tot 450.000 [1].

De Oekraïense generale staf houdt een eigen telling bij. Op 22 oktober stond die op 1.572.790 Russische militairen [4]. \
Op de pagina staat niet of dat doden en gewonden samen zijn [4]. Het is de telling van een partij in de oorlog, geen \
onafhankelijke schatting.

Hoeveel Russische soldaten zeker dood zijn, tellen Mediazona en de Russische dienst van de BBC bij naam. Ze gebruiken \
overlijdensberichten, berichten van familie, lokale media en mededelingen van regionale overheden [3]. Tot en met 23 \
oktober vonden ze er 282.993 [2]. Ze noemen dat zelf een ondergrens: het echte aantal ligt volgens hen waarschijnlijk \
flink hoger [2].

Om burgers gaat het dus niet. Novaja Gazeta Europa, een Russische krant die vanuit het buitenland werkt, telde tot 11 \
mei 2026 ten minste 1.406 burgerdoden in Rusland en op de bezette Krim sinds 2022 [5]. Daarvan vielen er 524 in de \
regio Koersk, in het deel dat Oekraïne van augustus 2024 tot maart 2025 bezet hield [5]. De krant noemt haar eigen \
telling te laag, omdat overheden niet alle slachtoffers melden [5]. Het Russische ministerie van Buitenlandse Zaken \
spreekt van meer dan 8.000 burgerdoden; volgens de krant telt het ministerie waarschijnlijk ook bewoners van gebieden \
die Rusland na 2022 bezette [5].

Ook met dat hoogste getal blijft het verschil groot. Anderhalf miljoen is bijna 190 keer 8.000, en ruim duizend keer de \
telling van Novaja Gazeta Europa.

De verwarring tussen slachtoffers en doden is niet nieuw. In maart 2025 checkte Nieuwscheckers een bericht dat een \
miljoen doden in de oorlog noemde; het waren er volgens hen toen hoogstens 344.000 [6]."""

niet_weten = """
We weten niet hoeveel Russische soldaten echt zijn gesneuveld: de getallen lopen van de 282.993 die bij naam bekend \
zijn tot 450.000 bij CSIS. Ook het aantal Russische burgerdoden is onzeker, en welke gebieden je meetelt maakt veel uit. \
We weten niet waar de post het getal vandaan had."""

