tekst = """
In de nacht van 19 op 20 oktober, om 02:07, verscheen op X een Nederlandstalige post met een video van 79 seconden \
[4]. De tekst spreekt van bendes met keffiyehs in Italiaanse steden en van Italianen in Milaan die zich niet laten \
onderwerpen door de anarchisten van "fripalestin" [4]. Daaronder staan de hashtags #Milano en #17octobre [4]. Op 18 \
november was de post 105.671 keer bekeken [4].

Dezelfde video ging een paar uur eerder in het Engels rond. Het account Visegrád 24 bracht haar op 19 oktober om \
23:07 als Italiaanse burgers die een buitenlandse rover te pakken krijgen [5]. Een Franse post van 20 oktober deed \
hetzelfde, met een video van dezelfde lengte [6].

De scène is niet in Italië gefilmd. Op donderdag 16 juli, rond 21:00, probeerde een man in Málaga een juwelier aan de \
Calle Martínez Maldonado te beroven, schreef El Español een dag later [1]. Hij vluchtte te voet naar een handlanger op \
een motor, kreeg onderweg een beentje en werd door iemand op een step aangereden [1]. Daarna hielden buurtbewoners hem \
vast, terwijl de handlanger wegreed [1]. Een buurtbewoner filmde het [1]. De Policía Nacional hield de man aan en zocht \
nog naar de tweede verdachte [1].

In Milaan was op zaterdag 17 oktober wel onrust. Een mars van ongeveer 5.000 mensen tegen de hoge kosten van \
levensonderhoud liep rond de Piazza del Duomo uit op rellen [2]. Een deel van de betogers, vooral jongeren met bedekte \
gezichten, gooide met stenen en plunderde winkels [2]. De politie hield er ongeveer vijftig mensen aan [2] [3]. \
Volgens Avvenire waren de relschoppers heel jong, in het zwart gekleed en zonder vlag of politiek symbool [3]. Over \
Palestijnse groepen schrijven Il Post en Avvenire niets [2] [3].

De post brengt dus een aanhouding in Spanje van drie maanden eerder als een scène uit de rellen in Milaan [1] [4]. De \
beelden zelf zijn echt [1]."""

