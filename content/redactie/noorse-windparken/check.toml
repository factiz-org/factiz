kort = """
Sinds 11 augustus gaat op X een bericht rond dat Noorwegen twee windparken afbreekt omdat er misvormde rendieren \
worden geboren [9]. Het Hooggerechtshof van Noorwegen verklaarde de vergunningen van Storheia en Roan in 2021 ongeldig \
omdat de Samische rendierhouders hun winterweiden kwijt waren, niet om de gezondheid van de dieren [1]. Na akkoorden in \
december 2023 en maart 2024 draaien de 151 molens door [2] [3]."""

tekst = """
Het bericht op X noemt twee windparken met samen 151 molens, Storheia en Roan, op het schiereiland Fosen in \
Midden-Noorwegen [9]. Die parken bestaan: Storheia heeft 80 molens en Roan 71, en beide gingen in 2019 open [4]. Bij het \
bericht staat een link naar een Duits vakblad uit oktober 2021, dat toen schreef dat de 151 molens weg moesten [5] [9].

De rechtszaak was echt. Op 11 oktober 2021 oordeelde het Hooggerechtshof van Noorwegen unaniem dat de vergunningen voor \
beide parken ongeldig waren [1]. De parken schonden het recht van de Samische rendierhouders van Fosen om hun eigen \
cultuur te beleven, dat in artikel 27 van het VN-verdrag over burgerrechten en politieke rechten staat [1]. De kern was \
dat de rendieren de winterweiden bij de parken in de praktijk kwijt waren, en dat dit het rendierhouden op Fosen \
bedreigde [1].

Over de gezondheid van rendieren staat niets in het vonnis, en over misvormde kalveren ook niet [1]. Het hof zei evenmin \
wat er met de molens moest gebeuren [4].

Afgebroken werden ze niet. In december 2023 sloten de rendierhouders van Sør-Fosen een akkoord over Storheia, met extra \
grond, een vergoeding en een veto op nieuwe windenergie na het einde van de vergunning [2]. Het Noorse \
mensenrechteninstituut schreef dat dit akkoord de schending lijkt te herstellen [2]. Op 6 maart 2024 volgde een akkoord \
voor Roan: 7 miljoen kronen per jaar tot de vergunning in 2043 afloopt, en daarna alleen een nieuwe vergunning als de \
rendierhouders instemmen [3]. De stroom wordt gewoon verder opgewekt [3].

De misvormde rendieren komen uit een ingezonden brief in de Landshuter Zeitung, een Beierse krant, van 9 oktober 2023 \
[6] [7]. De brief schreef de misvormingen toe aan trillingen van de molens, en ging daarna rond op Facebook en X [6]. AFP \
vroeg zes rendieronderzoekers in Noorwegen, Zweden en Oostenrijk ernaar, en geen van hen kende een studie die \
misvormingen of miskramen door windmolens aantoont [6]. Wel blijkt uit onderzoek dat rendieren gebieden rond molens \
mijden, vooral in de tijd van het kalveren [6].

Het verhaal is dus niet nieuw. Begin 2024 meldde EDMO, het Europese netwerk van factcheckers, dat het ook in een \
Nederlandse vertaling rondging [11]."""

niet_weten = """
We weten niet wie de brief van 2023 als eerste naar het Nederlands vertaalde, en of het bericht van augustus daarop \
teruggaat. De brief zelf lazen we niet; wat erin stond, weten we uit de checks van AFP en Mimikama. Dat de molens nu \
nog draaien, leiden we af uit Aneo, Store norske leksikon en Euronews; productiecijfers van na september 2026 zagen we \
niet."""

