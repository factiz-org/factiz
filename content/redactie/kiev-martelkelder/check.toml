kort = """
Sinds de avond van 2 november gaan in het Nederlands een video en een foto rond van een jongen in een grijze deken, \
die uit een Oekraïense martelkelder bij Kyiv bevrijd zou zijn [13]. De beelden zijn echt en komen van een protest bij een \
huis van de Nationale Garde in Petropavlivska Borsjtsjahivka, aan de rand van Kyiv [2] [3]. De jongen van 14 klom \
tijdens dat protest op de muur en viel op het terrein; hij werd er niet vastgehouden [1] [3]."""

tekst = """
Een eenheid van de Nationale Garde gebruikte het huis als tijdelijk onderkomen voor gemobiliseerde mannen die op hun \
opleiding wachtten [2] [4]. Op 2 november ging online rond dat gewapende mannen er zo'n 40 mensen in een kelder \
vasthielden en martelden. De politie noemde dat dezelfde middag onjuist [5]. Toch kwam er een menigte op af, en 's \
avonds werden er eieren, flessen en stenen naar de politie en de Nationale Garde gegooid [3].

Een verslaggever van The Kyiv Independent zag hoe de jongen in een boom en op de muur klom, de soldaten uitschold, \
stenen gooide en daarna van de muur op het terrein viel [3]. Volgens de Oekraïense Staatsdienst voor Kinderen woont hij \
in de buurt, kwam hij na school naar het protest en viel hij toen mensen aan het hek begonnen te schudden [1]. Binnen \
werd hij in een deken gewikkeld. Zijn zus haalde hem die avond op, en hij werd opgenomen in het kinderziekenhuis van \
Kyiv, zonder gevaar voor zijn leven [1]. Dat vertrek is wat de video laat zien: een jongen in een deken die door de \
menigte wordt weggeleid.

Een martelkelder is er niet gevonden. Een veteraan die die avond het huis binnenging, zei tegen het onderzoeksmedium \
Slidstvo.Info dat hij er geen martelplekken zag [2]. Het gerucht kwam van een vrouw in een ambulance-uniform, die zei \
een ambulancedienst te hebben. Die dienst werkt sinds 2023 niet meer [2] [4]. De politie hield haar op 3 november aan en \
spreekt van een geplande provocatie [6].

In het Nederlands stond de video al op 2 november om 22:25 op X, met de bewering dat de jongen met een schep was \
gemarteld [13]. Een dag later deelde de Russische ambassade in Nederland dezelfde beelden in het Engels [12]. VRT NWS \
noemde de bewering op 5 november onwaar, AFP Factcheck Nederland volgde op 12 november [10] [11]."""

niet_weten = """
Of er in het huis geweld is gebruikt, is nog niet duidelijk. De jongen zegt in een eigen video dat hij binnen is \
geslagen; de minister van Binnenlandse Zaken ontkent dat [1] [9]. Militairen die er verbleven, klaagden bij de militaire \
ombudsman over slaag, en het Staatsbureau voor Onderzoek zoekt het uit [7] [8]. Dat verandert niet wat de video toont: \
een jongen die tijdens het protest naar binnen viel, geen gevangene die werd bevrijd. Of Rusland het protest aanstuurde, \
is ook niet vastgesteld; wel versterkten Russische netwerken het verhaal daarna [14]."""

