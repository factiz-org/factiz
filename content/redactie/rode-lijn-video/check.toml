kort = """
Op 8 november ging een video rond van een demonstrant die een agent toespreekt, als beeld van Rode Lijn-activisten. De \
scène is twee dagen eerder gefilmd, bij de bezetting van de bouwplaats van een datacenter voor Microsoft in Sloterdijk \
[1] [2]. De video stond al op X voordat de Rode Lijn-demonstratie op het Museumplein begon [5] [8]."""

tekst = """
Op zondag 8 november om 12:23 verscheen op X een video van 28 seconden met de tekst "Rode lijn activisten waarschuwen \
de politie." [8]. Een half uur later begon op het Museumplein in Amsterdam de vierde Rode Lijn-demonstratie [5].

De scène zelf staat ook bij AT5. Die zette haar op vrijdag 6 november om 15:49 op X, als verhitte discussie tussen een \
agent en een demonstrant [2]. In het liveblog van die middag beschrijft AT5 hoe een demonstrant een agent zegt dat hij \
moet uitkijken, waarop de agent vraagt of hij bedreigd wordt [1]. Dat was buiten de hekken van de bouwplaats aan de \
Plimsollweg, terwijl de ME het terrein ontruimde [1].

Die bezetting was een actie van de groep Geef Tegengas tegen de bouw van een datacenter voor Microsoft [3]. Ook \
pro-Palestijnse demonstranten deden mee, en op het terrein hingen Palestijnse vlaggen [3] [9]. De ME gebruikte \
wapenstokken en pepperspray [9]. De politie hield 218 mensen aan, die een dag later allemaal weer vrij waren [4].

De video in de post stond al op zaterdag 7 november om 18:46 op X, op een ander account. Dat leiden we af uit het \
nummer dat X aan elke video geeft, want daarin zit het moment van uploaden. Dezelfde rekensom geeft voor de video van \
AT5 precies de tijd van hun post [2] [8].

Bij de Rode Lijn zelf trad de politie ook op. Om 15:34 gebruikte ze op de Overtoom wapenstokken bij een aanhouding [6]. \
Dat kan de video in de post niet zijn, want die stond er drie uur eerder [8]. De politie noemde de demonstratie rustig \
en beheerst, met vier aanhoudingen [6]. Volgens de organisatie liepen er zeker 200.000 mensen mee [7]. De route ging \
van het Museumplein door Oud-West en terug, niet door Sloterdijk [5]."""

niet_weten = """
We weten niet wie de video als eerste een andere uitleg gaf. Het account dat haar op 7 november op X zette, vonden we, \
maar niet de post zelf, dus ook niet wat erbij stond. Of de demonstrant later bij de Rode Lijn liep, weten we niet. Daar \
gaat de post ook niet over: ze laat een scène van 6 november zien alsof ze van 8 november is."""

