kort = """
Op 1 en 2 oktober gingen op X Nederlandstalige posts rond die zeiden dat jongeren in Frankrijk een brandweerman met \
benzine overgoten en in brand staken [8]. Op 29 september werd in Bordeaux wel een brandweerman even door een steekvlam \
geraakt, toen een spuitbus ontplofte in een barricadevuur dat hij wilde blussen [1] [3]. Benzine kwam er niet aan te \
pas; met benzine werd op 1 oktober in Marseille een schoolhoofd overgoten [5] [6]."""

tekst = """
Op donderdag 1 oktober om 21:12 verscheen op X een Nederlandstalige post: jongeren zouden tijdens de protesten in \
Frankrijk een brandweerman met benzine hebben overgoten en in brand hebben gestoken [8]. Een tweede post, de middag \
erna, plaatste het in Bordeaux [8]. Een Engelstalig account bracht op 2 oktober een foto \
met hetzelfde verhaal, die volgens CORRECTIV zeven miljoen keer werd bekeken en waarop Elon Musk reageerde [11].

Wat er echt gebeurde, staat in de Franse pers: op dinsdag 29 september rond 12:30 blokkeerden scholieren het lycée \
Montaigne in de rue Sainte-Catherine in Bordeaux, en bij een ingang brandde een barricade op straat [1]. Een brandweerman \
liep op het vuur af om het te blussen, en op dat moment ontplofte er iets in het vuur: een steekvlam omhulde hem even \
[1] [2].

Volgens de prefectuur van de Gironde was dat een spuitbus die in het vuur lag [3]. De brandweerman raakte licht gewond, \
ging naar het ziekenhuis en was dezelfde middag terug op de kazerne [1]. De prefecte zei dat hij enkele dagen niet kan \
werken [1]. Op video's van BFMTV en Le Figaro, uit twee hoeken, steekt niemand hem aan en loopt hij na de steekvlam zelf \
een paar meter terug [4] [11] [12].

Benzine komt in geen van de berichten over Bordeaux voor [1] [3]. Het parket van Bordeaux opende wel een onderzoek naar \
opzettelijke brandstichting met zwaar letsel; of de spuitbus met opzet in het vuur lag, moest dat onderzoek uitwijzen [1].

Er gebeurde die week wel iets met benzine, maar in Marseille en niet bij een brandweerman: op donderdag 1 oktober werd \
daar bij het lycée Victor-Hugo het schoolhoofd met benzine overgoten, volgens het parket raakte hij gewond [5] [6]. \
Volgens een andere lezing spatte de benzine op leraren toen een leerling haar in een vuilnisbak wilde gooien [7]. Bij \
het lycée Saint-Exupéry omsingelden honderden jongeren dezelfde ochtend een brandweerwagen, joegen de brandweerlieden weg \
en staken de wagen in brand [5] [7]. Een brandweerman die in brand werd gestoken, meldt geen van die berichten [5] [6] \
[7].

Factcheckers in andere talen kwamen tot dezelfde uitkomst: An-Nahar op 5 oktober, EFE Verifica op 6 oktober, CORRECTIV \
op 12 oktober en ZDFheute op 14 oktober [9] [10] [11] [12]. Volgens CORRECTIV is de foto echt; de fotograaf bevestigde \
dat aan AFP [11]. In het Nederlands schreef Knack een factcheck, die er uiterlijk op 19 oktober stond [13]."""

niet_weten = """
We weten niet welk beeld in de Nederlandstalige posts staat. CORRECTIV noemt de foto echt, An-Nahar zag een beeld dat \
afwijkt van de video's en mogelijk is nagemaakt [9] [11]. Misschien gingen er twee beelden rond. We weten ook niet of \
iemand de spuitbus met opzet in het vuur legde, en wat het onderzoek van het parket opleverde."""

