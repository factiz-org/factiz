# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B89), in het Engels, uit de Engelse radar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/trump-poetin-xi-verklaring/dossier.md, ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-23, PO: "Akkoord", na het nalezen van de acht in het voorbeeld).

sleutel = "trump-poetin-xi-verklaring"
status = "gepubliceerd"
taal = "en"
adres = "putin-ceasefire-after-shenzhen-summit"
kop = "Putin did not declare a ceasefire after meeting Trump and Xi in Shenzhen"
oordeel = "onwaar"
oordeel_zin = "No ceasefire was declared: the joint declaration from Shenzhen does not mention Ukraine, Putin said that day that Russia would retaliate for the strikes on the Crimean Bridge, and that night Russia fired 84 cruise missiles at Ukraine [2] [4] [6]."
soort = "verzonnen"
reikwijdte = "internationaal"

bewering = "BREAKING: RUSSIAN PRESIDENT VLADIMIR PUTIN HAS JUST DECLARED A CEASEFIRE AND WITHDRAWN ALL HIS TROOPS FROM THE UKRAINIAN BORDER FOLLOWING HIS MEETING YESTERDAY."
platform = "X"
eerst_gezien = "2026-11-19"
posts = 1
bereik = "895 likes, 260 reposts and 99 replies on November 23"

kort = """
On November 19, a post on X claimed that Vladimir Putin had declared a ceasefire and withdrawn all his troops from \
the Ukrainian border after meeting Donald Trump and Xi Jinping [1]. The three leaders did meet in Shenzhen that day, \
but their joint declaration does not mention Ukraine, and Putin said Russia would retaliate for Ukraine's strikes on \
the Crimean Bridge [2] [3] [4]. That night Russia attacked Ukraine with 84 cruise missiles and 404 drones [6]."""

tekst = """
At 10:21 UTC on November 19, 2026, an account on X wrote in capitals that Putin had just declared a ceasefire and \
withdrawn all his troops from the Ukrainian border [1]. The post gives Trump the credit and quotes Putin as saying he \
wants peace and that Zelenskyy keeps pushing him [1]. It names no source [1].

That day, on the sidelines of the APEC summit in Shenzhen, Trump, Putin and Xi held a three-way meeting, and Trump \
and Putin also met on their own [5]. The three adopted a four-point Declaration toward Peace, published by the Kremlin \
and by the Chinese foreign ministry [2] [3]. In it they commit to reform the United Nations, supply more refined \
petroleum products and hold talks on nuclear risks, and say the International Criminal Court must not abuse its \
jurisdiction [2] [3]. It says nothing about Ukraine, a ceasefire or troops [2] [3]. The Associated Press reported no \
breakthroughs [5].

At his press conference that day, Putin said Russia had no desire to continue the conflict, and that Ukraine should \
accept the compromises the Americans proposed before the talks in Anchorage [4]. Asked about the Ukrainian strikes on the Crimean Bridge, he \
said there would now be no talks on a pause in strikes at sea or on energy, and that Russia's response would follow \
[4]. He said Russia would expand its presence in the Zaporizhzhia and Kherson regions and push Ukrainian forces \
further back [4]. The words the post puts in his mouth are not in the Kremlin's transcript [4].

Overnight into November 20, Russia attacked Ukraine with ballistic missiles, 84 cruise missiles and 404 drones, \
according to Ukraine's Air Force [6]. At least nine people died, seven of them in Kyiv, \
where three bridges were damaged [7]. The next night the Air Force counted 3 ballistic missiles and \
148 drones [8]."""

niet_weten = """
We do not know who runs the account or where the quote attributed to Putin first appeared [1]. We found no statement \
from the Kremlin or Beijing, and no news report, that mentions a ceasefire after the meeting in Shenzhen [2] [3] [4] \
[5]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-23"

nog_doen = []

nog_uitzoeken = [
  "The Radar first picked up this summit through another post of November 19 that went round with an image. Its author deleted it before we could read it, so we do not know what exactly it claimed.",
  "A post in Russian claimed the opposite outcome: that Trump and Xi gave Putin three days to capitulate and that Zelenskyy had flown to China. We did not check it separately.",
  "Whether the quote attributed to Putin, in which he says Zelenskyy keeps pushing him, appeared earlier in other posts or on other platforms.",
  "We chose False over Misleading because the post presents a ceasefire and a withdrawal as done, and neither happened. If you know more, please tell us.",
]

