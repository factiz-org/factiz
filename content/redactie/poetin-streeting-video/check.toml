# Een eigen factcheck van Factiz (PLAN #37.4, #37.9, B82, B84, B85), in het Engels. Geschreven door Claude op het
# dossier in data/redactie/poetin-streeting-video/dossier.md, nagelezen en goedgekeurd door de redactie van Factiz
# (2026-11-19, PO: "3 checks in engels zijn nagelezen en goedgekeurd").

sleutel = "poetin-streeting-video"
status = "gepubliceerd"
taal = "en"
adres = "putin-uk-quote-streeting-skirt-video"
kop = "No record that Putin said this about the UK, and the Streeting skirt video is altered"
oordeel = "onwaar"
oordeel_zin = "The quote has gone round without a source since December 2025, and the video of Wes Streeting is real footage from November 8, 2026 in which his trousers were turned into a skirt [2] [15] [16]."
soort = "bewerkt"
reikwijdte = "internationaal"
vorm = "video"

bewering = "Putin says he doesn't fear the UK because \"they can't even stop rubber boats invading their country or foreign men raping their women and children.\" He also said have you seen their Defence Secretary."
platform = "X"
eerst_gezien = "2026-11-10"
posts = 1
bereik = "14,991 likes and 471 replies on November 19"

kort = """
On November 9, an account on X posted a quote in which Vladimir Putin says he does not fear the UK and asks whether \
people have seen its Defence Secretary, with a video of Wes Streeting in a skirt [1]. We found no record of Putin \
saying these words: the same account had posted almost the same quote in December 2025 and again in October 2026, each \
time as something new [2] [3]. The video is real footage of Remembrance Sunday on November 8, 2026, but Streeting wore \
trousers, and his clothes were altered [12] [15] [16]."""

tekst = """
On Monday, November 9, 2026, at 8:57 UK time, an anonymous account on X that presents itself as a news service posted \
a quote said to be from Vladimir Putin [1]. In it, the Russian president says he does not fear the United Kingdom, and \
asks whether people have seen the British Defence Secretary [1]. The post has a video of 10.5 seconds in two halves: on \
the left Putin at a table, on the right a phone video from the Remembrance Sunday ceremony in London [1]. By November \
19 the post had 14,991 likes and 471 replies [1].

The quote is not new: the same account posted almost the same words on December 13, 2025, as something Putin had said \
that week [2]. That post had 140,751 likes on November 19 [2]. On October 10, 2026, the account posted the first half \
again with a different ending, this time about members of parliament [3]. All three posts use the same footage of \
Putin, at a table with an interpreter beside him [1] [2] [3]. The sentence about the Defence Secretary cannot come from \
December 2025: Wes Streeting has held that post since July 20, 2026, and back then he was Health Secretary [6].

We found no news report and no transcript in which Putin says these words [4] [5]. When Putin spoke about Europe in \
early December 2025, at an investment forum in Moscow on December 2, he said Russia was ready if Europe started a war, \
and he did not mention Britain [4]. In the week of the post, the news between Russia and Britain was about the G20: \
Prime Minister Andy Burnham said Putin would not come to the summit in Manchester in 2027, and on November 16 a Russian \
diplomat, not Putin, answered with a warning [5].

The National Service of Remembrance at the Cenotaph in Whitehall took place on Sunday, November 8, 2026, with two \
minutes of silence at 11:00 [7]. Streeting was there as Defence Secretary, and that evening he posted four photos of \
the ceremony and of the parade of veterans [8]. Photos by Getty Images and Reuters show him in dark trousers and flat \
men's shoes [12] [15]. A livestream of the day by the British government also shows him in trousers, AFP found [16].

The altered pictures appeared within hours of the ceremony [9]. At 14:48 that Sunday, the same anonymous account \
posted a photo in which Streeting wears a skirt and high heels and carries a handbag [9]. At 7:06 on Monday it posted a video of 21.5 seconds, \
filmed from behind guardsmen in front of the Foreign Office building, as long as the altered clip that AFP examined \
[10] [16]. The right half of the video in the Putin post shows the same spot from the same angle [1] [10].

The real footage was filmed from the crowd: the independent journalist Louis Errington filmed the same scene and posted \
it on Instagram just before midnight on November 8 [11]. In his video Streeting wears trousers and carries no bag, \
according to AFP, Full Fact and Lead Stories [12] [15] [16]. Full Fact rated the claim false: the images and the video \
were edited [15].

How the clothes were changed is not settled: An-Nahar wrote that the video was altered with AI tools [13]. AFP ran it \
through the detector Mever, which gave an 87 percent probability of AI [16]. Animal Político reported that Google's \
SynthID tool flagged the lower half of his body as digitally altered [14]. All agree that the ceremony footage itself \
is real and that only his clothes were changed [13] [14] [16].

The altered pictures went round in Polish, Arabic and Korean, and a fact-checker in Mexico also looked at them [12] \
[13] [14] [16]. Many of the posts used them to mock Britain or Streeting himself [12] [16]. Lead Stories was the \
first fact-checker we found, on November 10 [12]. None of the fact-checks we read looked at the Putin quote [12] [13] [14] [15] [16]."""

niet_weten = """
We do not know who wrote the quote or who first put it online; the oldest version we found is from December 13, 2025 \
[2]. We do not know which meeting the footage of Putin comes from. We do not know who altered the photo and the video, \
or with which tool: the detectors used by AFP and Animal Político point to AI, but such tools can be wrong [14] [16]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-19"

nog_doen = []

nog_uitzoeken = [
  "Which meeting the footage of Putin comes from, and whether its sound was removed or replaced.",
  "Who made the altered photo and video, and whether they first appeared on this account or somewhere else.",
  "Whether the right half of the video in the post is frame for frame the altered video of 7:06, and whether that video was made from the footage by Louis Errington.",
  "Whether the quote on its own should be False or Unproven: we cannot prove that Putin never said anything like it, only that this text has gone round without a source since December 2025.",
]

