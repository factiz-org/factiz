kort = """
Op 6 september ging op X een beeld rond bij het verhoor van Kajsa Ollongren, met de bewering dat zij toegaf dat \
Pieter Omtzigt haar overtuigde van het nut van de avondklok [1]. In het verhoor sprak Ollongren over het OMT, het \
Outbreak Management Team dat het kabinet in de coronatijd adviseerde, en niet over Omtzigt [2] [4]. Het advies van \
het OMT over het effect van de avondklok gaf voor haar de doorslag [2]."""

tekst = """
Op zondag 6 september om 17.08 uur zette een account op X een beeld bij het verhoor van oud-minister Kajsa \
Ollongren, met de tekst dat zij toegaf dat Omtzigt haar had overtuigd van het nut van de avondklok [1]. De post \
spotte dat ze er eerst tegen was en het achteraf op een ander schoof [1]. Op 18 november had ze 200 likes en 61 \
reacties [1].

Ollongren werd op woensdag 2 september van 10.00 tot 12.50 uur verhoord door de parlementaire enquêtecommissie \
Corona [2] [3]. In de coronatijd was ze minister van Binnenlandse Zaken en vicepremier namens D66 [2] [3]. Het ANP \
berichtte die ochtend over haar verhoor [6].

OMT staat voor Outbreak Management Team: de deskundigen die het kabinet in de coronatijd adviseerden. Het RIVM \
publiceert hun adviezen [4]. In het verslag van het verhoor staat de afkorting OMT 65 keer, en de naam Omtzigt geen \
enkele keer [2].

Over de avondklok vertelde Ollongren dat zij en haar ministerie er lang tegen waren, omdat de maatregel zo diep \
ingrijpt in de bewegingsvrijheid van iedereen [2]. De avondklok lag volgens haar drie of vier keer op tafel en ging \
telkens weer van tafel [2]. De doorslag gaf het OMT. Dat schatte in januari 2021 het effect op de verspreiding van \
het virus op 8 tot 13 procent, en zei dat geen andere maatregel hetzelfde kon bereiken [2]. Daarop stemde ze met \
tegenzin in, en ze zei dat ze toen overtuigd was [2].

Dat past bij wat andere getuigen eerder vertelden. Volgens de NOS noemde het OMT de avondklok al eerder als optie, \
wilde het kabinet er eerst niet aan, en zei een later spoedadvies van het OMT dat de maatregel effect kon hebben \
[5]. De avondklok ging in op 23 januari 2021 en werd vijf keer verlengd [2].

Het verslag dat we lazen, is nog niet gecorrigeerd. Daarom geven we weer wat Ollongren zei, en citeren we haar niet \
letterlijk [2]."""

niet_weten = """
We weten niet of de schrijver van de post OMT verkeerd las of er bewust Omtzigt van maakte. Dat de naam Omtzigt niet \
valt, is onze telling in het verslag."""

