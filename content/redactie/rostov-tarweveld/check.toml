Sinds 4 september gaat op X een video rond van een "klimaatveranderaar" die een boer in een Spaans tarweveld zou \
hebben gevonden [1]. Video's van zulke constructies met lenzen in tarwevelden gingen al in juli 2022 rond in de \
Russische regio Rostov, als bewijs van sabotage [2] [5]. De hulpdiensten daar vonden bij de branden geen lenzen en \
noemden het bericht vals [2]."""

tekst = """
Op vrijdag 4 september 2026 om 11:47 verscheen op X een video van 48 seconden, met een Spaanse vlag en de tekst dat \
een boer in Spanje een "klimaatveranderaar" vond in een van zijn tarwevelden [1]. Spanje had die zomer grote \
bosbranden, onder meer in de regio Madrid en in Ávila in juli [6].

Dezelfde soort beelden ging vier jaar eerder rond in Rusland. Op 12 juli 2022 verschenen op sociale media video's van \
zelfgemaakte constructies met lenzen in tarwevelden in de regio Rostov, in het zuiden van Rusland [2]. Volgens die \
berichten hadden Oekraïense saboteurs ze neergezet, zodat de zon het graan in brand zou steken [2]. Op YouTube staat een \
video met de titel dat boeren in de regio Rostov massaal zulke apparaten in het graan vinden [5].

De hulpdiensten van de regio spraken het tegen. Het regionale ministerie voor noodsituaties zei op 13 juli 2022 dat het \
geen meldingen van zulke apparaten had gekregen, en dat bij de branden geen lenzen waren gevonden [2]. Het noemde het \
bericht vals en liet nagaan wie het bewust verspreidde [2]. Ook Lapsha Media, een Russisch project dat zich \
factchecker noemt, schreef op 14 juli dat bij de branden niets verdachts was gevonden [3].

In juli 2024 kwam het gerucht terug, nu over velden in de Kuban [4]. De politie daar had er geen meldingen van [4]. \
In de regio Stavropol zei de gouverneur toen wel dat er lenzen in velden waren gevonden, en daar liep een strafzaak \
[4]. Over Rostov herhaalde de krant dat het ministerie in 2022 had gezegd dat zo'n constructie nauwelijks een brand kan \
aansteken [4].

Met Spanje hebben de beelden dus niets te maken, en met het klimaat ook niet. Het verhaal ging over sabotage in \
Rusland, en zelfs daar vond niemand bewijs dat de lenzen in Rostov een brand hadden veroorzaakt [2] [4]."""

niet_weten = """
We weten niet wie de video als eerste maakte en waar die precies is opgenomen. Een Spaans bericht over zo'n vondst \
vonden we niet, maar we hebben de Spaanse pers niet volledig doorzocht. Wie de video van Rusland naar Spanje \
verplaatste, en wat de post met een klimaatveranderaar bedoelt, weten we ook niet. De bronnen over 2022 zijn Russisch \
en geven vooral de woorden van het ministerie door."""

