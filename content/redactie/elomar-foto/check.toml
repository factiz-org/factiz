posts = 2

kort = """
De foto van een man met twee afgehakte hoofden die sinds 23 september op X rondgaat als foto van de Syrische president \
Ahmed al-Sharaa, toont iemand anders [8]. Het is de Australische IS-strijder Mohamed Elomar, en de foto stond in juli \
2014 als de zijne in het nieuws [1] [2] [3]. Dezelfde foto werd in 2025 en 2026 al vaker aan al-Sharaa toegeschreven, en \
redacties in minstens vier talen weerlegden dat [10] [11] [13] [15]."""

tekst = """
Op woensdag 23 september 2026 sprak Ahmed al-Sharaa voor de tweede keer de Algemene Vergadering van de Verenigde Naties \
toe [5] [6]. Ruim een uur nadat Euronews erover berichtte, verscheen op X een Nederlandstalige post met een foto die hem \
zou tonen [5] [8]. Op de foto houdt een lachende man met een baard twee afgehakte hoofden omhoog. Op 15 oktober ging de foto \
opnieuw rond, als reactie op een post van minister Sjoerd Sjoerdsma (Buitenlandse Handel en Ontwikkelingshulp) over \
steun aan Syrië: "Jullie gaven € 15 miljoen aan deze man" [9]. Het is de losse foto, geen collage. De post van 23 \
september is weg, dus wat daarbij stond, weten we niet zelf [8].

De foto is twaalf jaar oud. Eind juli 2014 verscheen ze op een Twitteraccount dat zou toebehoren aan Khaled Sharrouf, \
een Australiër die zich bij Islamitische Staat had aangesloten [1] [2] [3]. Volgens de Australische omroep ABC toont ze \
Mohamed Elomar, een man uit Sydney, met de hoofden van Syrische regeringssoldaten die bij gevechten in Raqqa waren \
gedood [1]. Elomar en Sharrouf waren eind 2013 naar Syrië en daarna naar Irak vertrokken [1] [2].

Op 29 juli 2014 maakte de Australische politie bekend dat er arrestatiebevelen tegen beide mannen waren, voor \
terrorisme, na de publicatie van de foto's [1] [2] [3]. In juni 2015 meldden media dat Elomar bij Mosul was gedood. De Australische regering \
had dat toen nog niet bevestigd [4].

Al-Sharaa heeft wel een verleden bij jihadistische groepen. Onder de naam Abu Mohammad al-Jolani leidde hij Jabhat \
al-Nusra, de Syrische tak van Al Qaida [11] [12]. Maar een foto van hem met afgehakte hoofden vond geen van de redacties \
die ernaar zochten [15].

De foto en de bewering zijn niet nieuw. Ze gingen ook rond na de eerste toespraak van al-Sharaa bij de VN, in september \
2025 [7]. Toen schreven redacties in het Portugees, het Engels en het Nederlands al dat het Elomar is, onder wie AFP \
Factcheck Nederland en VRT NWS [10] [11] [12] [15]. In april 2026, na zijn bezoek aan Berlijn, kwam de foto terug in een \
collage, die het Oostenrijkse Mimikama misleidend noemde [13]. Eind april 2026 schreef ook Reuters erover [14]."""

niet_weten = """
We weten niet wie de foto in september 2026 als eerste aan al-Sharaa koppelde, en of de twee posts van hetzelfde account \
komen. Dat Elomar in 2015 is omgekomen, meldden media op gezag van niet genoemde bronnen; een officiële bevestiging \
hebben we niet gezien [4]."""

