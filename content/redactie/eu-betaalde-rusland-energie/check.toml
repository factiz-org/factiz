sleutel = "eu-betaalde-rusland-energie"
status = "gepubliceerd"
taal = "nl"
adres = "eu-302-miljard-russische-energie"
adres_en = "eu-302-billion-russian-energy"
kop = "De EU betaalde Rusland sinds 2022 ruim 200 miljard euro voor energie, geen 302 miljard"
oordeel = "onwaar"
oordeel_zin = "De EU kocht veel Russische energie, maar volgens haar eigen cijfers voor 197 tot 213 miljard euro, afhankelijk van de periode, en ook met 2026 erbij blijft de 302 miljard van Novak zo'n 70 miljard te hoog [1] [3] [5]."
soort = "context"
reikwijdte = "internationaal"

bewering = "De EU betaalde Rusland sinds 2022 voor 302 miljard euro aan energie, veel meer dan de officiële cijfers zeggen."
platform = "Vesti, de Russische staatstelevisie"
eerst_gezien = "2026-10-12"

kort = """
Volgens de Russische vicepremier Aleksandr Novak betaalde de EU Rusland sinds 2022 302 miljard euro voor energie; \
Donald Trump noemde dezelfde dag 250 miljard dollar [1] [4]. De eigen cijfers van de EU komen uit op 197 miljard euro \
vanaf maart 2022, en op 213 miljard van januari 2022 tot eind 2025 [3] [5]. Ook met 2026 erbij blijft het bedrag van \
Novak zo'n 70 miljard euro te hoog; dat van Trump ligt in de buurt [2] [5]."""

tekst = """
Op maandag 12 oktober zei de Russische vicepremier Aleksandr Novak tegen de staatszender Vesti dat de EU sinds 2022 \
voor 302 miljard euro aan Russische energie kocht [1] [2]. Hij zei niet welke brandstoffen hij meetelde, tegen welke \
prijs, of tot welke dag [1]. Dezelfde dag schreef Donald Trump op Truth Social dat de EU Rusland 250 miljard dollar voor \
energie had betaald [4]. Hij noemde geen periode [4]. Volgens Euronews wilde hij laten zien dat Europese landen Rusland \
blijven financieren [1]. Drie dagen eerder had Trump een afspraak met Poetin aangekondigd over Russische diesel voor de \
Verenigde Staten [6].

De Europese Commissie kwam op 13 oktober met haar eigen cijfer. Van maart 2022 tot en met juli 2026 voerde de EU voor \
197 miljard euro aan energie uit Rusland in [1] [3]. Dat getal komt uit COMEXT, de handelsdatabank van Eurostat, het \
statistiekbureau van de EU [1].

Die 197 miljard begint in maart 2022, na de inval. Januari en februari 2022 tellen niet mee, en dat waren dure \
maanden. In een antwoord aan het Europees Parlement noemde eurocommissaris Marta Kos 213 miljard euro voor januari 2022 \
tot en met december 2025 [5]. Daarvan kwam 144 miljard uit 2022 alleen, en 17 miljard uit 2025 [5].

Ook met die twee maanden erbij komt de EU niet aan 302 miljard. Novak zei zelf dat Rusland Europa in de eerste negen \
maanden van 2026 voor 21,3 miljard dollar aan energie leverde [1] [2]. Tegen dezelfde koers als zijn 302 miljard is dat \
ongeveer 20 miljard euro. Tel je dat bij de 213 miljard op, dan kom je op zo'n 233 miljard euro. Dat is nog altijd \
bijna 70 miljard minder dan Novak noemde.

Het bedrag van Trump ligt dichterbij. 250 miljard dollar is volgens de omrekening van Euronews 223 miljard euro [1]. \
Dat zit tussen de 213 miljard tot eind 2025 en het totaal met 2026 erbij. Wie pas vanaf maart 2022 telt, zoals de \
Commissie deed, komt lager uit: 197 miljard euro, 26 miljard minder [1] [3].

Er zit dus iets in. De EU betaalde Rusland sinds 2022 meer dan 200 miljard euro voor olie, gas en kolen. Maar het \
bedrag daalde snel, van 144 miljard in 2022 naar 17 miljard in 2025 [5]. Volgens het onderzoeksbureau CREA voerde de \
EU van eind februari 2025 tot eind februari 2026 voor 14,5 miljard euro aan Russische brandstoffen in, 36% minder dan \
het jaar ervoor [7]. Vanaf 1 januari 2027 wil de EU geen Russisch gas meer kopen, met uitzonderingen voor onder meer \
Hongarije en Slowakije [1].

In het Nederlands ging het op X vooral over de dieseldeal zelf. Een post van 10 oktober noemde die een manier om de \
Russische oorlogsmachine te financieren [8]."""

niet_weten = """
We weten niet hoe Novak rekende: welke brandstoffen en prijzen, en of hij met Europa alleen de EU bedoelde of ook landen \
als Turkije en Servië. We weten ook niet wat de EU in 2026 tot nu toe betaalde; daarvoor gebruikten we het getal van \
Novak zelf, dat over heel Europa gaat. En we vonden geen Nederlandse post die de 302 miljard of de 250 miljard dollar \
herhaalde."""

