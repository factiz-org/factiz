kop = "Beeld van Ursula von der Leyen met Jeffrey Epstein is gemaakt met AI"
oordeel = "onwaar"
reikwijdte = "internationaal"
oordeel_zin = "Het beeld draagt een watermerk van AI, stond in juli al met een label voor AI op Facebook, en de nummers erop komen niet voor in de Epstein-dossiers [1] [2] [11]."
soort = "ai"
vorm = "beeld"

bewering = "Deze foto uit de Epstein-dossiers toont Ursula von der Leyen met Jeffrey Epstein."
platform = "X"
eerst_gezien = "2026-10-07"
posts = 1

kort = """
Sinds 7 oktober gaat op X in het Nederlands een beeld rond van Ursula von der Leyen met Jeffrey Epstein, met een \
dossiernummer en een documentnummer erop [10]. Het beeld is gemaakt met AI: het staat sinds 12 juli op Facebook met een \
label voor AI-inhoud, en redacties vonden er een onzichtbaar watermerk van AI in [11] [1] [2]. De nummers op het beeld \
komen in de vrijgegeven Epstein-dossiers van het Amerikaanse ministerie van Justitie niet voor [1] [3] [6]."""

tekst = """
Op woensdag 7 oktober 2026 om 23:21 verscheen op X een Nederlandstalige post met een beeld van Ursula von der Leyen, de \
voorzitter van de Europese Commissie, naast Jeffrey Epstein [10]. Op het beeld staan een dossiernummer en een \
documentnummer, die moeten suggereren dat het uit de Epstein-dossiers komt [1] [4].

Het beeld is ouder dan de post. Het vroegste exemplaar dat redacties vonden, staat sinds 12 juli 2026 op Facebook, bij \
een privépersoon, met het label dat Meta zet bij inhoud die met AI is gemaakt [11] [1]. Een dag later stond het op de \
Franstalige site van het Pravda-netwerk [1]. Dat is een netwerk van prorussische sites die zich voordoen als \
nieuwsmedium [9]. Daarna ging het beeld rond in onder meer het Italiaans, Spaans, Duits, Engels, Georgisch en \
Russisch [1] [2] [4] [5].

Het Italiaanse Open en het Spaanse Maldita.es vonden in het beeld SynthID [1] [2]. Dat is een onzichtbaar watermerk dat \
Google aanbrengt in beelden die met zijn AI zijn gemaakt of bewerkt [8]. Ook Lead Stories en TheJournal.ie meldden een \
watermerk van AI [3] [4]. Open vond in persarchieven en in de vrijgegeven stukken geen echte foto van de twee samen [1].

Dan de nummers. Het Amerikaanse ministerie van Justitie zet de stukken uit het onderzoek naar Epstein online in de \
Epstein Library [6]. In januari 2026 kwamen daar ongeveer 3 miljoen pagina's bij, na eerdere vrijgaven [7]. Volgens \
Open, Lead Stories en Myth Detector komen de nummers op het beeld in die stukken niet voor, en gebruikt het ministerie \
een heel andere nummering [1] [3] [5].

De Nederlandse post kwam bijna drie maanden na de eerste check die we vonden, van Open op 15 juli, en vijf weken na die \
van Lead Stories [1] [3] [10]. Een check in het Nederlands vonden we niet."""

niet_weten = """
We weten niet wie het beeld maakte. Lead Stories en TheJournal.ie schrijven dat een programma van OpenAI het watermerk SynthID vond \
[3] [4]. SynthID is van Google [8]; waarom een programma van OpenAI het meldt, weten we niet. Dat verandert het oordeel \
niet: Open en Maldita.es vonden het watermerk met de programma's van Google [1] [2]."""

