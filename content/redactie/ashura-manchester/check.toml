# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B85), in het Engels, uit de weekradar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/ashura-manchester/dossier.md, ingekort tot ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-22, PO: "innkorten is goed, , ik heb ze nagelezen, akkoord").

sleutel = "ashura-manchester"
status = "gepubliceerd"
taal = "en"
adres = "manchester-soldiers-of-allah-muharram-procession"
kop = "This video from Manchester shows the annual Shia mourning procession of June 21, 2026"
oordeel = "misleidend"
oordeel_zin = "The video is real, but it shows the Muharram procession on Wilmslow Road of June 21, 2026, shared five months later with a slogan that no source records [3] [4] [7]."
soort = "context"
vorm = "video"
reikwijdte = "internationaal"

bewering = "Hordes of Muslim men chanting “we are the soldiers of Allah on the streets of the UK ….. Why does this never make the news ??"
platform = "X"
eerst_gezien = "2026-11-15"
posts = 2
bereik = "134 likes and 51 replies on November 22; the Spanish post with the same video had 65,500 likes"

kort = """
Posts on X show a crowd of men in black on a street in Manchester and say they chant "we are the soldiers of Allah" \
[1] [2]. The video shows the annual Muharram procession of the Jaffaria Islamic Centre, a Shia mourning procession on \
Wilmslow Road in Rusholme on Sunday, June 21, 2026, five months before the posts [3] [4]. The chants in it are not in \
English, and no source we found records the slogan [1] [4] [7]."""

tekst = """
On November 15, 2026, an account on X posted the video with the text that hordes of Muslim men were chanting "we are \
the soldiers of Allah" on the streets of the UK, and asked why this never makes the news [1]. The video comes from a \
post in Spanish by Javier Negre the evening before, which says the men parade through a Manchester suburb to demand \
sharia law [2].

Shop signs in the video, such as Sanam and the Delhi Sweet Centre, belong to businesses at 141 to 151 and 137 Wilmslow \
Road in Rusholme [5] [6]. The marchers wear black, many men beat their chests, and the crowd carries green and black \
flags and a tall standard [1]. That is how Shia Muslims mourn Imam Hussain, who was killed at Karbala, in the month of \
Muharram; the chest-beating is called matam [4] [7].

The Jaffaria Islamic Centre, which calls itself the oldest Shia imambargah, a hall for religious gatherings, in \
Manchester, announced its procession for Sunday, June 21, 2026, from Platt Fields Park to the centre on Moss Lane East \
[3] [10]. A TikTok video posted on June 22 shows the same crowd in front of the same shops as the opening of the video \
on X, and its caption speaks of the annual Muharram procession of 2026 [1] [4].

The chants in the video are not in English [1]. The centre's poster and the TikTok caption describe a mourning \
procession, and neither mentions this slogan or a demand for sharia law [3] [4]. Nor does a report on the procession on \
the same road in 2018, when the Pakistani daily The News wrote that thousands of Shia Muslims brought Wilmslow Road to a \
standstill [7]."""

niet_weten = """
We do not know who filmed the video, or whether every clip in it is from June 21: it cuts between at least three camera \
positions, and we compared only the opening with a dated post [1] [4]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-22"

nog_doen = []

nog_uitzoeken = [
  "Where and when each clip in the 1:54 video was filmed; it cuts between at least three camera positions.",
  "Who first put the video online with the slogan, and whether an English post came before the Spanish one of November 14.",
  "Whether Manchester City Council or Greater Manchester Police closed Wilmslow Road for the procession on June 21, 2026.",
  "We weighed Misleading against False. The video and the street are real, the chants are not in English, and the slogan and the demand for sharia are not in any source. If you know what is chanted in this video, please tell us.",
]

