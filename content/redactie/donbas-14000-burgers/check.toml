kop = "In de Donbas vielen vóór 2022 3.404 burgerdoden aan beide kanten, geen 14.000 door Oekraïne"
oordeel = "onwaar"
oordeel_zin = "De VN telde van april 2014 tot eind 2021 14.200 tot 14.400 doden in de oorlog in het oosten, van wie ten minste 3.404 burgers aan beide kanten van de frontlinie, en we vonden geen uitspraak waarin Zelensky oproept Rusland te vernietigen [1] [3]."
soort = "context"
reikwijdte = "internationaal"

bewering = "Oekraïne bombardeerde sinds 2014 de Donbas en doodde er duizenden burgers; nu wil Zelensky dat de wereld Rusland vernietigt."
platform = "X"
eerst_gezien = "2026-08-21"
posts = 2
