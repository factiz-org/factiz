kort = """
Op X ging in augustus rond dat Oekraïne in de Donbas sinds 2014 10.000 burgers doodde, en in oktober dat Zelensky de \
wereld opriep Rusland te vernietigen [6] [7]. Volgens de VN kwamen er van april 2014 tot eind 2021 14.200 tot 14.400 \
mensen om, van wie ten minste 3.404 burgers, aan beide kanten van de frontlinie [1]. Een uitspraak waarin Zelensky \
oproept Rusland te vernietigen, vonden we niet; hij vroeg in die dagen om meer druk op Rusland [3]."""

tekst = """
Op 12 oktober om 11:53 schreef een account op X dat Zelensky de wereld oproept tot een krachtige reactie om ook \
Rusland te vernietigen [6]. Daarna gaat de tekst over het vernietigen van al het leven in een gebied [6]. \
Het beeld eronder is een portret van Zelensky, zonder tekst. De post \
kreeg ruim 11.000 likes [6]. In augustus schreef een ander account dat Oekraïne \
de Donbas sinds 2014 bombardeerde, met 10.000 burgerdoden, en dat Zelensky daarmee doorging [7].

Het getal 14.000 gaat sinds 2022 rond als bewijs dat Oekraïne in de Donbas 14.000 burgers doodde [2] [5]. Het komt uit \
de telling van de VN. Het Bureau van de Hoge Commissaris voor de Mensenrechten (OHCHR) schatte in januari 2022 dat er \
van 14 april 2014 tot en met 31 december 2021 14.200 tot 14.400 mensen omkwamen door de oorlog in het oosten van \
Oekraïne [1]. Dat zijn alle doden, aan beide kanten: ongeveer 4.400 Oekraïense militairen, ongeveer 6.500 strijders \
van de gewapende groepen en ten minste 3.404 burgers [1].

Van die 3.404 burgers kwamen er 298 om aan boord van vlucht MH17, op 17 juli 2014 [1]. De meeste andere burgers \
vielen in 2014 en 2015, toen er het hardst gevochten werd: 2.084 en 955 [1]. Van 2016 tot en met 2021 waren het er \
samen 365 [1].

Zelensky werd president in mei 2019. In 2019, 2020 en 2021 telde de VN samen 78 burgerdoden, aan beide kanten van de \
frontlinie en door alle oorzaken [1]. In 2021 kwam ruim de helft van alle burgerslachtoffers door mijnen en explosieven \
die waren achtergebleven [1].

Burgers vielen in die laatste jaren wel vaker aan de kant van de gewapende groepen. Van 2018 tot en met 2021 vielen \
310 van de 381 burgerdoden en gewonden door beschietingen in het gebied van de zelfbenoemde volksrepublieken Donetsk \
en Loehansk [1]. Wie er schoot, staat niet in dit overzicht. Analisten die de cijfers naliepen, wijzen erop dat \
burgers door beide kanten werden gedood [2]. EUvsDisinfo, de databank van de EU over desinformatie, beschreef in maart \
2025 opnieuw het verhaal dat Rusland in 2022 moest ingrijpen omdat Oekraïners in de Donbas Russen afslachtten [8].

Voor de oproep om Rusland te vernietigen vonden we geen bron. In zijn eigen teksten van die dagen vraagt Zelensky \
Europa en de Verenigde Staten om meer druk op Rusland, zodat er een echt bestand komt voor de energie-installaties [3]. \
Begin oktober waren er zware Russische aanvallen: op 7 oktober kwamen volgens de Oekraïense minister van \
Binnenlandse Zaken 28 mensen om [4]."""

niet_weten = """
We weten niet welke uitspraak van Zelensky de post bedoelt, en welke aanval met 33 doden. Het overzicht van de VN zegt \
niet wie de burgers doodde, alleen waar ze vielen en waardoor."""

