kop = "Greta Thunberg laughs about a climate demo in a documentary where she calls such protests ineffective"
oordeel = "context"
oordeel_zin = "The clip is real and comes from a documentary by Hubertus Koch, in which Thunberg says she finds classic demonstrations ineffective; she still campaigns for the climate [1] [7] [11]."
soort = "context"
vorm = "video"
reikwijdte = "internationaal"

bewering = "Greta Thunberg laughs hysterically when told Fridays for Future, climate change group she founded, still protesting: 'They still do that?'"
platform = "X"
eerst_gezien = "2026-11-11"
posts = 8
bereik = "139,805 likes on the eight posts we read on November 23, in English, German and Japanese; the post by the New York Post alone had 82,003"

kort = """
Since November 11, posts on X have shared a clip of Greta Thunberg laughing when told of a Fridays for Future \
demonstration in Berlin, some as a sign that she mocks climate protesters [2] [3] [4]. The clip is real and comes from \
a documentary by Hubertus Koch, on YouTube since October 28 [1] [5]. In the film she calls classic demonstrations \
ineffective, and she still campaigns for the climate [6] [7] [11]."""

tekst = """
On November 11 at 10:20 German time, an anonymous account on X posted the 27-second clip [4]. That evening the \
columnist Jan Fleischhauer shared the same video, asking why Friedrich Merz should fly to the climate summit if \
Thunberg laughs her head off at people who still demonstrate for the climate [3]. The New York Post posted about it \
on November 12 [2].

The clip comes from a 91-minute documentary about the climate movement and the state repression it met, which the \
German filmmaker Hubertus Koch put on YouTube on October 28 [1] [9].

Koch meets Thunberg and two friends of hers in a Palestinian restaurant in Berlin [1] [5]. About six minutes in, he \
says it is symbolic that they meet on the day of a Fridays for Future demonstration [1] [9]. Thunberg asks "Is it?", \
laughs and asks: "Really? They still do that?" [9]. Then she calls for a cut [1] [5]. Right after the scene, Koch's \
narration says she is done with protest that is visible but, in her view, not consistent enough [1].

Koch later said her laugh was about whether conventional demonstrations still achieve anything, not about the people \
[6] [8]. Thunberg wrote on Instagram that on that day she and other activists had blocked an arms manufacturer and then \
learned of a police-permitted climate demonstration [8] [9]. Fridays for Future in Germany has distanced itself from \
her over her statements on the Middle East [7] [12].

In November she was at the COP31 climate summit in Antalya, where she called the talks hypocritical and said \
"everything and everyone we love is at stake" [11]. The film was online more than two weeks before Fridays for Future protested in \
more than 70 German cities on November 13 [1] [10].

Demagog in Poland and Open in Italy also concluded on November 16 that the clip is taken out of context [12] [13]."""

niet_weten = """
We do not know on which day Koch and Thunberg met [1] [5]. Nobody can say for sure what a laugh means; we stay with \
her words in the film and what she and Koch said afterwards [8] [9]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-23"

nog_doen = []

nog_uitzoeken = [
  "On which day Koch and Thunberg met in Berlin, and which arms manufacturer she blocked that day. One candidate is a blockade of the Berlin office of Rheinmetall in July 2026.",
  "We weighed Missing context against Misleading. The laugh and the question are real, so Missing context; posts that say she laughs at the climate movement or has given up on the climate go further than her words in the film carry. If you know more, please tell us.",
]

