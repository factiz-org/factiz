kort = """
Sinds 21 september gaat op X een video rond van een lange rij vrouwen op straat, met alleen de woorden "Dublin 2027" \
[5]. De video is gemaakt op 19 september in Amsterdam-West, bij de uitverkoop van een modemerk, en het merk zette haar \
zelf als eerste online [1] [9]. Dezelfde video ging ook rond als een rij moslimvrouwen die wachten op gratis \
kinderopvang; dat klopt evenmin [7] [8] [9]."""

tekst = """
Op maandag 21 september om 9:36 zette een account met een Ierse vlag achter de naam een video op X van een lange rij \
vrouwen op straat [5]. De enige tekst erbij is "Dublin 2027" [5]. Wat de schrijver daarmee bedoelt, zegt de post niet, maar \
zonder uitleg lijkt het een beeld van Dublin, nu of straks.

Dezelfde video ging die week ook met een andere uitleg rond. In het Nederlands als moslimvrouwen die wachten op gratis \
kinderopvang [8]. In het Spaans als een rij die een Nederlandse vrouw zou hebben gefilmd, van moslimvrouwen die hun \
kinderen inschrijven voor een gratis crèche [7]. En in het Engels op Instagram en Facebook, met de uitleg dat de vrouwen \
hun kinderen kwamen inschrijven voor gratis opvang van de staat [9].

De rij staat er wel, maar voor iets anders: het merk Oemaayah, dat bedekte mode verkoopt, hield op zaterdag 19 september \
een sample sale: een verkoop van proefmodellen en restpartijen tegen lage prijzen [2] [9]. Het merk had die verkoop \
vooraf aangekondigd op Instagram en TikTok, op een evenementenlocatie in Amsterdam-West [2] [7]. Op zondag 20 september \
zette het merk zelf de video van de rij online, met een bedankje aan iedereen die gekomen was [1] [9]. Tegen Full Fact \
en Reuters bevestigde het merk dat de video bezoekers toont die wachten om de verkoop binnen te gaan [9].

Volgens Full Fact en Maldita is de plek De Hallen Studio's, waar de hekken, de huizen en het gebouw overeenkomen met de \
beelden van Google [7] [9]. Die studio's zitten in de oude tramremise in Oud-West en worden verhuurd voor evenementen \
[4]. De post met "Dublin 2027" kwam ongeveer zestien uur na de video van het merk. Dat leiden we af uit de nummers die X \
en Instagram aan een bericht geven, want daarin zit het moment van plaatsen [1] [5]. Met Dublin heeft de video dus niets \
te maken.

Ook de uitleg over kinderopvang klopt niet. Gratis kinderopvang waarvoor je in de rij gaat staan, bestaat in Nederland \
niet [3]. Het kabinet wil de opvang vanaf 2029 bijna gratis maken voor werkende ouders: iedereen krijgt dan 96 procent \
vergoed, los van het inkomen, en de overheid betaalt dat rechtstreeks aan de kinderopvang [3]. Ouders hoeven die \
vergoeding dan niet meer zelf aan te vragen [3].

EFE Verifica was op 22 september de eerste factchecker die we vonden [6]. AFP Factcheck Nederland en Maldita volgden op \
24 september, Full Fact op 29 september [7] [8] [9]."""

niet_weten = """
We weten niet wat de schrijver van de post met "Dublin 2027" precies bedoelt, en ook niet wie de video van het merk als \
eerste een andere uitleg gaf. Een Nederlandstalige post met de uitleg over kinderopvang vonden we zelf niet; die kennen \
we uit de check van AFP Factcheck Nederland [8]. Of de vrouwen in de rij moslim zijn, weten we niet, en voor deze check \
doet het er niet toe: ze stonden in de rij voor kleding."""

