# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B89), in het Engels, uit de Engelse radar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/raket-aan-de-hemel/dossier.md, ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-23, PO: "Akkoord", na het nalezen van de acht in het voorbeeld).

sleutel = "raket-aan-de-hemel"
status = "gepubliceerd"
taal = "en"
adres = "miami-video-2023-not-houthi-strikes-saudi-arabia"
kop = "A TikTok video from Miami in 2023 does not show Houthi strikes in Saudi Arabia"
oordeel = "onwaar"
oordeel_zin = "The video went online on TikTok on July 29, 2023, with the location Miami, Florida, and probably shows a rocket launch, not Houthi strikes in Saudi Arabia [3] [4]."
soort = "context"
vorm = "video"
reikwijdte = "internationaal"

bewering = "BREAKING: Tourist footage from inside Saudi Arabia reportedly captures the aftermath of Houthi strikes.Dramatic scenes as the situation unfolds."
platform = "X"
eerst_gezien = "2026-11-14"
posts = 2
bereik = "617,400 views, 971 likes and 133 replies on November 23; the same video on a Turkish account, posted six hours earlier, had 3.6 million views and 29,433 likes"

kort = """
Since November 14, posts on X have shared a night video of a bright light rising behind clouds, one of them as tourist \
footage of Houthi strikes in Saudi Arabia [1] [2]. The video was posted on TikTok on July 29, 2023, as a UFO, with the \
location Miami, Florida [3]. It probably shows a rocket launch from Florida's Space Coast, where a Falcon Heavy lifted \
off the night before [4]."""

tekst = """
On Saturday, November 14, 2026, a Turkish account on X posted a video of 2 minutes and 41 seconds, saying the footage \
was real and had been broadcast live on TikTok [2]. By November 23 it had been viewed 3.6 million times [2]. Six hours \
after that post, another account shared the same video file as tourist footage from inside Saudi Arabia of the \
aftermath of Houthi strikes [1] [2].

The clip still carries the TikTok logo and the name of a TikTok account [1]. On that account, the video \
went online on July 29, 2023, at 12:58 p.m. Miami time, with the location Miami and the caption "UFO Spotted in Miami \
Florida" [3]. The Internet Archive saved the page on February 7, 2024 [3].

The video shows a light rising behind clouds above a car park with palm trees [1]. It turns into an orange dot and fades \
after about two and a half minutes [1]. That fits a night launch from Florida's Space Coast seen from a distance [1] [4].

At 11:04 p.m. on July 28, 2023, the night before the upload, a Falcon Heavy lifted off from Kennedy Space Center [4]. \
Twenty-three hours earlier, a Falcon 9 had launched 22 Starlink satellites from Cape Canaveral [5]. In 2023 the video \
was a UFO, now it is an attack [1] [3].

This month another launch went round as something else [6] [8]. On November 13, Starship Flight 15 reached orbit from Texas and released 26 Starlink satellites [6]. An image from Mineral de la Reforma in \
Mexico of a bright light with a row of dots went round as a UFO [8]. The civil protection agency of the state of Chiapas \
said the light seen that evening over its coast was Starship, with a map that puts the pass over Mexico between 6:21 \
and 6:28 p.m. central time [7]."""

niet_weten = """
We do not know which launch the video shows, or where exactly it was filmed: the location on TikTok is an address in \
Miami. We do not know whether the image from Mineral de la Reforma was taken during the pass of Starship."""

auteur = "Claude (AI)"
