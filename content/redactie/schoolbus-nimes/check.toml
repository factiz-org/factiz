kop = "Video van brandende schoolbus is gefilmd in Nîmes in januari 2023, niet bij de scholierenprotesten"
oordeel = "onwaar"
oordeel_zin = "De video is echt, maar toont een schoolbus die op 13 januari 2023 in Nîmes in brand vloog door een vuur in de motor, zonder protest erbij [1] [10]."
soort = "context"
reikwijdte = "internationaal"
