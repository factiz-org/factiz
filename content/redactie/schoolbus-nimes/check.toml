bewering = "Een brandende bus bij de scholierenprotesten in Frankrijk."
platform = "X"
eerst_gezien = "2026-10-02"
posts = 1

kort = """
Op 2 oktober ging op X een video rond van een brandende bus, als beeld van de scholierenprotesten in Frankrijk [7]. De \
video is gefilmd op 13 januari 2023 in Nîmes, waar de motor van een schoolbus tijdens het rijden vlam vatte [1] [2]. \
Er was geen protest bij, en de kinderen in de bus kwamen er ongedeerd uit [1] [8]."""

tekst = """
Op vrijdag 2 oktober om 9:18 verscheen op X een Nederlandstalige post met een video van een bus die brandend over \
straat rijdt, gebracht als een scène uit de scholierenprotesten in Frankrijk [7]. Dezelfde beelden gingen die dag ook \
met een Arabische tekst rond [8]. De Amerikaanse commentator Benny Johnson deelde de video met 4,1 miljoen volgers, met \
de tekst dat dit het gevolg is van massa-immigratie [10].

De video is bijna vier jaar oud: op vrijdag 13 januari 2023 vloog rond het middaguur een schoolbus in brand op de route \
de Sauve in Nîmes, in het zuiden van Frankrijk [1]. De motor vatte tijdens het rijden plotseling vlam [1]. De lokale \
nieuwssite Objectif Gard zette die dag een video van de brandende bus online [1]. Daar komen de beelden in de post \
vandaan, volgens de factchecks van An-Nahar en ZDFheute [8] [10].

In de bus zaten tien leerlingen van een collège, een school voor kinderen van 11 tot 15 jaar [2]. Zij en de chauffeur \
waren de bus al uit toen de brandweer kwam, en niemand raakte gewond [1] [8]. De lege bus rolde nog zo'n 20 meter door \
en kwam tot stilstand tegen een muur [8]. De brandweer van het departement Gard meldde het vuur die middag op X [4]. \
Midi Libre bracht de beelden dezelfde avond, TF1 Info de dag erna [2] [3]. Objectif Gard noemt als oorzaak alleen het \
vuur in de motor, ZDFheute een technisch defect [1] [10].

De scholierenprotesten zelf zijn echt: sinds de tweede helft van september blokkeren scholieren in heel Frankrijk hun \
lycées, uit protest tegen volle klassen, een tekort aan leraren en vervallen gebouwen [6]. Daarbij ging ook een bus in \
vlammen op: in Marseille werd op donderdag 1 oktober tijdens de blokkades een bus in brand gestoken en de chauffeur \
aangevallen [5]. Die bus staat niet in de video, want de video is van januari 2023 en uit Nîmes [1].

Het Libanese dagblad An-Nahar was op 3 oktober de eerste factchecker die we vonden [8]. AFP \
Factcheck Nederland kwam op 7 oktober tot dezelfde uitkomst [9]."""

niet_weten = """
We weten niet wie de video als eerste aan de protesten van 2026 koppelde. Waarom de motor vlam vatte, vonden we niet \
vastgesteld. Of de video na 2023 al eerder als protestbeeld rondging, weten we niet."""

