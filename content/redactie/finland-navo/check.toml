# Een eigen factcheck van Factiz (PLAN #37.4, #37.10, B82, B84, B89), in het Engels, uit de Engelse radar van 20 november.
# Geschreven door Claude op het dossier in data/redactie/finland-navo/dossier.md, ~400 woorden,
# nagelezen en goedgekeurd door de redactie van Factiz (2026-11-23, PO: "Akkoord", na het nalezen van de acht in het voorbeeld).

sleutel = "finland-navo"
status = "gepubliceerd"
taal = "en"
adres = "russia-demanded-finland-leave-nato"
kop = "There is no confirmation that Russia demanded in Abu Dhabi that Finland leave NATO"
oordeel = "onbewezen"
oordeel_zin = "The claim comes from a report in Bild with unnamed sources, which the Kremlin denies, and Finland's president and defence minister say they have no knowledge of such a demand [7] [8] [10] [17]."
soort = "context"
reikwijdte = "internationaal"

bewering = "BREAKING: Russia has expressed part of its conditions to END the Ukraine war:  - Finland out of NATO.  - No NATO bases in the Baltics.  - All of Donbas handed to Russia.  In return, Russia would WITHDRAW its nuclear weapons from Belarus."
platform = "X"
eerst_gezien = "2026-11-13"
posts = 4
bereik = "1,580 likes on the post shown and 4,987 on the most liked post we read, on November 23"

kort = """
On November 13, posts on X presented it as fact that Russia had demanded at the peace talks in Abu Dhabi that Finland \
leave NATO [2] [4] [5]. The claim comes from a report that morning in the German newspaper Bild, which did not name its \
sources and said it was not known whether President Putin backed the proposal [1] [7]. The Kremlin denies it, and \
Finland's president says he never heard such a demand from a Russian [8] [17] [18]."""

tekst = """
On the morning of November 13, Bild reported that Russia wanted Finland out of NATO, no NATO bases in Estonia, Latvia \
and Lithuania, and all of the Donbas region, and would in return withdraw its nuclear weapons from Belarus [1] [6] [7]. \
According to Yle, Finland's public broadcaster, Bild said the proposal came from Putin's inner circle and was presented \
unofficially to European representatives in Abu Dhabi [6]. On its Russian-language channel, Bild called it one of \
several proposals from competing groups of intermediaries [1].

At 11:03 UTC, an account called Bedouin Report posted Russia's supposed conditions under the word BREAKING, without a \
source [2]. By then, the Kremlin had already denied it [8]. At 10:48 UTC, the Azerbaijani news agency APA quoted spokesman \
Dmitry Peskov saying no such demand was made [8] [9].

Finland's Defence Minister Antti Häkkänen said on November 13 that he had no information on whether the demand was made \
[10]. On November 17, President Alexander Stubb said it was not a claim to be taken seriously in any form, and that he \
had not heard it from a single Russian, according to the newspaper Ilta-Sanomat [17] [18].

The Russian-language outlet Echo, also citing unnamed sources, wrote that one negotiating group gave the Europeans a \
list that included Finland returning to its status before NATO [12]. The New York Times obtained a Russian paper dated \
November 10 that asks NATO to pull its troops and bases back to where they stood in 1997, but its article does not \
mention Finland [13] [14].

Finland joined NATO in April 2023, and under the North Atlantic Treaty only a member itself can give notice to leave \
[9] [16]."""

niet_weten = """
We do not know who Bild's sources are, or whether anyone in Abu Dhabi put such a demand to the Europeans [6] [7]. \
Bild's full article is for subscribers; its opening says the proposal came from unofficial talks and from Putin's circle \
[19], and the rest we know from its Russian-language channel and other media [1] [6] [7]. The Kremlin is a party to the \
talks, so its denial does not settle the question [8]."""

auteur = "Claude (AI)"
nalezer = "De redactie van Factiz"
gepubliceerd = "2026-11-23"

nog_doen = []

nog_uitzoeken = [
  "Who Bild's sources are, and whether a European government that was in Abu Dhabi confirms or denies that it received such a list.",
  "Whether the full Russian paper that The New York Times obtained says anything about Finland. The article about it does not.",
  "We hesitated between Unproven and Misleading. The posts turn a report with unnamed sources, which the Kremlin denies, into a fact, which points to Misleading; whether the demand was made is not known, which made us choose Unproven.",
]

