[pytest]
testpaths = tests
# De naam van elke falende test in de samenvatting: een rode suite achter een
# `tail` verloor eerder zijn naam, en dan is een wisselvallige test niet te vinden (§85).
addopts = -rf
pythonpath = .
markers =
    nli: laadt het NLI-model (traag; sla over met -m "not nli")
    echte_config: leest de echte config.toml, met rechter en feitenlaag zoals ze daar staan
